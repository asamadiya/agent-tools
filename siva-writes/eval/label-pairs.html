 is 6 engineer-days. Office hours run Tuesdays and 41 teams have attended. Write the org-wide deprecation status update addressed to the engineering leads of every consuming team.", "A": "li-httpclient v3 migration: 612 multiproducts left, builds fail Dec 1 2026\n\n612 of the 1,000 multiproducts that consume li-httpclient are still on v3, and their builds start failing on Dec 1 2026, two months before v3 reaches end of life on Jan 31 2027. 388 multiproducts, 38.8% of the fleet, are already on v4. Clearing the remaining 612 in the 74 days before enforcement takes 8.3 multiproducts landing per day, every day, including the ones that need hand edits.\n\nv3 cannot be patched for CVE-2026-31819. The flaw is an HTTP request-smuggling bug in Netty 4.1.79 with a CVSS base score of 7.5, and v3 pins that exact Netty version. Advancing the pin changes types on the public surface and breaks v3's ABI, so every consumer would have to recompile and retest regardless. Given that cost, the fix ships in v4 and only in v4.\n\nAn automated codemod does 84% of the call-site work. It rewrites 7,910 of the 9,417 call sites across consuming code and leaves 1,507 for hand edits. Those 1,507 are not spread thin across the fleet; they sit in 63 multiproducts. If yours is one of them, your migration is a code change with review, not a version bump.\n\nTwo v4 changes fall outside the codemod entirely. v4 renames every connection-pool configuration key, so any pool size, connect timeout or idle-eviction value you carry in a config file or LiX needs its new name before the client will read it. v4 also drops support for HTTP/1.0 upstreams. 17 upstreams still speak HTTP/1.0 today, and each one needs either a fix from the upstream owner or a proxy shim in front of it, which is a cross-team negotiation rather than an afternoon of edits.\n\nBudget 6 engineer-days. That is the median across teams that have finished, and it covers the codemod run, the hand edits, the config-key rename and a canary. The 63 hand-edit multiproducts and the callers of the 17 HTTP/1.0 upstreams should expect to land above that median, because both categories add work the codemod never touches.\n\nThe exemption process buys 30 days at a time. 22 exemptions have been granted so far, and 9 of them went to the same three teams, which means those teams are re-applying every month instead of migrating. An exemption does not move Jan 31 2027, and a team stacking three of them has now spent more calendar time on renewals than the 6-day median migration costs.\n\nDo three things this week. Check whether your multiproduct appears in the list of 63 that need hand edits, because that determines whether you are scheduling a day or a sprint. Run the codemod against your repo now and count the call sites it leaves, which gives you your own number instead of the fleet average. If you call one of the 17 HTTP/1.0 upstreams, open the conversation with that upstream owner today, since their fix has to land before yours can.\n\nOffice hours run Tuesdays and 41 teams have attended so far. Bring the codemod output and the residual call-site count; that is enough to get a migration sized in the session. Tomasz Hejna owns li-httpclient and takes escalations on upstream owners who will not commit to a date.\n\nThe numbers above are current as of this update. I will report the v4 adoption share, the remaining multiproduct count and the outstanding HTTP/1.0 upstreams every two weeks until Dec 1 2026.\n", "B": "li-httpclient v3: 612 multiproducts left, builds start failing Dec 1\n\nTo engineering leads of every team consuming li-httpclient\n\n612 of the 1,000 multiproducts that consume li-httpclient are still on v3, and v3 builds start failing on Dec 1 2026. That is 74 days from today. 388 multiproducts have moved to v4, or 38.8%, which means the migration is not quite two-fifths done with about ten working weeks left before enforcement and the library's end of life on Jan 31 2027.\n\nThe reason v3 cannot simply be patched in place is worth stating once, because it determines that there is no third option. CVE-2026-31819 is an HTTP request-smuggling flaw in Netty 4.1.79, CVSS 7.5. v3 pins 4.1.79. Moving that pin forward breaks the ABI v3 publishes, so the fix cannot ship to v3 consumers under any version of v3. Every consuming multiproduct either moves to v4 or keeps running a smuggling-vulnerable HTTP stack in production.\n\nMost of the work is mechanical. The codemod rewrites 7,910 of 9,417 call sites, 84%, and for a typical team that is the entire job. The residue is 1,507 hand edits, and they are not spread evenly: 63 multiproducts hold all of them, roughly 24 edits apiece. Two things defeat the codemod. v4 renames every connection-pool configuration key, so any pool config assembled at runtime or read from a config file rather than written as a literal has to be mapped by hand. v4 also drops support for HTTP/1.0 upstreams, and 17 upstreams are known to still speak HTTP/1.0. Each of those needs a fix on the upstream owner's side or a proxy shim in front of it, and that is cross-team work with a lead time your own migration does not control.\n\nTeams that have finished took a median of 6 engineer-days. Across the 612 remaining, that is roughly 3,700 engineer-days of work still outstanding, which is the number I would ask you to look at hardest. Six days is a sprint item for one engineer, not a quarter of work, but it is six days that has to be scheduled rather than absorbed.\n\nExemptions exist and they are not a plan. The process grants 30 days at a time. We have granted 22 so far, and 9 of those went to the same three teams, which means those teams have been renewing rather than migrating. A 30-day grant from Dec 1 lands on Dec 31, one month before v3 stops existing. There is no exemption that reaches past Jan 31 2027.\n\nWhat I am asking each lead to do this week:\n\nCheck whether your multiproduct is one of the 63 carrying hand edits, and whether any of your upstreams is one of the 17 still on HTTP/1.0. If either is true, start now -- your six days is an underestimate and your HTTP/1.0 dependency may not be yours to fix. If neither is true, run the codemod and schedule the 6 engineer-days into the next sprint.\n\nOffice hours run Tuesdays. 41 teams have attended, out of 612 remaining -- about 7%. There are roughly ten Tuesdays left before enforcement, and the session is the fastest way to get the pool-key mapping for a non-literal config or to find out who owns the HTTP/1.0 upstream you depend on.\n\nTomasz Hejna owns li-httpclient and owns this migration. Bring the hard cases to him early, while a shim still has time to land.\n"}, {"pair_id": "p020", "brief": "Raw material, Cloudflare, 18 November 2025 incident, downstream blast radius only, all times UTC. Workers KV returned heavily elevated 5xx because its front-end gateway calls the core proxy, which was failing. At 13:04 a patch let Workers KV bypass the core proxy; everything downstream of KV, including Access, saw error rates fall. Cloudflare Access saw widespread authentication failures from the start of the incident until the 13:05 rollback. Existing Access sessions kept working. Every failed authentication ended at an error page, so no user reached a target application while auth was broken, and successful logins during the window were logged correctly. Access configuration updates attempted during the window either failed outright or propagated very slowly; all have since been recovered. The Dashboard depends on Workers KV internally and on Turnstile in the login flow; Turnstile failed to load, so anyone without an active session could not log in. Dashboard availability dropped across two separate windows: 11:30 to 13:10, ended by the KV bypass at 13:10, and 14:40 to 15:30, caused by a backlog of queued login attempts plus retries after the feature file was restored, ended by scaling control plane concurrency around 15:30. Email Security kept processing and delivering mail but lost access to an IP reputation source, reducing spam-detection accuracy and suppressing some new-domain-age detections; some Auto Move actions failed and were later remediated. CDN response latency also rose because debugging and observability systems consumed large amounts of CPU enriching uncaught errors. Write the impact analysis section of the postmortem for affected enterprise customers.", "A": "Impact analysis: downstream services, 18 November 2025 (all times UTC)\n\nEvery downstream failure in this incident arrived through one of two edges in the dependency graph -- Workers KV's front-end gateway calling the failing core proxy, or Turnstile in the Dashboard login flow -- and not through independent faults in the affected products. Workers KV returned heavily elevated 5xx for the duration because its gateway sits in front of the core proxy and inherited the proxy's failures. That is why one patch fixed most of the blast radius at once: at 13:04 we let Workers KV bypass the core proxy, and error rates fell across every service that reads KV, Access among them.\n\nCloudflare Access failed closed, so no user reached a target application on a broken authentication. Authentication failed widely from the start of the incident until the rollback at 13:05. Every failed authentication terminated at an error page, existing Access sessions continued to work throughout, and the logins that did succeed during the window were logged correctly. Your access logs for this window are complete and no unauthorized session was created by the failure mode.\n\nAccess configuration changes attempted during the window are the one place where you should verify state yourself. Updates submitted while the incident was active either failed outright or propagated very slowly; all have since been recovered. Re-read any Access policy or application configuration you pushed between the start of the incident and 13:05, and confirm it matches what you intended.\n\nThe Dashboard lost availability in two windows with different causes. The first ran 11:30 to 13:10 and ended when the Workers KV bypass reached the Dashboard's internal KV dependency at 13:10; through it, Turnstile failed to load, so anyone without an active session had no path through the login flow at all. The second ran 14:40 to 15:30 and was produced by our own recovery: once the feature file was restored, a backlog of queued login attempts plus client retries exceeded control plane capacity. Scaling control plane concurrency around 15:30 ended it.\n\nEmail Security delivered mail throughout and degraded in detection accuracy, not in delivery. The service lost access to an IP reputation source, which lowered spam-detection accuracy and suppressed some new-domain-age detections. Some Auto Move actions failed during the window and have since been remediated. Mail that arrived between 11:30 and 15:30 passed through a weaker filter than normal, so treat that window's delivered mail as under-filtered and re-scan it against your own quarantine policy.\n\nCDN response latency rose from observability overhead rather than from capacity loss. The debugging and observability systems consumed large amounts of CPU enriching the uncaught errors the core proxy was generating, and that CPU came out of the same machines serving your traffic. Latency in this window is not a signal about your origin, your cache hit ratio, or your plan's capacity.\n\nThree items need action on your side. Re-verify Access configuration pushed before 13:05. Re-scan email delivered during the incident window against your quarantine policy, because the IP reputation source was missing from the decision. Discount CDN latency between 11:30 and 15:30 when you compute the month's performance baselines, and tell us if you see elevated latency after 15:30, because that would be impact we have not accounted for here.\n", "B": "Impact analysis: 18 November 2025 incident (all times UTC)\n\nWorkers KV returned heavily elevated 5xx for the length of the incident, and every service downstream of it inherited that failure. The KV front-end gateway calls our core proxy, and the core proxy was failing, so the gateway had no path to serve reads or writes. At 13:04 we deployed a patch that let Workers KV bypass the core proxy entirely. Error rates fell at that point for KV itself and for everything reading from it, including Access and the Dashboard.\n\nCloudflare Access failed authentication requests widely from the start of the incident until the rollback at 13:05. Existing sessions were unaffected: a user who had already authenticated kept reaching your applications throughout. Every failed authentication terminated at a Cloudflare error page, which is the point that matters for your security review -- no user reached a protected application without authenticating, and the logins that did succeed were recorded correctly. Access configuration changes you attempted during the window either failed outright or propagated very slowly. All of them have since been recovered, and you do not need to reapply them.\n\nThe Cloudflare Dashboard was unavailable across two separate windows, 11:30 to 13:10 and 14:40 to 15:30, and the two have different causes. The Dashboard reads Workers KV internally and calls Turnstile in its login flow. Turnstile failed to load through the first window, so an administrator without an active session could not log in at all. The KV bypass ended that window at 13:10. The second window opened after we restored the feature file: queued login attempts and client retries arrived together, and the control plane could not absorb the backlog. We scaled control plane concurrency at roughly 15:30 and the Dashboard recovered.\n\nEmail Security continued to process and deliver mail throughout, with degraded detection. The service lost access to one IP reputation source, which reduced spam-detection accuracy and suppressed some detections that key on domain age. No mail was dropped or delayed. A number of Auto Move actions failed to apply; we have identified the affected messages and remediated them.\n\nCDN response latency rose for the duration of the incident, through a path independent of the products above. Our debugging and observability systems enrich uncaught errors before recording them, the volume of uncaught errors ran far above normal, and that enrichment consumed large amounts of CPU on the machines serving your traffic. Requests were answered; they were answered more slowly.\n\nThree checks are worth running on your side. Pull your Access authentication logs for 11:30 to 13:05 and reconcile the successful logins against your expectation -- those records are accurate, so a gap in them is a genuine failed attempt rather than lost telemetry. Review any Access configuration change you made during that window and confirm the current state matches what you intended, since a slow-propagating change may have landed later than you observed it. For Email Security, re-examine quarantine and inbox placement for mail that arrived between 11:30 and 15:30; what you lost there was accuracy, and messages that should have been quarantined may be sitting in user inboxes.\n\nThe Access, Dashboard and Email Security effects all trace back to the same core proxy failure, and the 13:04 KV bypass is the single change that cleared the bulk of them. The Dashboard's second window and the Email Security remediation are the two pieces of recovery that ran past it.\n"}, {"pair_id": "p021", "brief": "Raw material. Paul E. McKenney published Stochastic Fairness Queuing in 1990. Baseline fairness queuing keeps a separate FCFS queue per conversation and services queues bit-by-bit round-robin; ill-behaved conversations that exceed their fair share get longer delays and higher packet loss than well-behaved ones. The same construction works for RPC traffic by keying on something else, such as authorized customer id, instead of a source-destination address pair. Cost of the baseline in a distributed system: O(customers) queues plus O(customers) work to round-robin across them. SFQ replaces per-conversation queues with a fixed set of queues and a simple hash mapping into them: O(1) queues, O(1) time. New problem: two conversations that collide keep colliding, so each persistently receives less than its share. Remedy: periodically perturb the hash function so colliders in one period are unlikely to collide in the next. A further variant combines SFQ with shuffle sharding and best-of-two: map each customer to a subset of queues (possibly just two), enqueue each request into the shortest queue in that customer's subset, and periodically perturb subsets. Properties: O(1) queues, O(1) enqueue, O(1) dequeue, strong noisy-neighbour isolation provided only a small portion of customers are noisy. Usable on a single host or across hosts for load balancing. Write a design doc proposing a request-queuing scheme for a multi-tenant RPC service.", "A": "Paul E. McKenney\u2019s 1990 paper Stochastic Fairness Queuing contains one of my favorite little algorithms for distributed systems. Stochastic Fairness Queuing is a way to stochastically isolate workloads from different customers in a way that significantly mitigates the effects of noisy neighbors, with O(1) queues and O(1) time. McKenney starts by describing Fairness Queuing (or queue per client ): This fairness-queuing algorithm operates by maintaining a separate first-come-first-served (FCFS) queue for each conversation. \u2026 Since the queues are serviced in a bit-by-bit round-robin fashion ill-behaved conversations that attempt to use more than their fair share of network resources will face longer delays and larger packet-loss rates than well-behaved conversations that remain within their fair share. This fairness-queuing algorithm operates by maintaining a separate first-come-first-served (FCFS) queue for each conversation. \u2026 Since the queues are serviced in a bit-by-bit round-robin fashion ill-behaved conversations that attempt to use more than their fair share of network resources will face longer delays and larger packet-loss rates than well-behaved conversations that remain within their fair share. That\u2019s a network packet focused view, but the same thing can apply to RPC requests, for example, just by using a different key (e.g. the authorized customer id). The big downside of this in distributed systems is that it requires O(customers) queues, and the related O(customers) work of doing round-robin across those queues. Stochastic fairness queuing can be most easily understood by comparing it to strict fairness queuing. The major differences are that the queues are serviced in strict round-robin order and that a simple hash function is used to map from source-destination address pair into a fixed set of queues. Stochastic fairness queuing can be most easily understood by comparing it to strict fairness queuing. The major differences are that the queues are serviced in strict round-robin order and that a simple hash function is used to map from source-destination address pair into a fixed set of queues. In SFQ, on the other hand, a fixed set of queues is used (so O(1) queues, not O(customers) queues), and customers are assigned to the queues based on a hash. That\u2019s great, but still causes the problem of long-term bad luck. If I end up on a queue with a noisy neighbor, I end up there forever. If two conversations collide, they will continue to collide, resulting in each conversation of the pair persistently receiving less than its share of bandwidth. This situation is deviated by periodically perturbing the hash function \u2026 so that conversations that collide during one time period are very unlikely to collide during the next. If two conversations collide, they will continue to collide, resulting in each conversation of the pair persistently receiving less than its share of bandwidth. This situation is deviated by periodically perturbing the hash function \u2026 so that conversations that collide during one time period are very unlikely to collide during the next. So noisy neighbors and non-noisy clients move around, preventing somebody from getting bad service for too long. You can use this on a single host for servicing multiple clients, or for load balancing across multiple hosts. SFQ, Shuffle Sharding, and Best-of-2 We can avoid even those periodic times of bad service by combining three of my favorite small algorithms: SFQ, shuffle sharding , and best of two . In this variant we: Map each customer to a subset of the queues (that subset could be only two), and For each request put the customer\u2019s request in the shortest queue in their subset, and Periodically perturb the subsets. This approach has absolutely great properties: O(1) queues, O(1) enqueue effort, O(1) dequeue effort, and strong isolation of noisy neighbors from other customers (assuming only a relatively small portion of customers are noisy neighbors).", "B": "Request queuing for a multi-tenant RPC service\n\nProblem\n\nToday every request lands in one FIFO queue per host. That queue is a shared fate pool: when one customer sends a burst, or sends requests that are individually expensive, its work sits ahead of everyone else's, and every other customer's latency rises with the depth of the burst. We have no mechanism that makes the cost of misbehaviour fall on the misbehaving customer. Admission control by global rate limit does not fix this, because a customer inside its limit can still be the only thing in the queue for a hundred milliseconds.\n\nWhat we want is the property fair queuing gives packet networks: a customer that exceeds its share sees longer delays and more shed load than one that stays within it, and the well-behaved customers do not notice.\n\nWhy not classic fair queuing\n\nThe textbook construction (per-conversation FCFS queues, serviced round-robin) transfers cleanly to RPC if we key on authorized customer id instead of a source-destination address pair. It also transfers its cost. We hold O(customers) queues and spend O(customers) work walking them per dispatch. With tens of thousands of authorized customers per fleet, and a dispatch budget measured in microseconds, that is not a structure we can afford in the request path.\n\nProposal\n\nAdopt Stochastic Fairness Queuing (McKenney, 1990), extended with shuffle sharding and best-of-two choices.\n\nKeep a fixed set of Q queues per host, sized independently of the customer count. Hash the customer id to select queues; dispatch round-robin over the Q queues. Queue count and dispatch cost are now constants: O(1) queues, O(1) enqueue, O(1) dequeue.\n\nPlain SFQ has one failure mode worth naming. Two customers whose ids hash to the same queue keep hashing to the same queue, so a customer unlucky enough to share with a noisy neighbour is persistently below its share -- not for one burst, but forever. The remedy is to perturb the hash function periodically: a collision in one period does not predict a collision in the next, so the penalty is spread thin across customers and across time rather than concentrated on one victim.\n\nWe go a step further. Instead of mapping each customer to one queue, map it to a small subset -- two is enough to get most of the benefit -- and enqueue each request into the shorter of the two. Subsets are perturbed on the same period as the hash. This is shuffle sharding with best-of-two choices, and it buys two things. First, isolation is now combinatorial: a customer is harmed only if every queue in its subset is shared with a noisy neighbour, which is rare so long as only a small fraction of customers are noisy. Second, best-of-two smooths transient imbalance without any coordination, because the enqueue already knows both depths.\n\nScope\n\nThe same construction works at two levels and we propose both, in order. On a single host it governs which request the worker pool picks up next. Across hosts it can drive load balancing: the subset is a set of hosts, and the choice is the shorter of two host queues. Ship the single-host version first; it is self-contained, and it tells us whether the shed behaviour under burst is what we expect before we let the scheme influence routing.\n\nTradeoffs and open questions\n\nThe guarantee is statistical, not absolute. If a large fraction of customers are simultaneously noisy, subsets overlap and isolation degrades toward the shared-FIFO behaviour we have now. We accept that: the design targets the noisy-neighbour case, not overload.\n\nThree parameters need measurement rather than assertion: Q, subset size, and perturbation period. Q trades memory against collision probability. The period trades isolation against churn -- perturbing too often reorders work for customers that were doing nothing wrong. We propose picking initial values from replay against production traces, and reporting per-customer p99 delay under a synthetic single-noisy-tenant load as the acceptance test.\n"}, {"pair_id": "p022", "brief": "Raw material, Cloudflare, 21 August 2025, all times UTC. A single customer began requesting large volumes of cached objects from AWS us-east-1 at about 16:27, and the response traffic doubled total Cloudflare-to-AWS traffic, saturating every direct peering link between the two networks. At 16:37 AWS started withdrawing BGP advertisements on congested private network interconnects to shed load; that steered traffic onto peering links reached through an offsite interconnection switch, which then also saturated. Two pre-existing conditions made it worse: one direct peering link was running at half capacity due to an earlier failure, and the Data Center Interconnect to the offsite switch was already due for a capacity upgrade. 16:44 the network team is alerted to congestion in Ashburn (IAD); 16:45 responders find that uncongested paths no longer carry AWS prefixes because of the withdrawals; 17:22 dropped traffic increases; 17:45 a customer-impact incident is raised; 19:05 rate-limiting the customer reduces congestion; 19:27 traffic engineering fully resolves congestion; 19:45 AWS begins reverting withdrawals; 20:07 AWS finishes normalizing announcements over IAD PNIs; 20:18 impact ends. Router queues grew and edge routers dropped high-priority packets throughout. Customers saw latency, timeouts and low throughput; the share of synthetic origin requests missing the latency SLO tracked the packet drops. Latency recovered after drops because both sides were renormalizing prefix advertisements. Regional only; global Cloudflare services were unaffected. Not an attack, not a BGP hijack. Write the public postmortem for customers with origins in AWS us-east-1.", "A": "Cloudflare congestion affecting customer origins in AWS us-east-1\n\n21 August 2025. All times UTC.\n\nSummary\n\nBetween 16:27 and 20:18 on 21 August 2025, requests Cloudflare made to origins in AWS us-east-1 saw elevated latency, connection timeouts and reduced throughput. The cause was congestion on the network paths between Cloudflare and AWS in the Ashburn (IAD) metro, which lasted three hours and fifty-one minutes. Impact was regional and global Cloudflare services were unaffected. This was not an attack and not a BGP hijack. We are sorry for the disruption, and for the 78 minutes it took us to raise a customer-impact incident.\n\nWhat happened\n\nA single customer began requesting large volumes of cached objects from AWS us-east-1 at about 16:27. The response traffic doubled total Cloudflare-to-AWS traffic and saturated every direct peering link between the two networks. Two pre-existing conditions had already narrowed the headroom that would otherwise have absorbed part of the surge: one direct peering link was running at half capacity after an earlier failure, and the Data Center Interconnect to an offsite interconnection switch was already queued for a capacity upgrade.\n\nAt 16:37 AWS began withdrawing BGP advertisements on the congested private network interconnects to shed load. Those withdrawals steered the traffic onto peering links reached through the offsite interconnection switch, and that path saturated in turn. The withdrawals also removed AWS prefixes from paths that were not congested, so the routes our traffic engineering would have shifted onto no longer existed. Router queues grew and edge routers dropped packets, including packets we classify as high priority and normally protect under load.\n\nCustomer impact\n\nRequests to AWS us-east-1 origins returned slowly, timed out, or completed at low throughput. We measure this with synthetic origin requests, and the share of those requests missing the latency SLO tracked the packet drop rate closely throughout the event. Latency stayed elevated for a period after the drops stopped, because both networks were renormalizing prefix advertisements during that window and paths were still shifting. Traffic to origins outside AWS us-east-1 was not affected.\n\nTimeline\n\n16:27 -- Customer request volume rises; direct peering links between Cloudflare and AWS saturate.\n16:37 -- AWS begins withdrawing BGP advertisements on congested PNIs.\n16:44 -- Our network team is alerted to congestion in IAD, 17 minutes after onset.\n16:45 -- Responders determine that uncongested paths no longer carry AWS prefixes.\n17:22 -- Dropped traffic increases.\n17:45 -- A customer-impact incident is raised.\n19:05 -- Rate-limiting the customer reduces congestion.\n19:27 -- Traffic engineering fully resolves congestion.\n19:45 -- AWS begins reverting the withdrawals.\n20:07 -- AWS finishes normalizing announcements over IAD PNIs.\n20:18 -- Impact ends.\n\nWhat we are changing\n\nOur capacity planning treated the degraded peering link and the pending DCI upgrade as separate items on separate schedules. Neither was urgent alone. Together they removed the spare capacity that a single large traffic shift needed, and we are changing how we account for that: a link running degraded now counts against available headroom for the metro, and a DCI upgrade blocking a saturated path is escalated rather than queued.\n\nWe are adding per-customer egress rate limits that trigger automatically. Rate-limiting the customer at 19:05 reduced congestion within minutes, and we reached that action two hours and thirty-eight minutes after onset.\n\nWe are working with AWS on a load-shed procedure that preserves advertisements on uncongested paths. Withdrawing prefixes globally to shed load on one set of interconnects removed our ability to route around the problem at 16:45, which is the point where this incident became long.\n\nWe are shortening the gap between a network alert and a customer-impact incident. The 61 minutes between 16:44 and 17:45 were spent diagnosing the network, not the customer path, and origin SLO data was available the whole time.\n", "B": "Incident report: congestion between Cloudflare and AWS us-east-1, 21 August 2025\n\nCustomers with origins in AWS us-east-1 saw elevated latency, timeouts and reduced throughput from 16:27 to 20:18 UTC on 21 August 2025, because one customer's cache-fill traffic doubled total Cloudflare-to-AWS traffic and the load-shedding that followed concentrated that traffic onto the paths that were left. All times below are UTC. Impact was limited to this interconnection; Cloudflare's global services carried normal traffic throughout. This was not an attack and no BGP hijack occurred.\n\nAt about 16:27 a single customer began requesting large volumes of cached objects stored in AWS us-east-1. Those responses travel from AWS into our network, and the added volume doubled total Cloudflare-to-AWS traffic, saturating every direct peering link between the two networks. Two pre-existing conditions removed the headroom that would normally have absorbed part of this. One direct peering link was running at half its capacity after an earlier failure, and the Data Center Interconnect carrying traffic to our offsite interconnection switch was already scheduled for a capacity upgrade.\n\nAt 16:37 AWS began withdrawing BGP advertisements on the congested private network interconnects to shed load. A withdrawal does not reduce the number of bytes customers are asking for; it deletes a path, and every packet still destined for those prefixes must take a path that remains advertised. The shed traffic moved onto peering links reached through the offsite interconnection switch, crossing the Data Center Interconnect that was already short of capacity, and that path saturated in turn. Router queues grew and edge routers dropped packets, including the high-priority packets our queueing policy exists to protect.\n\nOur network team was alerted to congestion in Ashburn (IAD) at 16:44, 17 minutes after the first links saturated. Responders confirmed at 16:45 that the uncongested paths they would have shifted traffic onto no longer carried AWS prefixes, which removed traffic engineering as an immediate option. Dropped traffic increased at 17:22, and we raised a customer-impact incident at 17:45.\n\nRate-limiting the customer at 19:05 was the action that reduced congestion, and traffic engineering fully resolved it at 19:27. AWS began reverting the withdrawn advertisements at 19:45 and finished normalizing announcements over the IAD private network interconnects at 20:07. Impact ended at 20:18, 3 hours and 51 minutes after the first saturation.\n\nThe share of synthetic origin requests missing our latency SLO tracked packet drops through the event, which is how we sized customer impact without depending on any single customer's telemetry. Latency stayed elevated for a period after drops stopped, because both networks were still renormalizing prefix advertisements and traffic had not yet settled back onto the direct paths.\n\nThe mechanism that turned a saturated link into a 3 hour 51 minute incident is that our fastest mitigation depended on alternate paths that load-shedding had withdrawn. We are making the following changes.\n\nWe are adding per-customer origin fetch rate limits at the edge, triggered by measured link utilization on the path toward the origin network, so a single customer's cache-fill cannot consume an entire interconnection's headroom before a human is alerted.\n\nWe are completing the Data Center Interconnect capacity upgrade to the offsite interconnection switch and restoring the failed direct peering link to full capacity. Both were known gaps on 21 August, and together they determined how quickly the second path saturated.\n\nInterconnect alerting will fire on utilization crossing a threshold instead of on the packet drops it eventually causes. Drops at 16:44 were a late signal; utilization crossed its saturation point at about 16:27.\n\nFinally, we have opened work with AWS on load-shedding behaviour that preserves reachability on at least one uncongested path, so that shedding traffic and removing our ability to reroute it stop being the same operation.\n\nCloudflare apologizes for the disruption to your origin traffic. If you observed impact outside the window above, please open a support ticket and include the affected hostnames.\n"}, {"pair_id": "p023", "brief": "Cost programme codenamed Trim. Owner Renee Alvarez, finance partner Sanjay Kothari, monthly reporting cadence. Target is $28M annualised infrastructure savings by end of FY27. Booked to date is $16.4M, 59% of target. Composition of the booked amount: $9.1M from right-sizing 6,800 over-provisioned pods, median CPU request cut from 4.0 cores to 1.5; $4.2M from deleting 41 PB of object storage untouched for more than three years; $3.1M from converting 62% of the steady-state fleet to reserved instances. The remaining $11.6M is planned as $7.0M from GPU bin-packing, where cluster utilization is 38% today against a 65% target, and $4.6M from decommissioning three legacy datacenter halls by June 2027. Right-sizing caused five incidents, four SEV-3 and one SEV-2, all CPU throttling on services whose p99 CPU sat close to the new request. A guardrail shipped Aug 20 now blocks any cut where measured p99 CPU exceeds 70% of the proposed request; it has rejected 410 of 1,100 candidate cuts since. GPU bin-packing depends on a scheduler change owned by another org with no committed date. Write the monthly programme status for the business review.", "A": "Trim \u2014 Monthly Programme Status\n\nOwner: Renee Alvarez. Finance partner: Sanjay Kothari.\nTarget: $28M annualised infrastructure savings by end of FY27.\nBooked to date: $16.4M (59% of target).\n\nWhere the $16.4M came from\n\nThree workstreams account for everything booked so far.\n\nRight-sizing over-provisioned pods contributed $9.1M. We cut requests on 6,800 pods and moved the median CPU request from 4.0 cores to 1.5. This is the largest single line in the programme and also the one that cost us the most operationally; see the incident section below.\n\nObject storage deletion contributed $4.2M. We removed 41 PB that had not been read in more than three years.\n\nReserved instance conversion contributed $3.1M. 62% of the steady-state fleet is now on reserved pricing.\n\nThe remaining $11.6M\n\nThe gap to target is planned, not yet booked, and it sits in two places.\n\nGPU bin-packing is scoped at $7.0M. Cluster utilization is 38% today against a 65% target, so the headroom is real. The work depends on a scheduler change owned by another org, and that change has no committed date. This is the programme's principal risk and I want it read as such rather than as a timeline detail: $7.0M \u2014 a quarter of the full target \u2014 is currently gated on a dependency we do not control and cannot schedule. We are not carrying a credible plan B at that size. If the scheduler change does not land with enough runway for us to bin-pack and hold the savings through FY27, the programme lands somewhere near $21M rather than $28M. The ask at this review is executive help getting a date committed, not more engineering capacity on our side.\n\nDecommissioning three legacy datacenter halls is scoped at $4.6M with a June 2027 completion date. This one is on our own critical path and is tracking.\n\nIncidents from right-sizing\n\nRight-sizing caused five incidents: four SEV-3 and one SEV-2. Every one was the same failure mode. Services whose p99 CPU sat close to the new request began throttling once the headroom was gone. The savings model was reading average utilization; the services were living at their p99.\n\nWe shipped a guardrail on August 20 that blocks any cut where measured p99 CPU exceeds 70% of the proposed request. Since then it has rejected 410 of 1,100 candidate cuts \u2014 37%. Two things follow from that number. First, the guardrail is doing real work; had it not been in place, we would have shipped several hundred more cuts with the same profile as the five that broke. Second, roughly a third of our remaining right-sizing pipeline was never bankable at the aggressiveness we had modelled. We have not restated the right-sizing forecast yet. We should, and I will bring a revised number next month rather than let the current one stand unexamined.\n\nCadence and what changes next month\n\nReporting stays monthly. Two items to expect at the next review:\n\nA restated right-sizing forecast reflecting the 37% rejection rate, so the booked-to-target picture stops flattering itself.\n\nA position on GPU bin-packing. If we still have no committed date from the scheduler owners by then, I will bring options for closing the gap without that dependency \u2014 most likely a larger reserved-instance conversion and an accelerated hall decommission \u2014 with honest estimates of what each can actually cover. Neither will cover $7.0M.\n\nSummary for the business review: 59% booked, the booked portion is solid, and the unbooked portion is concentrated in a single item we do not control. The headline number is still $28M. Whether it stays $28M is, at this point, mostly a question about someone else's scheduler.\n", "B": "Trim: $16.4M booked, $7.0M of the remainder blocked on another org\n\nTrim has booked $16.4M of its $28M annualised FY27 target, 59%, and $7.0M of the $11.6M remaining depends on a scheduler change another org owns with no committed date.\n\nThe booked $16.4M came from three actions, each a one-time inventory correction. Right-sizing 6,800 over-provisioned pods returned $9.1M and cut the median CPU request from 4.0 cores to 1.5. Deleting 41 PB of object storage untouched for more than three years returned $4.2M. Converting 62% of the steady-state fleet to reserved instances returned $3.1M. None of the three repeats next year: the pods are sized, the storage is deleted, and the conversion already covers the fleet that stays up.\n\nRight-sizing cost five incidents, four SEV-3 and one SEV-2, every one of them CPU throttling on a service whose p99 CPU sat close to its new request. The cuts were sized against average utilization, so a service with a spiky profile kept its average under the new ceiling and hit the ceiling at peak, where the kernel throttled it.\n\nA guardrail shipped Aug 20 blocks any cut where measured p99 CPU exceeds 70% of the proposed request, and it has rejected 410 of 1,100 candidates since. That 37% rejection rate measures how much of the original right-sizing pipeline was aimed at services that could not absorb a cut. No right-sizing incident has occurred since Aug 20.\n\nThe guardrail also caps what right-sizing can still return, and finance should treat the $9.1M as close to the ceiling for this lever. The first wave took the median request from 4.0 cores to 1.5 across 6,800 pods, $1,340 per pod per year, and that is where the bulk of the over-provisioning sat. Of the 1,100 candidates screened since Aug 20, the 690 that passed are pods already reviewed once and already closer to their true usage, so each returns well under $1,340.\n\nGPU bin-packing carries $7.0M of the remaining $11.6M and cannot begin until the scheduler change lands. Cluster utilization is 38% against a 65% target, and the 27-point gap is fragmentation: jobs hold whole GPUs they do not fill, and recovering the waste requires the scheduler to place several jobs on one device. That scheduler work sits with another org and has no committed date, which leaves the $7.0M with no date either.\n\nDecommissioning three legacy datacenter halls by June 2027 carries the other $4.6M and is the only remaining item Trim controls end to end. It is on plan for the June 2027 date.\n\nThe decision for this review is whether $7.0M stays in the FY27 forecast. If the scheduler owners commit a date before the October review, the $28M target holds and GPU bin-packing has roughly 20 months to move utilization from 38% to 65%. If they do not, the ceiling Trim can deliver on its own is $21.0M, 75% of target, and the $7.0M needs either a replacement source or a restated number in front of the board.\n\nTwo asks. Renee will get a written scheduler date, or a written refusal, from the owning org before the October review. Sanjay will hold the $28M forecast unchanged until that answer arrives, then re-forecast to $21.0M in a single revision if the answer is no.\n\nOne measurement worth taking before the next review: rerun the guardrail against the 6,800 pods already cut. If it would now reject some of them, the $9.1M booked from right-sizing includes services running closer to their ceiling than the guardrail permits today, and those pods should be raised back before they throttle. The five incidents all came from that population, and the guardrail has only ever been applied to candidates proposed after Aug 20.\n"}, {"pair_id": "p024", "brief": "Raw material. The empirical Lorenz curve L(P) answers: of total mean latency, how much is contributed by requests faster than percentile P. So 1-L(P) is the share contributed by requests at or above P. From raw samples: L = sum(sorted(x)[:k]) / sum(x), with n samples and k = p*n. From a quantile vector you must interpolate and extrapolate; a power-law fit is one option, exact only if you go back to sorted raw samples. Worked example: quantiles [1, 10, 200, 10000, 20000] ms measured at percentiles [0, 0.5, 0.9, 0.99, 0.999] give 1-L = [1, 0.9938, 0.9308, 0.5171, 0.1034]. Requests at or above p50 account for ~99% of mean latency; requests at or above p99 account for ~52%. Little's law makes that same fraction the share of system concurrency: in a threaded service, if 1-L(p)=k then 100k% of busy threads are occupied by requests that will finish above the pth percentile. Values of 1-L(0.99) above 0.5 or 0.75 are common. Constraints: tail alpha must exceed 1 or the mean is not estimable; measured percentiles are themselves estimates and uncertainty grows with the percentile. Write a design doc for a capacity and performance team on how to prioritise latency work against cost.", "A": "Prioritising latency work against cost with the latency Lorenz curve\n\nThe share of fleet capacity a latency fix can return is the same number as the share of total mean latency held by the requests it touches, and the Lorenz curve of the measured latency distribution reports that number directly. This document proposes that we compute it per service, per quarter, and rank latency projects by it against their cost.\n\nWhat the curve measures\n\nThe empirical Lorenz curve L(P) answers one question: of total mean latency, how much is contributed by requests faster than percentile P. Its complement, 1-L(P), is the share contributed by requests at or above P. Both are shares of a sum of service times, not of request counts, which is why the fast majority of a skewed distribution can contribute almost nothing.\n\nTake the worked example we already have: quantiles of 1, 10, 200, 10000 and 20000 ms measured at percentiles 0, 0.5, 0.9, 0.99 and 0.999. The complement evaluates to 1, 0.9938, 0.9308, 0.5171 and 0.1034. Requests at or above p50 account for 99.4% of mean latency. Requests at or above p99 -- one in a hundred -- account for 51.7%. Halving the service time of that top percent removes about a quarter of the mean. Improving the median removes almost nothing, because the median request contributes almost nothing to begin with. Values of 1-L(0.99) above 0.5, and sometimes above 0.75, are common in our services.\n\nWhy this is a capacity number and not only a latency number\n\nLittle's law carries the same fraction over to concurrency. Mean concurrency is arrival rate times mean residence time, and residence time decomposes by request class exactly as the Lorenz sum does. In a threaded service, if 1-L(p) = k then 100k% of busy threads at any instant are occupied by requests that will finish above the pth percentile. At 1-L(0.99) = 0.5171, half of every thread pool in the fleet is sitting behind requests that make up one percent of traffic. That is a spend, in instances and in licences, and it is the number to put beside the engineering cost of the fix.\n\nHow to compute it\n\nCompute from sorted raw samples when you can. With n samples, L(p) = sum(sorted(x)[:k]) / sum(x) with k = p*n. That is exact, cheap, and it is the only form we should accept in a funding argument.\n\nFrom a quantile vector you must interpolate between the measured points and extrapolate past the highest one, and the answer inherits the error of both. Fitting a power law to the tail is one workable option. It is a model, not a measurement, and it is exact only if someone goes back to the sorted raw samples. Record which of the two produced any number quoted.\n\nConstraints on the result\n\nThe tail index alpha must exceed 1. At alpha <= 1 the mean is not estimable, the denominator of L has no stable value, and every share computed from it is noise dressed as a percentage.\n\nMeasured percentiles are themselves estimates, and their uncertainty grows with the percentile. p99.9 from an hour of a low-rate endpoint rests on a handful of samples. Report 1-L with the sample count behind its highest quantile, and prefer a lower percentile band with tight estimates to a high one with wide ones.\n\nWhat we ask for\n\nInstrument the p50, p90, p99 and p99.9 bands with raw-sample capture behind them, publish 1-L(P) per service alongside the latency dashboard, and state every proposed latency project as an expected change in 1-L over a named band. A project that moves 1-L(0.99) from 0.52 to 0.35 has a concurrency saving we can price. A project that improves the median has one we cannot.\n", "B": "Design doc: pricing latency work with the latency Lorenz curve\n\nStatus: proposal. Owner: Capacity and Performance.\n\nThe decision\n\nEvery quarter we choose between buying machines and making slow requests faster, and we argue that choice on percentile targets that carry no cost term. A p99 of 10 s is a fact about one request in a hundred. It says nothing about how much hardware those requests are holding. This document proposes that we compute the latency Lorenz curve for each tier and use it as the conversion between a percentile and the fraction of the fleet that percentile occupies.\n\nThe measure\n\nThe empirical Lorenz curve L(P) gives the share of total mean latency contributed by requests faster than percentile P, so its complement 1-L(P) is the share contributed by requests at or above P. Compute it from sorted raw samples: with n samples and k = P*n, L = sum(sorted(x)[:k]) / sum(x). That is exact. From a stored quantile vector you must interpolate between the recorded points and extrapolate past the last one; a power-law fit on the tail is one workable choice, and it is an estimate, not the curve.\n\nA worked example\n\nTake quantiles [1, 10, 200, 10000, 20000] ms recorded at percentiles [0, 0.5, 0.9, 0.99, 0.999]. The complement is 1-L = [1, 0.9938, 0.9308, 0.5171, 0.1034]. Read the fourth entry: requests at or above p99 contribute 51.71% of mean latency, and the other 99% of requests contribute 48.29% between them. The slowest one request in a thousand contributes 10.34%. Halving the p99 population's service time moves mean latency about as far as halving everything else combined.\n\nWhy this is a cost number\n\nLittle's law turns that share into occupied capacity: if 1-L(P) = k in a threaded service, then 100k% of busy threads are held by requests that will finish at or above the Pth percentile. In the example, 51.71% of busy threads serve that top 1% -- 103 of a 200-thread pool. Fleet size is set by concurrency, not by the median. Values of 1-L(0.99) above 0.5, and often above 0.75, are common in our tiers, which is why tail work and machine purchases are substitutes.\n\nConstraints on the number\n\nTwo conditions bound what the curve proves. The tail index alpha must exceed 1 or the mean is not estimable and L is undefined, so we fit alpha before reporting and we suppress the curve when the fit returns alpha <= 1. Measured percentiles are themselves estimates, and their uncertainty grows with the percentile: p999 from a one-minute window of a few thousand requests is a handful of samples. Report 1-L(0.99) with a confidence interval from bootstrapped samples and treat anything past p999 as directional.\n\nProposed use\n\nEach tier reports 1-L(0.99) and 1-L(0.999) weekly beside its QPS and instance count. Prioritise a latency investigation over a capacity request when 1-L(0.99) exceeds 0.5, because at that point the top percentile holds more than half the concurrency the fleet is provisioned for, and a fix returns hardware. Below 0.25, buy the machines and move the engineers elsewhere.\n\nWork required\n\nSampling is the gap. Our metrics pipeline stores quantile vectors only, which forces interpolation at exactly the region we care about. We propose reservoir-sampling 10,000 raw latencies per tier per five-minute window, which supports an exact L up to p999 with roughly 10 samples in the last bucket, and computing the curve in the existing rollup job. Estimated cost is one additional column per tier and one batch step.\n\nOpen question: whether to weight the curve by request cost class before aggregating tiers that mix cheap and expensive endpoints.\n"}, {"pair_id": "p025", "brief": "A 20-year history piece on frame pointers, written March 2024. Background the reader needs: %rbp is the x86-64 ABI's frame pointer, the register holding the base of the current stack frame, and external profilers and debuggers - Linux perf, eBPF - walk stacks by following it, which is what makes flame graphs possible. The ABI marks that use as optional: code can index into the frame off %rsp instead, which drops two instructions from each function's prologue and epilogue and hands back one general-purpose register.\n\n2004: gcc developer Roger Sayle patched the i386 backend so that 32-bit targets compiled as though -fomit-frame-pointer -ffixed-ebp had been passed. On i386 that mattered: four general-purpose registers became five, or six to seven if you count %si and %di. Sayle gave two further reasons - he wanted to beat Intel's icc on benchmarks, and he took the view that debuggers of the day would be unharmed, since they supported other ways of walking a stack.\n\nThe extension: the same default was carried across to x86-64, a target that already had more than a dozen registers and so gained very little from one more. Eric Schrock, then at Sun, objected in November 2004. On amd64, he wrote, a 17th general-purpose register opens up no new class of compiler optimization; all you avoid is a pushl/movl sequence that the hardware has long since optimized; leaf routines never establish a frame at all; and set against the cost in lost debuggability the trade hardly seemed worth making. His closing line: the practice goes off the rails once people begin compiling /usr/bin without frame pointers. Linux then did exactly that, and not only /usr/bin - /usr/lib and application code too.\n\nWhat it costs in practice: a stack walk terminates when it reaches libc, so the trace comes back without its application frames, and those truncated stacks pile up together on the left edge of a flame graph - 15% of the samples in one example. Off-CPU flame graphs come off worse still, since libc read/write and mutex calls are most of what they contain.\n\n2014, joining Netflix: Java had no frame pointer support, which broke every application stack. The author wrote a c2 compiler fix for the JVM; Oracle reworked it and shipped it as -XX:+PreserveFramePointer in JDK8u60. libc came next - he built his own with frame pointers for production, then worked with Canonical on a prebuilt libc6-prof.\n\nWrite the historical narrative section of a technical blog post for systems and performance engineers.", "A": "Twenty Years of Missing Frames\n\nOn x86-64, %rbp is the frame pointer: the register that holds the base of the current stack frame. Keeping it means every function's prologue and epilogue carry two extra instructions and one general-purpose register is spoken for. Giving it up buys those back. What it costs is the ability of anything outside the process - Linux perf, eBPF, a debugger attached after the fact - to walk the stack by chasing %rbp from frame to frame. That walk is what a flame graph is made of. The ABI says the frame pointer is optional; you can index off %rsp instead. Compilers took the option, and the profiling story has been paying for it ever since.\n\n2004: the patch\n\nIn 2004, gcc developer Roger Sayle changed the i386 backend so that 32-bit targets compiled as though -fomit-frame-pointer -ffixed-ebp had been passed. On i386 the argument was easy to make. Four general-purpose registers became five, or six to seven if you count %si and %di - a register file that small makes every additional register worth real performance. Sayle had two other reasons. He wanted gcc to beat Intel's icc on benchmarks, and he believed debuggers of the day would be unharmed, because they already supported other ways of walking a stack.\n\nWhether or not that was the right call for i386, the default did not stay there. It was carried across to x86-64, a target that already had more than a dozen general-purpose registers and therefore gained very little from one more. That is where the trade stopped paying for itself and nobody stopped to redo the arithmetic.\n\nEric Schrock, then at Sun, did the arithmetic. In November 2004 he objected, and his reasoning has held up better than the patch it was aimed at. On amd64, a 17th general-purpose register opens up no new class of compiler optimization - there is no transformation the compiler can suddenly perform that it could not perform with sixteen. What you avoid is a pushl/movl sequence the hardware has long since optimized into near-nothing. Leaf routines, which are where the hot code usually is, never establish a frame at all, so they were never paying the cost. Set against the debuggability you lose, Schrock argued, the trade hardly seemed worth making.\n\nHis closing line was a prediction: the practice goes off the rails once people begin compiling /usr/bin without frame pointers. Linux then did exactly that. Not only /usr/bin - /usr/lib and application code went the same way. The failure mode he described as a hypothetical became the default state of the platform.\n\nWhat it actually costs\n\nThe damage is not evenly distributed, and it is not subtle once you know to look for it. A stack walk proceeds normally until it reaches libc, and there it stops. The trace comes back without its application frames - you learn that time was spent in a read, and nothing at all about which part of your program asked for it. Those truncated stacks are not discarded; they pile up together on the left edge of a flame graph, since they all share the same short prefix. In one example that pile was 15% of the samples: a solid block of column that answers no question you would ever ask.\n\nOff-CPU flame graphs come off worse. Their whole content is blocking calls - libc read and write, mutex operations - which is precisely the set of frames past which the walk cannot proceed. The profile you most want when a service is slow and idle is the one the missing frame pointer damages most thoroughly.\n\n2014: paying it back, one runtime at a time\n\nI ran into this at Netflix in 2014. Java had no frame pointer support at all, which meant every application stack was broken, not just the ones that passed through libc. I wrote a fix in the c2 compiler; Oracle reworked it and shipped it as -XX:+PreserveFramePointer in JDK8u60. That restored Java stacks, and immediately exposed the next layer: libc was still compiled without frame pointers, so stacks that left the JVM still died at the boundary. I built a libc with frame pointers for our production systems, then worked with Canonical on a prebuilt libc6-prof so that the rest of the world did not have to.\n\nThat is the shape of the whole twenty years. A defensible decision for a register-starved 32-bit target got copied to a target where its justification did not apply, nobody re-examined it, and the cost landed on everyone who would later need to see where their software spends its time - paid back piecemeal, one runtime and one library at a time, by people who had to rebuild their toolchain to get a profile that was never supposed to be hard.\n", "B": "In 2004 a compiler developer, Roger Sayle, changed gcc to stop generating frame pointers, writing : \"The simple patch below tweaks the i386 backend, such that we now default to the equivalent of \"-fomit-frame-pointer -ffixed-ebp\" on 32-bit targets\" i386 (32-bit microprocessors) only have four general purpose registers, so freeing up %ebp takes you from four to five (or if you include %si and %di, from six to seven). I'm sure this delivered large performance improvements and I wouldn't try arguing against it. Roger cited two other reasons for this change: The desire to outperform Intel's icc compiler, and the belief that it didn't break debuggers (of the time) since they supported other stack walking techniques. 2005-2023: The winter of broken profilers However, the change was then applied to x86-64 (64-bit) as well, which had over a dozen registers and didn't benefit so much from freeing up one more. And there are debuggers/profilers that this change did break (typically system profilers, not language specific ones), more so today with eBPF, which didn't exist back then. As my former Sun Microsystems colleague Eric Schrock (nickname Schrock) wrote in November 2004 : \"On i386, you at least had the advantage of increasing the number of usable registers by 20%. On amd64, adding a 17th general purpose register isn't going to open up a whole new world of compiler optimizations. You're just saving a pushl, movl, an series of operations that (for obvious reasons) is highly optimized on x86. And for leaf routines (which never establish a frame), this is a non-issue. Only in extreme circumstances does the cost (in processor time and I-cache footprint) translate to a tangible benefit - circumstances which usually resort to hand-coded assembly anyway. Given the benefit and the relative cost of losing debuggability, this hardly seems worth it.\" In Schrock's conclusion: \"it's when people start compiling /usr/bin/ without frame pointers that it gets out of control.\" This is exactly what happened on Linux, not just /usr/bin but also /usr/lib and application code! I'm sure there are people who are too new to the industry to remember the pre-2004 days when profilers would \"just work\" without OS and runtime changes. 2014: Java in Flames When I joined Netflix in 2014, I found Java's lack of frame pointer support broke all application stacks (pictured in my 2014 Surge talk on the right). I ended up developing a fix for the JVM c2 compiler which Oracle reworked and added as the -XX:+PreserveFramePointer option in JDK8u60 (see my Java in Flames post for details [ PDF ]). While that Java change led to discovering countless performance wins in application code, libc was still breaking some portion of the samples (as pictured in the example at the top of this post) and was breaking most stacks in off-CPU flame graphs. I started by compiling my own libc for production use with frame pointers, and then worked with Canonical to have one prebuilt for Ubuntu. For a while I was promoting the use of Canonical's libc6-prof, which was libc6 with frame pointers."}, {"pair_id": "p026", "brief": "A 20-year history piece on frame pointers, written March 2024. Background the reader needs: %rbp is the x86-64 ABI's frame pointer, the register holding the base of the current stack frame, and external profilers and debuggers - Linux perf, eBPF - walk stacks by following it, which is what makes flame graphs possible. The ABI marks that use as optional: code can index into the frame off %rsp instead, which drops two instructions from each function's prologue and epilogue and hands back one general-purpose register.\n\n2004: gcc developer Roger Sayle patched the i386 backend so that 32-bit targets compiled as though -fomit-frame-pointer -ffixed-ebp had been passed. On i386 that mattered: four general-purpose registers became five, or six to seven if you count %si and %di. Sayle gave two further reasons - he wanted to beat Intel's icc on benchmarks, and he took the view that debuggers of the day would be unharmed, since they supported other ways of walking a stack.\n\nThe extension: the same default was carried across to x86-64, a target that already had more than a dozen registers and so gained very little from one more. Eric Schrock, then at Sun, objected in November 2004. On amd64, he wrote, a 17th general-purpose register opens up no new class of compiler optimization; all you avoid is a pushl/movl sequence that the hardware has long since optimized; leaf routines never establish a frame at all; and set against the cost in lost debuggability the trade hardly seemed worth making. His closing line: the practice goes off the rails once people begin compiling /usr/bin without frame pointers. Linux then did exactly that, and not only /usr/bin - /usr/lib and application code too.\n\nWhat it costs in practice: a stack walk terminates when it reaches libc, so the trace comes back without its application frames, and those truncated stacks pile up together on the left edge of a flame graph - 15% of the samples in one example. Off-CPU flame graphs come off worse still, since libc read/write and mutex calls are most of what they contain.\n\n2014, joining Netflix: Java had no frame pointer support, which broke every application stack. The author wrote a c2 compiler fix for the JVM; Oracle reworked it and shipped it as -XX:+PreserveFramePointer in JDK8u60. libc came next - he built his own with frame pointers for production, then worked with Canonical on a prebuilt libc6-prof.\n\nWrite the historical narrative section of a technical blog post for systems and performance engineers.", "A": "How the frame pointer went missing\n\nThe x86-64 ABI makes the frame pointer optional, and that one word of permission is where this story starts. %rbp holds the base of the current stack frame, and a profiler that wants a stack -- Linux perf, eBPF -- reads %rbp, follows the saved value to the caller's frame, and repeats until it runs out of frames. That walk is what a flame graph is drawn from. Compilers are free to skip it: index into the frame off %rsp instead, drop two instructions from every prologue and epilogue, and hand the allocator back a register.\n\nThe default that broke stack walking was set in 2004, on a machine where the register mattered. Roger Sayle patched gcc's i386 backend so that 32-bit targets compiled as though -fomit-frame-pointer -ffixed-ebp had been passed. On i386 the arithmetic was real: four allocatable general-purpose registers became five, or six to seven counting %si and %di, which is a 25% increase in what the allocator could actually spend. Sayle gave two further reasons. He wanted to beat Intel's icc on benchmarks, and he judged that the debuggers of the day would be unharmed, since they already walked stacks by other means.\n\nThe damage came from carrying that default across to x86-64. That target had more than a dozen general-purpose registers before %rbp was freed, and freeing it moves the allocatable set from 15 to 16 -- a gain of 6.7%, against 25% on i386, for the same two instructions. The prologue being saved is push %rbp followed by mov %rsp, %rbp, with the matching teardown on exit, and hardware has been optimizing that exact pair for years. Leaf routines never establish a frame at all, so they collect no saving whatsoever.\n\nEric Schrock, then at Sun, made the argument in November 2004 and was ignored. On amd64, he wrote, a seventeenth general-purpose register opens up no new class of compiler optimization; what you avoid is a pushl/movl sequence the hardware has long since absorbed; leaf routines were never paying the cost; and set against what you lose in debuggability, the trade hardly seemed worth making. His closing line named the failure mode before it happened: the practice goes off the rails once people begin compiling /usr/bin without frame pointers. Linux compiled /usr/bin exactly that way, and then /usr/lib, and then application code on top of both.\n\nCount what that costs on a profile you would actually collect. The walk descends through your application's frames, reaches a libc built without %rbp, and terminates there, because the register it was following now holds something else. What comes back is a stack missing its application frames. Every such sample is truncated at roughly the same depth and carries roughly the same frames, so they sort together and stack into one tall block on the left edge of the flame graph. In one example that block is 15% of all samples -- 15% of the profile telling you nothing about your own code.\n\nOff-CPU profiling comes off worse. An off-CPU flame graph is built from the moments a thread blocks, and the blocking calls are read, write, and mutex operations in libc -- which is to say the fraction of the profile that terminates early is not a corner of it but most of it. The tool inverts: the workload you most need the stack for is the workload least able to give you one.\n\nJava arrived in 2014 with nothing to walk at all. When I joined Netflix that year, the JVM had no frame pointer support, and every application stack broke at the first compiled Java frame; a mixed-mode flame graph of a JVM under load was a wall of kernel and libc with the interesting half absent. I wrote a fix for the c2 compiler. Oracle reworked it and shipped it as -XX:+PreserveFramePointer in JDK8u60, which is the flag that made Java flame graphs work.\n\nlibc was the next piece, and it had to be fixed by rebuilding it. I compiled my own libc with frame pointers and ran it in production, which recovers your own stacks and nobody else's. Then I worked with Canonical on a prebuilt libc6-prof, so that getting a complete stack stopped requiring a private toolchain and became a package install. Twenty years after a patch aimed at a four-register machine, distributions are still restoring the register on the machines that never needed to give it up.\n", "B": "Twenty years of missing stacks\n\nThe default that costs us application frames on every profile today was set in 2004, on a machine that no longer exists, for reasons that were defensible on that machine and were never re-examined when the machine changed. %rbp is the x86-64 ABI's frame pointer, the register that holds the base of the current stack frame, and external profilers and debuggers -- Linux perf, eBPF -- walk a stack by following the chain of saved %rbp values from frame to frame, which is the mechanism that makes flame graphs possible at all. The ABI marks that use as optional. Compiled code is free to index into its frame off %rsp instead, which drops two instructions from each function's prologue and epilogue and hands one general-purpose register back to the allocator, and for two decades the compilers have taken that trade by default.\n\n2004: a defensible change on i386\n\nRoger Sayle, a gcc developer, patched the i386 backend so that 32-bit targets compiled as though -fomit-frame-pointer -ffixed-ebp had been passed on the command line. On i386 the register argument was not a rounding error: the allocator went from four general-purpose registers to five, or from six to seven if you count %si and %di, which is a 25% increase in the thing that i386 code was most starved of. Sayle gave two further reasons. He wanted to beat Intel's icc on benchmarks, which was a live competitive concern at the time, and he took the view that the debuggers of the day would be unharmed, since they supported other ways of walking a stack.\n\nThe extension is where the reasoning stopped applying and nobody noticed. The same default was carried across to x86-64, a target that already had more than a dozen general-purpose registers and therefore gained close to nothing from one more, and the benchmark argument that justified the change on a four-register machine was never re-run against the sixteen-register one.\n\nEric Schrock, then at Sun, objected in November 2004, and his objection reads today like a list of the things that were about to go wrong. On amd64, he wrote, a 17th general-purpose register opens up no new class of compiler optimization; all you avoid is a pushl/movl sequence that the hardware has long since learned to optimize; leaf routines never establish a frame at all, so a large fraction of the functions you would be saving instructions in were already paying nothing. Set against the cost in lost debuggability, he did not think the trade was worth making. His closing line named the failure mode precisely: the practice goes off the rails once people begin compiling /usr/bin without frame pointers. Linux then did exactly that, and not only /usr/bin -- /usr/lib and application code too.\n\nWhat a broken chain actually costs\n\nA stack walk that reaches a frame-pointer-less libc terminates there, and the trace comes back without the application frames above it, which is the part a profile is usually being taken to find. The effect on a flame graph is not subtle noise. Truncated stacks share no common prefix with the real ones, so they pile up together on the left edge of the graph as a single undifferentiated block: 15% of the samples in one example, 15% of your CPU time attributed to nothing. Off-CPU flame graphs come off worse still, because libc read and write and mutex calls are most of what an off-CPU profile contains by construction, which means the broken frames are concentrated in exactly the paths you are profiling for.\n\n2014: putting the frames back, one runtime at a time\n\nJoining Netflix in 2014 turned this from a known annoyance into a blocker, because Java had no frame pointer support at all and every application stack was broken, not 15% of them. The fix was a change to the JVM's c2 compiler to preserve the frame pointer; Oracle reworked that patch and shipped it as -XX:+PreserveFramePointer in JDK8u60, which is the flag people still set today, usually without knowing why it needs to exist.\n\nlibc came next, and it was the harder half, because a runtime flag can be flipped per-process while a system library has to be rebuilt and then shipped by somebody. The first version was a private libc built with frame pointers and run in production; the durable version came out of work with Canonical on a prebuilt libc6-prof. The sequencing is the point. Each of these is a separate negotiation with a separate owner, twenty and then ten years downstream of a patch whose stated justification -- four registers becoming five, and debuggers that could cope -- had already stopped being true of the target before the change reached it.\n"}, {"pair_id": "p027", "brief": "graph-store capacity forecast prepared for the September 2026 capacity review. Owner Mei-Lin Chao. The fleet is 2,100 hosts across three regions serving a peak of 1.8M QPS, which is 857 QPS per host. The redline established by load testing is 1,050 QPS per host, so the fleet ceiling is 2.2M QPS. Trailing nine-month growth is 4.2% per month compounded and has stayed within 0.4 points of that every month since January. At that rate peak crosses the 2.2M ceiling in late February 2027 and reaches 2.6M QPS by June 2027. Serving 2.6M QPS at redline needs 2,476 hosts, so the request is 400 additional hosts for a fleet of 2,500, at $7,250 per host per year, $2.9M annualised. Hardware lead time is 14 weeks, so the purchase order must be signed by Nov 3 2026 for hosts to be racked before the February crossing. One alternative exists: moving the read path to the new columnar serialization is estimated to cut CPU per query by 18%, which would push the crossing to August 2027, but that work has no engineer assigned and has been unstaffed for two quarters. Write the capacity status and hardware request for the capacity review board.", "A": "graph-store capacity status and hardware request\nSeptember 2026 capacity review. Owner: Mei-Lin Chao.\n\nWe are asking the board to approve 400 additional graph-store hosts, $2.9M annualised, with the purchase order signed by Nov 3 2026.\n\nThe fleet today is 2,100 hosts across three regions carrying a peak of 1.8M QPS, or 857 QPS per host. Load testing puts the redline at 1,050 QPS per host, which sets the fleet ceiling at 2.2M QPS. We are running at 82% of that ceiling.\n\nTraffic has grown 4.2% per month compounded over the trailing nine months, and every month since January has landed within 0.4 points of that rate. Nine consecutive months inside a 0.8-point band is the reason we are treating 4.2% as a planning input instead of a trend line. Held at 4.2%, peak reaches the 2.2M ceiling 4.9 months from now, in late February 2027, and 2.6M QPS by June 2027.\n\nServing 2.6M QPS at redline takes 2,476 hosts. Rounding to 2,500 gives the 400-host request at $7,250 per host per year. Hardware lead time is 14 weeks, so a PO signed Nov 3 2026 puts hosts in racks around Feb 9 2027, roughly two weeks before the crossing. Every week of slip past Nov 3 is a week the fleet spends above redline in February, and we have no measurement of what graph-store does above 1,050 QPS per host beyond the load test that established the number.\n\nThis request buys about nine months, not two years. A 2,500-host fleet at redline ceilings at 2.625M QPS, which the 4.2% curve reaches in early July 2027. The board should read this as the first of two orders under current growth, and we will bring the second forecast to the March 2027 review with three more months of rate data behind it.\n\nOne alternative exists and it is unstaffed. Moving the read path to the new columnar serialization is estimated to cut CPU per query by 18%, which raises the effective per-host redline to about 1,280 QPS and the fleet ceiling to 2.69M QPS. Recompute the crossing at the same 4.2%: the curve reaches 2.69M in early July 2027, not the August 2027 figure carried in the forecast. Either way the deferral is roughly four to five months, worth about 400 hosts of spend. The work has had no engineer assigned for two quarters.\n\nThat gap is the decision in front of the board. Staffing the columnar read path now does not remove the need for hardware, because the 18% is an estimate against a production workload nobody has measured, and the engineering would have to land, bake and be validated before Nov 3 for us to cancel the order on its strength. Ten weeks is not enough runway for a serialization change on the read path. Our recommendation is to approve the 400 hosts and staff the columnar work in parallel, and if the 18% holds in production we defer the next order rather than this one.\n\nThree things could move these numbers. Growth departing the 4.2% band in either direction changes the crossing date by weeks per point. A redline revision from new load testing moves the ceiling directly, and we have not re-run that test since the current serialization shipped. Regional imbalance is not modelled here at all: the 857 QPS per host figure is a fleet average across three regions, and a region running hot crosses before the fleet does.\n", "B": "graph-store capacity status and hardware request\nFor the September 2026 capacity review board\nOwner: Mei-Lin Chao\n\nWhere the fleet stands\n\ngraph-store runs on 2,100 hosts across three regions and serves a peak of 1.8M QPS, or 857 QPS per host. Load testing puts the redline at 1,050 QPS per host, which gives the current fleet a ceiling of 2.2M QPS. We are at 82% of that ceiling today.\n\nGrowth has been steady enough to plan against. Trailing nine-month peak growth is 4.2% per month compounded, and no single month since January has come in more than 0.4 points off that rate. This is not a forecast built on one quarter of noise; it is nine consecutive months of the same slope.\n\nWhen we run out\n\nHold 4.2% and peak crosses the 2.2M ceiling in late February 2027, roughly five months from now. By June 2027 peak reaches 2.6M QPS. Serving 2.6M at redline takes 2,476 hosts.\n\nThe crossing date is the part worth sitting with. Late February is not when the fleet degrades gracefully; it is when peak traffic meets the number that load testing says the hosts cannot exceed. Every month past that point we are either shedding load at peak or running above redline and hoping the tail behaves.\n\nThe request\n\n400 additional hosts, bringing the fleet to 2,500. At $7,250 per host per year that is $2.9M annualised.\n\n2,500 hosts covers the June 2027 requirement of 2,476 with 24 hosts of margin \u2014 about one week of growth at the current rate. That is deliberately thin. It buys headroom through the first half of 2027 and no further, which means this request does not silently pre-buy capacity for 2028.\n\nThe date
