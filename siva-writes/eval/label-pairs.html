 that actually matters\n\nHardware lead time is 14 weeks. Working backward from the late-February crossing, the purchase order has to be signed by November 3, 2026 for hosts to be racked before we hit the ceiling. That is the decision this board is being asked to make, and it is six weeks out.\n\nIf the PO slips past November 3, the hosts do not arrive late by the length of the slip \u2014 they arrive after the crossing, and we spend the gap serving peak traffic above a redline we established for a reason.\n\nThe alternative, and why it is not one yet\n\nMoving the read path to the new columnar serialization is estimated to cut CPU per query by 18%. That would push the crossing from late February to August 2027 and would make this purchase unnecessary this cycle.\n\nIt has no engineer assigned. It has had no engineer assigned for two quarters.\n\nI am not arguing the work is wrong \u2014 an 18% CPU reduction is better value than $2.9M of hardware, and if it were staffed today it would be the right call. But an unstaffed project is not a capacity plan. Two quarters of no assignment is the relevant evidence about how likely it is to land in the next five months, and it would need to land, ship, and be validated in production well before February to change the hardware decision.\n\nIf the board wants to staff it instead of buying, that is a legitimate choice, but it needs an owner and a date at this meeting, not after it. Absent that, the 400 hosts are the plan.\n\nAsk of the board: approve 400 hosts ($2.9M annualised) with the PO signed by November 3, 2026 \u2014 or name an owner for the columnar read path today and I will bring back a revised forecast.\n"}, {"pair_id": "p028", "brief": "Raw material, Cloudflare, 20 February 2026, all times UTC. Outage began 17:48 and the last prefixes were restored at 23:03, 5 hours 15 minutes later. Customers using Bring Your Own IP saw their prefixes withdrawn via BGP. Of 6,500 prefixes advertised to a given peer, 4,306 are BYOIP; about 1,100 were withdrawn between 17:56 and 18:46, roughly 25% of all BYOIP prefixes. Affected customers hit BGP path hunting: connections keep searching for a route and hang until timeout. Visitors to the one.one.one.one website got HTTP 403 with an Edge IP Restricted message; DNS resolution over 1.1.1.1, including DNS over HTTPS, kept working. Root cause: a new cleanup sub-task meant to automate removal of BYOIP prefixes issued GET /v1/prefixes?pending_delete with no value. Query().Get(\"pending_delete\") returned an empty string, so the API served every BYOIP prefix, and the sub-task treated all of them as queued for deletion, removing prefixes and their dependent service bindings until an engineer killed it. The Addressing API is the authoritative source for customer IP addresses and pushes changes to the edge immediately. Timeline: code merged 2026-02-05 21:53, deployed 17:46, impact 17:56, Cloudflare engaged on one.one.one.one failures 18:13, internal incident 18:18, Addressing API team paged 18:21, sub-process terminated 18:46, mitigation 19:11, self-remediation guidance 19:19, about 800 prefixes restored around 20:20, remaining ~300 manually restored 23:03. Staging data and mocks were insufficient; tests covered the customer self-service journey but not a task runner mutating user data with no explicit input. Write the public postmortem for BYOIP customers and network operators.", "A": "The Addressing API is an authoritative dataset of the addresses present on the Cloudflare network. Any change to that dataset is immediately reflected in Cloudflare's global network. While we are in the process of improving how these systems roll out changes as a part of Code Orange: Fail Small , today customers can configure their IP addresses by interacting with public-facing APIs which configure a set of databases that trigger operational workflows propagating the changes to Cloudflare\u2019s edge. This means that changes to the Addressing API are immediately propagated to the Cloudflare edge. Advertising and configuring IP addresses on Cloudflare involves several steps: Customers signal to Cloudflare about advertisement/withdrawal of IP addresses via the Addressing API or BGP Control The Addressing API instructs the machines to change the prefix advertisements BGP will be updated on the routers once enough machines have received the notification to update the prefix Finally, customers can configure Cloudflare products to use BYOIP addresses via service bindings which will assign products to these ranges The Addressing API allows us to automate most of the processes surrounding how we advertise or withdraw addresses, but some processes still require manual actions. These manual processes are risky because of their close proximity to Production. As a part of Code Orange: Fail Small , one of the goals of remediation was to remove manual actions taken in the Addressing API and replace them with safe workflows. How did the incident occur? The specific piece of configuration that broke was a modification attempting to automate the customer action of removing prefixes from Cloudflare\u2019s BYOIP service, a regular customer request that is done manually today. Removing this manual process was part of our Code Orange: Fail Small work to push all changes toward safe, automated, health-mediated deployment. Since the list of related objects of BYOIP prefixes can be large, this was implemented as part of a regularly running sub-task that checks for BYOIP prefixes that should be removed, and then removes them. Unfortunately, this regular cleanup sub-task queried the API with a bug. Here is the API query from the cleanup sub-task: resp, err : = d. doRequest (ctx, http.MethodGet, `/v1/prefixes?pending_delete` , nil) And here is the relevant part of the API implementation: if v : = req. URL . Query (). Get ( \"pending_delete\" ); v != \"\" { // ignore other behavior and fetch pending objects from the ip_prefixes_deleted table prefixes, err : = c. RO (). IPPrefixes (). FetchPrefixesPendingDeletion (ctx) if err != nil { api. RenderError (ctx, w, ErrInternalError) return } api. Render (ctx, w, http.StatusOK, renderIPPrefixAPIResponse (prefixes, nil)) return } Because the client is passing pending_delete with no value, the result of Query().Get(\u201cpending_delete\u201d) here will be an empty string (\u201c\u201d), so the API server interprets this as a request for all BYOIP prefixes instead of just those prefixes that were supposed to be removed. The system interpreted this as all returned prefixes being queued for deletion. The new sub-task then began systematically deleting all BYOIP prefixes and all of their related dependent objects including service bindings , until the impact was noticed, and an engineer identified the sub-task and shut it down. Why did Cloudflare not catch the bug in our staging environment or testing? Our staging environment contains data that matches Production as closely as possible, but was not sufficient in this case and the mock data we relied on to simulate what would occur was insufficient. In addition, while we have tests for this functionality, coverage for this scenario in our testing process and environment was incomplete. Initial testing and code review focused on the BYOIP self-service API journey and were completed successfully. While our engineers successfully tested the exact process a customer would have followed, testing did not cover a scenario where the task-runner service would independently execute changes to user data without explicit input.", "B": "BYOIP prefix withdrawal on 20 February 2026\n\nOn 20 February 2026, Cloudflare withdrew roughly 1,100 customer-owned IP prefixes from the internet. The withdrawals began at 17:56 UTC and the last affected prefix was restored at 23:03, 5 hours and 15 minutes after the incident started at 17:48. Customers using Bring Your Own IP (BYOIP) were the ones hurt: their address space stopped being advertised, and traffic destined for it had nowhere to go.\n\nThis was our fault, it was entirely avoidable, and we are sorry. What follows is what happened and what we are changing.\n\nWhat customers saw\n\nIf you bring your own IP space to Cloudflare, your prefixes may have been withdrawn via BGP between 17:56 and 18:46. Of the 4,306 BYOIP prefixes in the 6,500 we advertise to a given peer, about 1,100 were pulled \u2014 roughly a quarter of all BYOIP prefixes.\n\nA BGP withdrawal is not a clean failure. Once the best path disappears, routers across the internet try successively worse alternatives before giving up, a behaviour known as path hunting. From the client side this does not look like a refused connection; it looks like a connection that hangs until it times out. Operators monitoring affected prefixes would have seen churn in the global table followed by unreachability, not an immediate NXDOMAIN or reset.\n\nCloudflare's own one.one.one.one website was among the properties affected, returning HTTP 403 with an \"Edge IP Restricted\" message. DNS resolution over 1.1.1.1 was not affected, including DNS over HTTPS. If you use 1.1.1.1 as a resolver, it kept answering throughout.\n\nRoot cause\n\nCloudflare's Addressing API is the authoritative record of which customer IP addresses we advertise, and changes made through it propagate to our edge immediately. We recently added a sub-task to automate a manual chore: cleaning up BYOIP prefixes that customers had already queued for deletion.\n\nThe sub-task asked the API for that queue by calling GET /v1/prefixes?pending_delete \u2014 with no value after the equals sign. On the server side, Query().Get(\"pending_delete\") returns an empty string for a valueless parameter, which the handler did not treat as a filter at all. The API returned every BYOIP prefix it knew about.\n\nThe sub-task took that list at face value. Every prefix in the response was, by its reasoning, queued for deletion, so it began deleting prefixes and their dependent service bindings, one after another, until an engineer killed the process. The code had been merged on 5 February at 21:53 and sat unreleased until it was deployed at 17:46 on 20 February.\n\nTwo things about this are worth saying plainly. First, an empty parameter should never have widened a query from a subset to everything; failing open on a filter that governs deletions is a design error, not a typo. Second, nothing downstream questioned the size of the work it was handed. A task that expects to remove a handful of prefixes and is handed 4,306 should stop and ask.\n\nTimeline (UTC)\n\n- 2026-02-05 21:53 \u2014 Code merged.\n- 17:46 \u2014 Deployed.\n- 17:48 \u2014 Incident begins.\n- 17:56 \u2014 First prefix withdrawals; customer impact starts.\n- 18:13 \u2014 Cloudflare engages on failures observed against one.one.one.one.\n- 18:18 \u2014 Internal incident declared.\n- 18:21 \u2014 Addressing API team paged.\n- 18:46 \u2014 Runaway sub-process terminated. No further withdrawals after this point.\n- 19:11 \u2014 Mitigation in place.\n- 19:19 \u2014 Self-remediation guidance published for affected customers.\n- ~20:20 \u2014 About 800 prefixes restored.\n- 23:03 \u2014 Remaining ~300 prefixes restored manually. Incident ends.\n\nWhy our testing did not catch this\n\nOur test coverage for the Addressing API is built around the customer self-service journey: a person clicks through the dashboard, and we assert the resulting state. This change was not that. It was a task runner mutating customer data with no explicit input from anyone, and we had no test shaped like it. The staging data and mocks compounded the gap \u2014 the fixtures were small and uniform enough that \"all prefixes\" and \"the prefixes pending deletion\" looked much the same, so the bug produced a plausible-looking result in staging.\n\nWhat we are changing\n\nWe are making valueless and unrecognised filter parameters a hard error on the Addressing API rather than a no-op, so a query that fails to narrow returns nothing instead of everything. We are adding blast-radius limits to automated tasks that mutate advertised address space: a ceiling on prefixes touched per run, and a halt-and-page when a work list is larger than expected. We are extending staging fixtures so that filtered and unfiltered results are distinguishable, and adding test coverage for machine-initiated mutations of customer data, not only human-initiated ones. Finally, we are reviewing the immediate-propagation path between the Addressing API and the edge to introduce a delay window during which a bulk withdrawal can be caught and reversed before it reaches BGP.\n\nWe understand what it costs you when your own address space goes dark, and we are treating this as a failure of the controls we owe you, not as a one-off bug.\n"}, {"pair_id": "p029", "brief": "Raw material for the version-skew section of the in-place pod resize KEP. Timeline: the CRI changes merged in v1.25 so runtimes could implement support; containerd added support in 1.6.9. Older clients that do not know the ResizePolicy fields send them as nil, and the API server copies the non-nil values from the old pod forward. The skew problem: before v1.31, with InPlacePodVerticalScaling off, the kubelet read a resource mutation as a change to the container definition and restarted the container with the new values, which can over-subscribe the node. From v1.31 the kubelet no longer treats a resource change as a definition change and does not restart; the new value then takes effect only if the container restarts for some unrelated reason, so the change is nondeterministic and never reflected in the API. Both outcomes are bad, so the API server must reject a resize when the kubelet handling that pod lacks the feature. There is no direct signal, so the proxy is .status.containerStatuses[*].resources, which the kubelet sets on running containers if and only if the feature is enabled; note it is set to an empty {} even when the container declares no requests. Decision logic: feature gate off means reject; otherwise look at the first running container and allow only if its status resources are non-nil; with no running containers, allow. An unscheduled pod may be resized, with the new values used at scheduling and start. A scheduled pod with no running containers gives no signal, so resize is allowed and the node may end up over-provisioned. A race exists where a resize on a non-running container is admitted while the kubelet starts it: before v1.31 the container restarts with the new values, after v1.31 it keeps the old ones. Write the version-skew section for KEP reviewers.", "A": "## Version skew\n\nA kubelet that does not implement in-place resize mishandles a resize in both of the two ways it can\nfail, so the API server must reject a resize whenever it can determine that the pod is held by such a\nkubelet. The determination has no direct signal and rests on a proxy field, which leaves two cases\nadmitted that should not be.\n\nThe skew window is wide because the pieces landed at different times. The CRI changes merged in v1.25\nso that runtimes could implement support; containerd added it in 1.6.9. A client older than the\nfeature does not know the `ResizePolicy` fields and sends them as nil, and the API server copies the\nnon-nil values from the old pod forward, so an old client does not clear a policy a new one set.\n\nBefore v1.31, a kubelet with `InPlacePodVerticalScaling` disabled read a resource mutation as a change\nto the container definition and restarted the container with the new values. Nothing consulted the\nnode's remaining allocatable before that restart, so a resize upward can over-subscribe the node.\n\nFrom v1.31 the kubelet no longer treats a resource change as a definition change and does not restart\nthe container. The new value then takes effect only if the container restarts for some unrelated\nreason -- an OOM kill, a liveness probe failure, a node reboot -- and never appears in the API. The\nresize is neither applied nor reported, and a later reader cannot tell which values the container is\nactually running under.\n\nThe kubelet exposes no version or feature field the API server can read, so admission uses\n`.status.containerStatuses[*].resources` as the proxy. The kubelet sets this field on running\ncontainers if and only if the feature is enabled. Note that it sets it to an empty `{}` when the\ncontainer declares no requests or limits, so the test is non-nil, not non-empty; reading it as\nnon-empty rejects every resize on a container with no declared resources.\n\nAdmission therefore runs three checks in order. If the `InPlacePodVerticalScaling` feature gate is off\non the API server, reject the resize. Otherwise find the first running container and allow the resize\nonly if its status resources are non-nil. If the pod has no running containers, allow the resize.\n\nAllowing a pod with no running containers is a deliberate hole, and it covers one good case and one\nbad one. An unscheduled pod has no running containers and should be resizable: the new values are the\nones the scheduler sees and the ones the container starts with, and no node has committed anything\nyet. A pod already scheduled to a node but with no container running yet gives the same empty status\nand the same allow, and here the node may end up over-provisioned, because the kubelet that starts the\ncontainer may be one that never reports back.\n\nThe same hole admits a race between admission and container start. A resize is admitted against a pod\nwhose containers are not running while the kubelet is starting one of them. On a kubelet older than\nv1.31 the container restarts and comes up with the new values; on v1.31 or later it keeps the old\nones. Which of the two happens depends on the interleaving, and neither outcome is reflected in the\nAPI at the time the resize is accepted.\n\nReviewers should read the three checks as the contract and the two holes as known, bounded gaps: both\nrequire a pod with zero running containers, and both resolve once any container reaches running and\nreports its resources.\n", "B": "Version Skew Strategy\n\nThree components have to agree before a resize is safe: the API server, the kubelet on the node running the pod, and the container runtime. They upgrade independently, so all three combinations of old and new are reachable in a live cluster.\n\nThe runtime side is the settled part. The CRI changes merged in v1.25 so that runtimes could implement support; containerd shipped it in 1.6.9. A client older than the feature does not know about the ResizePolicy fields and sends them as nil, and the API server copies the non-nil values from the old pod forward, so an old client editing an unrelated field does not silently erase a policy someone else set.\n\nThe hard case is an API server that knows about resize talking to a kubelet that does not. Both possible kubelet behaviors are wrong, in opposite directions.\n\nBefore v1.31, with InPlacePodVerticalScaling disabled, the kubelet read a change to a container's resources as a change to the container definition. It responded the only way it knew how: it killed the container and restarted it with the new values. The resize appears to work. It is also an unannounced restart, and because the scheduler was never consulted the node can end up over-subscribed.\n\nFrom v1.31 the kubelet no longer treats a resource change as a definition change, so it does not restart the container. The new values sit in the spec and do nothing. If the container later restarts for some unrelated reason, they take effect then. Whether the resize happened is therefore a function of unrelated events, and nothing in the API ever reflects which way it went.\n\nNeither outcome is acceptable, so the API server must reject a resize when the kubelet handling that pod lacks the feature.\n\nThere is no direct signal for kubelet capability, so we use a proxy: .status.containerStatuses[*].resources. A kubelet sets this field on running containers if and only if the feature is enabled. Note that it is set to an empty object even when the container declares no requests, so presence of the field, not its contents, is what carries the signal.\n\nThe admission logic follows from that:\n\n- Feature gate off at the API server: reject.\n- Otherwise, find the first running container. Allow the resize only if its status resources are non-nil.\n- If the pod has no running containers, allow.\n\nThe third branch is where the guarantee weakens, and reviewers should look at it closely.\n\nAn unscheduled pod has no running containers and no assigned node, so there is no kubelet to ask. Allowing the resize is correct here: the new values are what the scheduler sees and what the container starts with.\n\nA scheduled pod with no running containers is the gap. There is no signal, we allow the resize, and if that node's kubelet is old the node may be over-provisioned once the container starts. We accept this rather than reject every resize on a pod that happens to be between restarts.\n\nThe same branch admits a race. A resize is admitted against a non-running container while the kubelet is concurrently starting it. Before v1.31 the container comes up, sees the change, and restarts with the new values. From v1.31 it comes up and keeps the old ones. The window is small and bounded by container startup, but the outcome is not determined by anything the caller can observe.\n\nBoth gaps close as clusters reach a kubelet at or past the feature's enablement, at which point the proxy check is redundant rather than merely best-effort.\n"}, {"pair_id": "p030", "brief": "Raw material for the motivation and goals section of a Kubernetes enhancement proposal on pod scheduling readiness. Today a pod is treated as ready for scheduling the moment it is created, and the scheduler keeps trying to place every pending pod. In practice some pods sit for long stretches missing an essential resource, and the repeated attempts churn the scheduler and the downstream integrators that watch it, such as Cluster Autoscaler. Without a way to flag a pod as paused, those cycles are spent retrying pods already known to be unschedulable, which delays other pods and lowers overall scheduling throughput; it also constrains vendors who want to build features such as hierarchical quota natively. A constraint on any solution: the condition {type:PodScheduled, reason:Unschedulable} is the canonical signal the scheduler publishes so integrators such as Cluster Autoscaler know to add cluster resources, and that contract must not break. What the proposal wants: an API to mark pods scheduling-paused or scheduling-ready; a new Enqueue extension point so queueing behavior can be customized; paused pods must not be marked Unschedulable through the PodScheduled condition; and a default enqueue plugin that honors the new API's semantics. Out of scope: forcing pod conditions to expose more context about paused pods, and focusing on in-house uses of the Enqueue extension point. Noted as future work: permission control on individual scheduling gates, which depends on a fine-grained permissions design. Write the motivation, goals and non-goals section of this KEP for SIG Scheduling reviewers.", "A": "- Title: Pod Scheduling Readiness\n- Section: Motivation, Goals, Non-Goals\n- Audience: SIG Scheduling\n\n## Motivation\n\nA pod should be able to tell the scheduler that it is not ready to be placed, and today it cannot. The kube-apiserver admits a pod and the scheduler treats it as schedulable in the same instant; from then on the pod sits in the scheduling queue and is retried on every backoff cycle until it binds. For a pod that is waiting on something the scheduler does not supply -- a quota grant, a peer pod, a secret, a device plugin that has not registered -- every one of those cycles is known-futile before it runs.\n\nThe cost lands in two places. Each attempt on an unplaceable pod occupies a scheduling cycle that a placeable pod would otherwise get, which lowers throughput for the whole cluster. Each attempt also writes the condition `{type: PodScheduled, reason: Unschedulable}`, and every integrator watching that condition reacts. Cluster Autoscaler reads it as a request for capacity, so a pod blocked on a quota decision can drive a scale-up that no amount of new capacity will satisfy.\n\nWe have no measurement to offer here; the argument is structural. The scheduler cannot distinguish \"no node fits this pod\" from \"nothing outside the scheduler has released this pod yet\", and the two cases want opposite handling.\n\nThe absence also constrains vendors. Hierarchical quota, gang admission, and capacity reservation are all built today by holding pods outside the API and creating them late, because the API offers no supported way to hold a created pod. A first-class pause makes those features implementable against upstream Kubernetes.\n\nOne contract bounds any solution. `{type: PodScheduled, reason: Unschedulable}` is the signal integrators already depend on, and its meaning must not widen. A paused pod is not unschedulable -- no node has been rejected on its behalf -- and marking it so would teach Cluster Autoscaler to add nodes for pods that are not asking for nodes.\n\n## Goals\n\n- Add an API on the pod that marks it either scheduling-paused or scheduling-ready, settable at creation and clearable afterwards by a controller.\n- Add an Enqueue extension point to the scheduler framework so queueing behavior can be customized by out-of-tree plugins.\n- Keep a paused pod out of the `PodScheduled`/`Unschedulable` condition entirely, preserving the existing meaning of that condition for Cluster Autoscaler and other integrators.\n- Ship a default enqueue plugin that implements the semantics of the new API, so the feature works with no plugin authoring.\n\n## Non-Goals\n\n- Extending pod conditions to carry more context about why a pod is paused or who paused it. Read the pause state from the new API.\n- Designing or advocating in-house uses of the Enqueue extension point. This KEP specifies the extension point and the default plugin only.\n\n## Future Work\n\nPer-gate permission control, so that a controller can clear one scheduling gate and not the rest, depends on a fine-grained permissions design that does not exist yet. This KEP leaves gate removal governed by existing pod update permissions.\n", "B": "KEP: Pod Scheduling Readiness\n\nMotivation\n\nThe scheduler treats a pod as ready to place the moment the API server admits it. A pod that is\nwaiting on something outside the scheduler's control -- a quota grant, a secret, a PVC nobody has\ncreated yet -- still enters the active queue, fails a scheduling cycle, and comes back on the\nbackoff schedule. It keeps coming back for as long as it sits pending, which can be minutes or\nhours. The scheduler spends those cycles on pods it has already decided it cannot place, and pods\nit could place wait behind them in the queue. Scheduling throughput drops for every workload in the\ncluster, not only for the blocked ones.\n\nThe churn does not stop at the scheduler. Every failed attempt updates the pod's PodScheduled\ncondition, and the integrators that watch pod conditions do work in response. Cluster Autoscaler\nreads {type: PodScheduled, reason: Unschedulable} as evidence that the cluster is short on capacity\nand evaluates a scale-up. A pod parked on a missing quota grant looks exactly like a pod parked on a\nmissing node, so the autoscaler burns evaluation cycles on pods that no amount of new capacity would\nhelp.\n\nThe absence of a pause signal also constrains what vendors can build on top of the scheduler.\nHierarchical quota, gang admission, and similar policies need a way to hold a pod out of the queue\nuntil an external controller says the pod is admissible. Today an operator implements the hold by\nkeeping the pod out of the API server entirely, which gives up pod identity, status, and the normal\nadmission path.\n\nThat existing condition is a contract, and this proposal does not change it.\n{type: PodScheduled, reason: Unschedulable} remains the signal that a pod needs cluster resources\nit cannot get, and Cluster Autoscaler and every other integrator that keys on it keep working\nunmodified. A pod that is explicitly paused is not unschedulable in that sense, and marking it so\nwould tell integrators to provision capacity for a pod that is not asking for any.\n\nGoals\n\n1. Add an API that marks a pod scheduling-paused or scheduling-ready. A pod created in the paused\n   state is not placed in the active queue until a controller or a user clears the pause.\n\n2. Add an Enqueue extension point so that queueing behavior becomes customizable by a plugin, in the\n   same way filtering and scoring already are.\n\n3. Guarantee that a paused pod is never marked Unschedulable through the PodScheduled condition.\n   The condition continues to mean what integrators already assume it means.\n\n4. Ship a default enqueue plugin that implements the semantics of the new API, so that a cluster\n   gets the behavior without writing a plugin.\n\nNon-Goals\n\n1. Extending pod conditions to carry more context about why a pod is paused. A pod is paused or it\n   is ready; the reason belongs to the controller that set the pause.\n\n2. Designing in-house features on top of the Enqueue extension point. This KEP defines the\n   extension point and one default plugin.\n\nFuture Work\n\nPermission control on individual scheduling gates: which principals may add or remove a specific\ngate. That work depends on a fine-grained permissions design that does not exist yet, and we will\nopen it as a separate KEP once that design lands.\n"}, {"pair_id": "p031", "brief": "Raw material. The feedback loop hypothesis: in the long term, coding agents will find tasks with effective feedback easy and tasks without effective feedback hard, and the availability of accurate feedback sets the limit on their capability. Current evidence. Good error messages keep agents unstuck. Rust steers agents toward correct code by signalling some kinds of incorrectness explicitly and immediately. Agents do well on performance work where good benchmarks exist. Property-based testing is unusually valuable. Agents do poorly on architecture, where feedback is of the know-it-when-I-see-it kind, and on concurrent programs, where feedback arrives as silent data corruption at runtime. Two comparison problems: building a delightful, ergonomic photo-editing website, and building a correct high-performance database storage engine at the scale of RocksDB or InnoDB, not Aurora DSQL or PostgreSQL. For open-loop models the website is easier and gets closer to success in a single shot. The hypothesis inverts this over the long run: the website's loop needs a human, and humans are slow, squishy, inconsistent feedback providers, while the storage engine has a simple specification covering API, safety properties, and liveness properties, so iteration needs no human. Implied tooling: Rust, Hydro, Verus at compile time; TLA+ and P at modelling time; Kiro's spec analyzer; testing tools, simulators, mocks. Write a design doc for engineering leadership on where to invest in agent tooling.", "A": "Where to invest in coding-agent tooling\n\nA coding agent stops when something tells it that it is done, and the quality of that something, not the difficulty of the task, sets the ceiling on what agents can build for us. Our tooling budget should buy checkers.\n\nThe mechanism is the loop. An agent proposes a change and reads a signal: a compiler error, a failing property, a benchmark number, a model checker's counterexample. A good signal names the defect and locates it, so the next proposal is conditioned on something specific instead of on the agent's own belief about its work. Where no such signal exists, the agent cannot tell whether the last edit helped, and the loop degenerates into sampling.\n\nWhat we already observe follows from that. Agents stay unstuck on code with good error messages. Rust steers them toward correct programs because it signals whole classes of incorrectness explicitly and at compile time, before any test runs. Agents do well on performance work wherever a benchmark exists, because the benchmark returns a number after every attempt. Property-based testing is worth more to an agent than to a human author, because the agent can afford to run it on every candidate. Agents do badly on architecture, where the feedback is of the know-it-when-I-see-it kind, and on concurrent code, where a wrong program passes every run on the machine and shows up later as silent data corruption.\n\nTwo problems make the argument concrete. First: build a delightful, ergonomic photo-editing website. Second: build a correct, high-performance storage engine at the scale of RocksDB or InnoDB -- the storage layer itself, not a distributed database like Aurora DSQL or PostgreSQL. Ask which one an agent will finish.\n\nFor a model asked to produce one shot with no loop, the website is easier and lands closer to success. Over the long run that ranking inverts. The website's loop has a human in it: only a person can say whether the crop tool feels right, people answer in hours, and two people, or the same person on two days, score the same mockup differently. The storage engine has a specification with three parts -- the API, the safety properties, and the liveness properties -- and all three are machine-checkable, so the engine's loop runs at machine speed with nobody in it.\n\nThis tells us what to fund. Buy compile-time checking: Rust, Hydro for distributed dataflow, Verus for proofs the compiler enforces. Buy modelling tools that produce counterexample traces, TLA+ and P, and treat a trace as the highest-value feedback we can hand an agent for concurrency. Buy Kiro's spec analyzer and anything else that turns a vague requirement into a checkable one. Buy the unglamorous layer -- deterministic simulators, fault injectors, mocks, and benchmark harnesses -- and staff it, because that layer is where the agent's ceiling actually sits.\n\nIt also tells us what not to buy. Spending on raw agent capability for architecture and UX work will not move those tasks much, because the missing ingredient there is a checker and not a smarter proposer. The cheaper path is to convert a know-it-when-I-see-it judgment into something a program can evaluate, even partially.\n\nThe hypothesis is falsifiable and we should try to falsify it. If agents start closing hard architecture tasks without anyone building new checkers for them, this investment thesis is wrong and we should redirect.\n", "B": "On one hand, we should see this as uncontroversial. Anybody who has built code with agents knows that good error messages help keep agents unstuck. We\u2019re seeing how tools like Rust guide agents towards writing correct code by providing explicit and immediate feedback about incorrectness of some kinds. We\u2019re seeing agents be great at performance work, where good benchmarks exist. We\u2019re seeing tools like property-based testing be uniquely valuable. We\u2019re also seeing that agents aren\u2019t great at architecture (where feedback tends to be of the \u2018I know it when I see it\u2019 kind), or writing concurrent programs (where feedback tends to be of the \u2018it silently corrupted data at runtime\u2019 kind). But let\u2019s look forward a little bit, and compare two problems: Building a delightful ergonomic photo editing website. Building a correct high-performance database storage engine 5 . For open-loop models, the former is easier than the latter. At least in that you\u2019ll get closer to real success with a pure vibe coding workflow, and much closer to success on the former after a single shot. The feedback loop hypothesis, however, makes me think that the latter is actually the easier long-term problem. To understand why, consider their feedback loops. The website\u2019s feedback loop, beyond maybe some automation that tests if the buttons do what they should, requires a human in the loop. It needs to be easy to use for humans, and humans are notoriously slow, squishy, and inconsistent feedback providers. The latter, however, has a rather simple specification, including the API, safety properties, and liveness properties. With the right tools in the feedback loop, iteration towards success requires no humans. What does it mean? I think this is different from the intuition many people have about coding agents. They see websites and UIs as \u2018easy\u2019 (see the SaaSpocalypse), and system software as \u2018hard\u2019. The feedback loop hypothesis says that this is backwards. That, in fact, we\u2019re going to find that SaaS is \u2018hard\u2019 and system software is \u2018easy\u2019. This is going to raise the importance of specification (the writing down of what good looks like to drive the feedback loop), and of tools that apply that specification to code. Compile-time tools like Rust, Hydro , and Verus . Modelling-time tools like TLA+ and P . Specification tools like Kiro\u2019s spec analyzer . Testing tools, simulators, mocks, etc. The future of software development is building these feedback loops. Many hard problems remain."}, {"pair_id": "p032", "brief": "Raw material for a Kubernetes enhancement proposal on in-place pod resource updates. Today Pod.Spec.Containers[i].Resources is immutable, so any change to CPU or memory requests or limits forces the pod to be recreated. Three things drive a change: load rose and the allocation is short; load fell and the allocation sits idle; the values were simply set wrong. Stateless replicas usually survive recreation; low-replica services, stateful workloads and batch jobs pay in availability or cost. Core idea: the spec resources become desired state, and PodStatus is extended to report the resources actually applied. Three CRI gaps also need fixing: UpdateContainerResources takes a Linux-shaped resources parameter that does not fit Windows or future runtimes; there is no CRI call letting kubelet read back the CPU and memory limits a runtime has applied; and the behavior expected of a runtime handling a resource update is not documented. Goals: resize without necessarily restarting the container; let whoever initiated the resize (user, VPA, StatefulSet, JobController) choose what happens when in-place is impossible; let users mark which containers are safe to resize. Non-goals: QoS class change, non-restartable init containers, evicting lower-priority pods to make room, resource types other than CPU and memory, CPU/memory manager policies other than 'None', and resolving scheduler races. Write the motivation and scope section of this KEP for SIG Node reviewers.", "A": "KEP: In-Place Update of Pod Resources\n\nMotivation\n\nPod.Spec.Containers[i].Resources is immutable, so any change to a CPU or memory request or limit forces the pod to be deleted and recreated. The kubelet and the container runtime can already adjust cgroup limits on a running container, and the API blocks the operator from asking for it. Every resize therefore becomes a rescheduling event.\n\nThree situations produce that request. Load rose and the current allocation is short, which shows up as throttling or an OOM kill. Load fell and the allocation sits idle, which the cluster pays for in unusable capacity on the node. The values were set wrong when the workload was first written, and nobody has had a cheap way to correct them since.\n\nThe cost of recreation falls unevenly across workload types. A Deployment with twenty stateless replicas loses one at a time and the service absorbs it. A service running two replicas gives up half its capacity during the roll; a StatefulSet member has to detach and reattach its volume and rejoin its quorum; a batch job that is forty minutes into a sixty-minute run discards that work and starts again. These are the workloads that currently choose between a wrong allocation and a disruption, and they usually keep the wrong allocation.\n\nThis KEP makes the container resources in the pod spec desired state instead of a fixed property of a scheduled pod. PodStatus is extended to report the resources the runtime has actually applied, which lets a client distinguish an accepted resize from a pending or rejected one. A resize that the node cannot satisfy stays visible in that gap between spec and status.\n\nThree CRI gaps block the node-side implementation. UpdateContainerResources takes a Linux-shaped resources parameter that does not describe Windows containers or future runtimes. No CRI call lets the kubelet read back the CPU and memory limits a runtime has applied, so the kubelet cannot populate the new status field from ground truth. The behavior a runtime is expected to implement when it receives a resource update is undocumented, and two conforming runtimes can disagree today.\n\nGoals\n\nResize CPU and memory on a running container without necessarily restarting it.\n\nLet the actor that initiated the resize -- a user, the VPA, a StatefulSet controller, a JobController -- declare what should happen when an in-place update is impossible on the current node.\n\nLet users mark, per container, which containers are safe to resize in place.\n\nExtend the CRI so that a resource update is runtime-neutral, readable back by the kubelet, and specified precisely enough to be conformance-tested.\n\nNon-Goals\n\nChanging a pod's QoS class. A resize that would move a pod between Guaranteed, Burstable and BestEffort is out of scope for this proposal.\n\nResizing init containers that are not restartable.\n\nEvicting or descheduling lower-priority pods to free room for a resize. A resize that does not fit stays unsatisfied.\n\nResource types other than CPU and memory. Extended resources, hugepages and ephemeral storage keep their current immutability.\n\nCPU manager and memory manager policies other than 'None'. Static policy interactions with pinned CPUs need their own design.\n\nResolving scheduler races. The scheduler may make a placement decision against a resource view that a concurrent in-place resize has already invalidated, and this proposal does not close that window.\n", "B": "## Motivation\n\nA container's CPU and memory allocation is decided once, at admission, and cannot be revised.\n`Pod.Spec.Containers[i].Resources` is immutable, so the only way to give a container more memory,\nor take back CPU it never used, is to delete the pod and create a replacement carrying the new\nnumbers.\n\nThree situations produce that need, and they are not rare. Load rises past what was provisioned,\nand the container throttles or is OOM-killed. Load falls, and the difference between what was\nrequested and what is used stays reserved, counted against quota and against the scheduler's view\nof free capacity, for as long as the pod lives. Or the numbers were wrong on the first day and\nnobody has had a safe moment to correct them.\n\nWhat recreation costs depends entirely on the workload. A Deployment with fifty stateless replicas\nabsorbs a rolling replacement without anyone noticing. The workloads that most need a correction\nare usually the ones least able to pay for it: a service running two or three replicas loses a\nmeaningful share of its serving capacity for the duration; a stateful pod pays for lost local\nstate, re-warmed caches and re-elected leaders; a batch job that has been running for six hours\ndiscards those six hours and starts again. In practice this pushes operators toward permanent\noverprovisioning, because the correction is more expensive than the waste.\n\nWe propose that the resources in the pod spec become *desired* state rather than a fixed record of\nwhat was admitted, and that `PodStatus` be extended to report the resources a container has\nactually been given. Kubelet reconciles the two. With that split, a resize is an update to an\nexisting pod rather than a replacement of it, and callers can observe whether the change landed.\n\nThree gaps in the CRI have to be closed for kubelet to do this reliably:\n\n* `UpdateContainerResources` takes a Linux-shaped resources parameter. It does not describe Windows\n  containers, and leaves no room for runtimes that are neither.\n* There is no CRI call by which kubelet can read back the CPU and memory limits a runtime has\n  applied. Kubelet can ask for a change but cannot confirm one.\n* The behavior expected of a runtime that receives a resource update is not written down anywhere,\n  so runtimes are free to differ and callers cannot depend on any of it.\n\n## Goals\n\n* Resize a running container's CPU and memory allocation without necessarily restarting it, and\n  without recreating its pod.\n* Let whoever initiated the resize \u2014 a user, VPA, a StatefulSet controller, a JobController \u2014 decide\n  what should happen when the resize cannot be done in place. The right answer is workload-specific\n  and does not belong in kubelet.\n* Let users declare, per container, which containers are safe to resize, so that a resize request\n  against a pod does not become an unbounded restart of every container in it.\n* Extend the CRI so the resource parameter is not Linux-specific, kubelet can read applied limits\n  back, and runtime behavior on update is specified.\n\n## Non-Goals\n\n* Changing a pod's QoS class. A pod's class is what it was admitted as.\n* Resizing init containers that cannot be restarted.\n* Evicting lower-priority pods to free room for a resize that does not fit.\n* Resource types other than CPU and memory.\n* CPU manager and memory manager policies other than `None`.\n* Resolving races between a resize and a concurrent scheduling decision. Both read the same node\n  capacity; reconciling them is separate work.\n"}, {"pair_id": "p033", "brief": "Raw material for the constraints-and-caveats section of the pod scheduling readiness KEP, about the new .spec.schedulingGates field. State transitions are deliberately restricted. The field can only be initialized when the pod is created, either by the client or by a mutating admission webhook. After creation, gates may be removed in any order, but adding a new gate is not allowed. A scheduled pod must always carry empty scheduling gates, which means a client \u2014 administrator or custom controller \u2014 cannot create a pod that has schedulingGates populated and also specifies spec.nodeName; the API server returns a validation error. Stated as a matrix: for an unscheduled pod with nil nodeName, create with non-nil gates is allowed and update is not, while nil gates allow both; for a scheduled pod with non-nil nodeName, neither create nor update with non-nil gates is allowed, and nil gates allow both. Feature-gating is not uniform across the three parts of the feature: (a) the pod spec field plus feature gate and associated bits, (b) the SchedulingGates scheduler plugin, and (c) the underlying scheduler framework change, the new PreEnqueue extension point. Disabling the feature turns off a and b but leaves c on, so a plugin developer can use c alone to build their own equivalents of a and b. Separately, kubectl gets a new phase literal, SchedulingPaused, in the phase column of kubectl get pod, to show whether a pod is scheduling-paused. Write this notes and constraints section of the KEP for API and scheduler reviewers.", "A": "- **Restricted state transition:** The `schedulingGates` field can be initialized only when a Pod is created (either by the client, or mutated during admission). After creation, each `schedulingGate` can be removed in arbitrary order, but addition of a new scheduling gate is disallowed. To ensure consistency, scheduled Pod must always have empty `schedulingGates`. This means that a client (an administrator or custom controller) cannot create a Pod that has `schedulingGates` populated in any way, if that Pod also specified a `spec.nodeName`. In this case, API Server will return a validation error. | | non-nil schedulingGates\u23f8\ufe0f | nil schedulingGates\u25b6\ufe0f | |----------------------------------------------|-------------------------|-------------------------| | unscheduled Pod<br>(nil <tt>nodeName</tt>) | \u2705 create<br>\u274c update | \u2705 create<br>\u2705 update | | scheduled Pod<br>(non-nil <tt>nodeName</tt>) | \u274c create<br>\u274c update | \u2705 create<br>\u2705 update | - **New field disabled in Alpha but not scheduler extension:** In a high level, this feature contains the following parts: - a. Pod's spec, feature gate, and other misc bits describing the field `schedulingGates` - b. the `SchedulingGates` scheduler plugin - c. the underlying scheduler framework, i.e., the new PreEnqueue extension point If the feature is disabled, part `a` and `b` are disabled, but `c` is enabled anyways. This implies a scheduler plugin developer can leverage part `c` _only_ to craft their own `a'` and `b'` to accomplish their own feature set. - **New phase literal in kubectl:** To provide better UX, we're going to add a new phase literal `SchedulingPaused` to the \"phase\" column of `kubectl get pod`. This new literal indicates whether it's scheduling-paused or not.", "B": "Notes and constraints: `.spec.schedulingGates`\n\nA pod's scheduling gates only shrink, and only from a set fixed at creation: the client or a\nmutating admission webhook writes the gates when it creates the pod, gate owners remove them in\nany order afterwards, and no update may add one.\n\nValidation enforces this over four cells, indexed by whether `.spec.nodeName` is set and whether\nthe incoming object carries non-nil `schedulingGates`. For an unscheduled pod with nil `nodeName`,\ncreate with non-nil gates is allowed and update with non-nil gates is rejected; nil gates allow\nboth verbs. For a scheduled pod with non-nil `nodeName`, both create and update with non-nil gates\nare rejected; nil gates again allow both. One of the four combinations admits a non-empty gate set,\nand it is the create of a pod that has no node. A client -- an administrator or a custom\ncontroller -- that creates a pod carrying both populated `schedulingGates` and `spec.nodeName` gets\na validation error rather than a pod nobody will schedule.\n\nThe ban on gates for a scheduled pod follows from where the gate is read. A gate is a precondition\nthe scheduler checks at PreEnqueue, before the pod enters the active queue; once the pod carries a\n`nodeName` it has already left that queue, and adding a gate would ask the API to un-schedule a\npod that may already be running. No such operation exists. The equivalent invariant, stated as a\nproperty of the stored object: a scheduled pod always carries empty scheduling gates.\n\nCreation-time initialization is what makes the gate set knowable. Every gate that will ever hold\nthe pod is present when the pod first reaches the API server, so a controller that wants to hold a\npod must register its gate in the admission chain the pod passes through exactly once. Removal\ncarries no ordering contract between gate owners; each owner deletes its own string, and whichever\nremoval empties the slice releases the pod to the queue.\n\nThe feature gate does not cover all three parts of this feature. It covers (a) the pod spec field\nwith its validation, defaulting and strategy bits, and (b) the in-tree SchedulingGates scheduler\nplugin. It does not cover (c) the scheduler framework change underneath both, the new PreEnqueue\nextension point. Disabling the feature therefore turns off two of the three parts and leaves\nPreEnqueue live, which is deliberate: a plugin developer can build their own equivalent of (a) and\n(b) on (c) alone, using a CRD and an out-of-tree plugin, with no dependency on the in-tree field\nshipping or staying enabled.\n\n`kubectl get pod` gains one new literal, `SchedulingPaused`, in the PHASE column. It reports that\nthe pod has at least one gate remaining and has not been enqueued. It is a kubectl-side display\nvalue and not a new member of `v1.PodPhase`, so a client reading `.status.phase` over the API sees\n`Pending` for a gated pod and needs no change. Reviewers of the printer code should confirm that\n`SchedulingPaused` is derived from a non-empty `.spec.schedulingGates`, which by the matrix above\ncan only be true while `.spec.nodeName` is empty.\n"}, {"pair_id": "p034", "brief": "A 20-year history piece on frame pointers, written March 2024. Background the reader needs: %rbp is the x86-64 ABI's frame pointer, the register holding the base of the current stack frame, and external profilers and debuggers - Linux perf, eBPF - walk stacks by following it, which is what makes flame graphs possible. The ABI marks that use as optional: code can index into the frame off %rsp instead, which drops two instructions from each function's prologue and epilogue and hands back one general-purpose register.\n\n2004: gcc developer Roger Sayle patched the i386 backend so that 32-bit targets compiled as though -fomit-frame-pointer -ffixed-ebp had been passed. On i386 that mattered: four general-purpose registers became five, or six to seven if you count %si and %di. Sayle gave two further reasons - he wanted to beat Intel's icc on benchmarks, and he took the view that debuggers of the day would be unharmed, since they supported other ways of walking a stack.\n\nThe extension: the same default was carried across to x86-64, a target that already had more than a dozen registers and so gained very little from one more. Eric Schrock, then at Sun, objected in November 2004. On amd64, he wrote, a 17th general-purpose register opens up no new class of compiler optimization; all you avoid is a pushl/movl sequence that the hardware has long since optimized; leaf routines never establish a frame at all; and set against the cost in lost debuggability the trade hardly seemed worth making. His closing line: the practice goes off the rails once people begin compiling /usr/bin without frame pointers. Linux then did exactly that, and not only /usr/bin - /usr/lib and application code too.\n\nWhat it costs in practice: a stack walk terminates when it reaches libc, so the trace comes back without its application frames, and those truncated stacks pile up together on the left edge of a flame graph - 15% of the samples in one example. Off-CPU flame graphs come off worse still, since libc read/write and mutex calls are most of what they contain.\n\n2014, joining Netflix: Java had no frame pointer support, which broke every application stack. The author wrote a c2 compiler fix for the JVM; Oracle reworked it and shipped it as -XX:+PreserveFramePointer in JDK8u60. libc came next - he built his own with frame pointers for production, then worked with Canonical on a prebuilt libc6-prof.\n\nWrite the historical narrative section of a technical blog post for systems and performance engineers.", "A": "In 2004 a compiler developer, Roger Sayle, changed gcc to stop generating frame pointers, writing : \"The simple patch below tweaks the i386 backend, such that we now default to the equivalent of \"-fomit-frame-pointer -ffixed-ebp\" on 32-bit targets\" i386 (32-bit microprocessors) only have four general purpose registers, so freeing up %ebp takes you from four to five (or if you include %si and %di, from six to seven). I'm sure this delivered large performance improvements and I wouldn't try arguing against it. Roger cited two other reasons for this change: The desire to outperform Intel's icc compiler, and the belief that it didn't break debuggers (of the time) since they supported other stack walking techniques. 2005-2023: The winter of broken profilers However, the change was then applied to x86-64 (64-bit) as well, which had over a dozen registers and didn't benefit so much from freeing up one more. And there are debuggers/profilers that this change did break (typically system profilers, not language specific ones), more so today with eBPF, which didn't exist back then. As my former Sun Microsystems colleague Eric Schrock (nickname Schrock) wrote in November 2004 : \"On i386, you at least had the advantage of increasing the number of usable registers by 20%. On amd64, adding a 17th general purpose register isn't going to open up a whole new world of compiler optimizations. You're just saving a pushl, movl, an series of operations that (for obvious reasons) is highly optimized on x86. And for leaf routines (which never establish a frame), this is a non-issue. Only in extreme circumstances does the cost (in processor time and I-cache footprint) translate to a tangible benefit - circumstances which usually resort to hand-coded assembly anyway. Given the benefit and the relative cost of losing debuggability, this hardly seems worth it.\" In Schrock's conclusion: \"it's when people start compiling /usr/bin/ without frame pointers that it gets out of control.\" This is exactly what happened on Linux, not just /usr/bin but also /usr/lib and application code! I'm sure there are people who are too new to the industry to remember the pre-2004 days when profilers would \"just work\" without OS and runtime changes. 2014: Java in Flames When I joined Netflix in 2014, I found Java's lack of frame pointer support broke all application stacks (pictured in my 2014 Surge talk on the right). I ended up developing a fix for the JVM c2 compiler which Oracle reworked and added as the -XX:+PreserveFramePointer option in JDK8u60 (see my Java in Flames post for details [ PDF ]). While that Java change led to discovering countless performance wins in application code, libc was still breaking some portion of the samples (as pictured in the example at the top of this post) and was breaking most stacks in off-CPU flame graphs. I started by compiling my own libc for production use with frame pointers, and then worked with Canonical to have one prebuilt for Ubuntu. For a while I was promoting the use of Canonical's libc6-prof, which was libc6 with frame pointers.", "B": "Frame pointers on x86-64: a default measured on the wrong target\n\nTwenty years of truncated stack traces on x86-64 come from a compiler default that was justified by a register-pressure measurement on i386 and then carried, unchanged and unremeasured, to a target where the register it frees is the seventeenth.\n\nThe register in question is %rbp, which the x86-64 ABI names as the frame pointer: it holds the base of the current stack frame, and each function's prologue pushes the caller's value and sets its own, two instructions, with a matching pop on the way out. External profilers and debuggers -- Linux perf, eBPF -- walk a stack by chasing that chain of saved %rbp values from frame to frame, which is the mechanism behind every flame graph you have ever looked at. The ABI marks the use as optional. Code can index into its frame off %rsp instead, which deletes those two instructions and hands %rbp back to the register allocator as a general-purpose register.\n\nOn i386, handing that register back was worth having. Roger Sayle patched the gcc i386 backend in 2004 so 32-bit targets compiled as though -fomit-frame-pointer -ffixed-ebp had been passed, and on a machine with four usable general-purpose registers the patch made it five, or six to seven if you count %si and %di. A 25% increase in the allocator's working set changes which values live in registers across a loop body and which spill to memory, which is a different class of generated code and not a shaved instruction. Sayle gave two further reasons: he wanted to beat Intel's icc on benchmarks, and he judged that the debuggers of the day would be unharmed, since they already supported other ways of walking a stack.\n\nThe same default was then applied to x86-64, where the arithmetic does not survive the change of target. Eric Schrock, then at Sun, objected in November 2004 and made the argument quantitatively: amd64 already had more than a dozen general-purpose registers, and a seventeenth opens no new class of compiler optimization, because at that width the allocator was not the binding constraint. What remains is the pushl/movl pair, which the hardware has long since optimized, and leaf routines -- the functions most likely to be hot -- never establish a frame at all, so they pay nothing either way. Schrock's closing line was that the practice goes off the rails once people begin compiling /usr/bin without frame pointers. Linux then compiled /usr/bin, /usr/lib and application code that way.\n\nWhat makes the cost large is that the frame pointer is a property of a whole call path, not of a function. A stack walk stops at the first frame that did not set %rbp, and everything below that point in the chain is lost, including frames compiled with the pointer intact. libc sits on nearly every interesting path, so a walk that reaches libc returns without the application frames above it. In a flame graph those truncated traces do not scatter -- they all bear the same short prefix, so they merge into one block against the left edge, 15% of the samples in one example. The 15% is not the fraction of time you lost visibility into; it is the fraction of samples whose attribution collapsed into a single uninformative column.\n\nOff-CPU flame graphs come off worse, because libc read and write calls and mutex operations are most of what an off-CPU profile contains by construction. The exact frames that terminate the walk are the frames the profile exists to explain.\n\nRepairing this took a decade of per-runtime work, which is the measure of how expensive the default was. Java had no frame pointer support at all in 2014, which broke every application stack on a JVM; a c2 compiler fix written at Netflix was reworked by Oracle and shipped as -XX:+PreserveFramePointer in JDK8u60. libc came next: a private build with frame pointers for production first, then a prebuilt libc6-prof produced with Canonical. Each of those is one runtime and one distribution, and the reason each had to be done separately is the same path property above. A frame-pointer JVM above a frame-pointer-less libc still truncates.\n\nMeasure the trade on the target you ship on, with the register count that target actually has. Compile your hot binary both ways and compare cycles; on x86-64 the difference is usually within noise for anything that is not a tight leaf-heavy loop, which is the regime Schrock described in 2004. Then price the other side: run a profile against an unmodified libc and against libc6-prof, and count the fraction of samples that terminate before reaching application code. If that fraction is near 15%, the defaults are costing you attribution on one sample in seven, and the recovery is a rebuild with -fno-omit-frame-pointer plus -XX:+PreserveFramePointer for any JVM in the path.\n"}, {"pair_id": "p035", "brief": "Raw material for the risks section of the node-swap KEP, covering four risks and what was done about each. Resource exhaustion: earlier releases offered an UnlimitedSwap option for workloads, which let a workload consume all the swap on a node and push the node unhealthy; UnlimitedSwap was dropped from the API in beta2. Security: swap on an unencrypted disk can put critical information, including Kubernetes secrets, onto disk where anyone with disk access can read it; the mitigation is encrypted swap, but handling encryption is a general OS configuration concern outside the kubelet's remit, so the answer is documentation that warns users. Cgroups v1: supporting it was an early goal, but sig-node concluded that swap on cgroup v1 would be very difficult, so the feature is limited to cgroups v2; cgroup v1 is expected to be deprecated eventually, which blunts the inconvenience. Memory-backed volumes: Kubernetes guarantees some volumes never reside on disk \u2014 secrets, memory-backed emptyDirs \u2014 and the kubelet mounts them as tmpfs on the host. When --fail-swap-on=false, the tmpfs noswap option is used to keep those pages off disk. That option needs kernel 6.4 or newer, though distributions may backport it, so the kubelet uses it when the kernel is at least 6.4, otherwise tries mounting a dummy volume with noswap to detect a backport, and otherwise warns that the option is unsupported. Once support is widespread this probe can go away. Write this risks-and-mitigations section for KEP reviewers.", "A": "## Risks and Mitigations\n\n### A single workload can exhaust node swap\n\nEarlier releases exposed an UnlimitedSwap option, which let one workload claim every swap page on the node and drive the node unhealthy. We removed UnlimitedSwap from the API in beta2. A workload that would previously have absorbed all swap now receives a bounded allocation, and a node no longer becomes unschedulable because one pod grew without a ceiling. Reviewers should read this as a deliberate narrowing of the beta1 surface: the option is gone, not deprecated, and no configuration restores it.\n\n### Swap on an unencrypted disk leaks secrets\n\nThe kernel writes swapped pages to whatever block device backs the swap area. If that device is unencrypted, anything a process held in memory can land on disk in cleartext, including Kubernetes secrets, service account tokens, and decrypted config. Anyone who can read the disk -- a salvaged drive, a snapshot, an operator with host access -- can read those pages.\n\nEncrypted swap closes this, and the kubelet cannot supply it. Disk encryption is configured in the operating system, below and outside the kubelet's remit, and a kubelet flag that claimed to encrypt swap would be describing work it does not perform. Our mitigation is documentation: the feature's user-facing docs state that swap without disk encryption exposes in-memory data, including secrets, and direct administrators to configure encrypted swap before enabling swap on nodes that handle sensitive workloads. We accept that documentation is a weaker control than an enforced check, and we do not have a better one at this layer.\n\n### Cgroups v1 is out of scope\n\nSupporting cgroups v1 was an early goal of this KEP. sig-node examined it and concluded that swap accounting and limit enforcement on cgroup v1 would be very difficult to implement correctly, so the feature requires cgroups v2. On a cgroup v1 node the kubelet does not enable swap for workloads. Cgroup v1 is on a path to deprecation across the ecosystem, which shrinks the population this excludes over time, though it does exclude some clusters today.\n\n### Memory-backed volumes must stay off disk\n\nKubernetes guarantees that certain volumes never reside on disk. Secrets and memory-backed emptyDirs are the two that matter here, and the kubelet mounts both as tmpfs on the host. Enabling swap breaks that guarantee by default, because tmpfs pages are swappable like any other anonymous memory.\n\nWhen `--fail-swap-on=false`, the kubelet mounts these tmpfs volumes with the `noswap` option, which pins their pages in memory. That option requires kernel 6.4 or newer upstream, and distributions do backport it, so a version comparison alone would refuse the option on kernels that support it. The kubelet therefore resolves support in two steps. It uses `noswap` directly when the kernel reports 6.4 or later. Below that, it attempts to mount a dummy tmpfs volume with `noswap` and observes whether the mount succeeds, which detects a backport on an older reported version. If both checks fail, the kubelet emits a warning that `noswap` is unsupported on this kernel and proceeds without it.\n\nThe dummy-mount probe exists only to cover the backport window. Once 6.4 and later kernels are widespread across supported distributions, we intend to delete the probe and keep the version check. Reviewers who want to test the fallback can boot a node on a pre-6.4 kernel without the backport, set `--fail-swap-on=false`, and read the kubelet log for the warning.\n", "B": "In previous releases of Swap, we had an `UnlimitedSwap` option for workloads. This can cause problems where workloads can use up all swap. If all swap is used up on a node, it can make the node go unhealthy. To avoid exhausting swap on a node, `UnlimitedSwap` was dropped from the API in beta2. #### Security risk Enabling swap on a system without encryption poses a security risk, as critical information, such as Kubernetes secrets, may be swapped out to the disk. If an unauthorized individual gains access to the disk, they could potentially obtain these secrets. To mitigate this risk, it is recommended to use encrypted swap. However, handling encrypted swap is not within the scope of kubelet; rather, it is a general OS configuration concern and should be addressed at that level. Nevertheless, it is essential to provide documentation that warns users of this potential issue, ensuring they are aware of the potential security implications and can take appropriate steps to safeguard their system. The documentation updates are required; there is already a [blog article](https://kubernetes.io/blog/2023/08/24/swap-linux-beta/) that mentions the security implications. To guarantee that system daemons are not swapped, the kubelet must configure the `memory.swap.max` setting to `0` within the system reserved cgroup. Moreover, to make sure that burstable pods are able to utilize swap space, kubelet should verify that the cgroup associated with burstable pods should not be nested under the cgroup designated for system reserved. Additionally, end user may decide to disable swap completely for a Pod or a container in beta 1 by making Pod guaranteed or set request == limit for a container. This way, there will be no swap enabled for the corresponding containers and there will be no information exposure risks. #### Cgroupv1 support In the early release of this feature, there was a goal to support cgroup v1. As the feature progressed, sig-node realized that supporting swap with cgroup v1 would be very difficult. Therefore, this feature is limited to cgroupv2 only. The main goal is to deprecate cgroupv1 eventually so this should not be a major inconvience. #### Memory-backed volumes Kubernetes guarantees that some volumes' memory would never reside on disk, e.g. Secrets, memory-backed emptyDirs, etc. Behind the scenes, Kubelet mounts such volumes as tmpfs volumes on the host. To address this risk, if `--fail-swap-on=false`, the [tmpfs noswap option](https://www.kernel.org/doc/html/latest/filesystems/tmpfs.html) will be used in order to prevent the volumes' pages from swapping to disk. Bear in mind that the tmpfs noswap option is fairly new and is supported in kernel versions >= 6.4. However, different Linux distributions can decide to backport this options to older versions of the kernel. Therefore, when `--fail-swap-on=false` is being provided on a node: * If the kernel version equals or is above 6.4, the tmpfs noswap option is being used when necessary. * Else, kubelet would try to mount a dummy volume with the tmpfs noswap option to understand whether the option is backported. If the mount succeeds, the tmpfs noswap option is being used when necessary. * Else, kubelet would raise a warning about the option not being supported and the possible risk. In the longer term, when this option would be very widely supported, this would no longer be a concern, hence this logic could be dropped."}, {"pair_id": "p036", "brief": "Second half of a Netflix case study on a file-processing microservice whose 100-Gbyte S3 uploads took hours while 40-Gbyte ones took minutes. Memory evidence: free -m on the problem instance showed total 64,414 MB, used 15,421, free 349, buff/cache 48,643, available 48,409, swap 0. So a 64-Gbyte memory system with 48 Gbytes sitting in the page cache and only 349 MB free. That plus the file sizes suggested a theory: 100-Gbyte files bust the page cache while 40-Gbyte files fit. Confirmation came from cachestat, an experimental tool written for Ftrace and since ported to bcc/eBPF, which reports page cache statistics. On the 100-Gbyte upload, cachestat showed hit ratios of 74.1%, 9.7%, 6.5%, 12.0%, 34.5%, 7.0%, 11.1% per second, with misses running from 632 up to 23,341, BUFFERS_MB 17 and CACHE_MB about 48,000. Ratios in the upper 90s are what you want to see; this is cache busting, because the 100-Gbyte file does not fit in 48 Gbytes of page cache, so misses turn into disk I/O. Control test on a 32-Gbyte file upload: cachestat showed 100.0% hit ratio with 0 misses across every second sampled (hits 33,424 to 65,158), BUFFERS_MB 41, CACHE_MB about 33,680; free -m showed used 18,421, free 11,218, buff/cache 34,773; iostat showed almost no disk I/O. The smaller file is processed entirely from memory however many passes it takes, without re-reading from disk. Recommended fixes: quickest is a larger-memory instance that fits the 100-Gbyte files; developers can also rework the code with the memory constraint in mind, for example processing parts of the file rather than making multiple passes over the whole thing. Closing context: cachestat was the killer tool but is still experimental, built under the constraints of low overhead and Ftrace function-profiler only. At the LSFMMBPF 2019 keynote in Puerto Rico, with Linux mm kernel engineers present, the argument was made that these statistics are commonly enough needed that they belong in /proc; the engineers pointed out real challenges in providing them properly, and page cache counters are hot-path so adding them is not free. Write the diagnosis-and-recommendation section of a rough case-study post for systems and performance engineers.", "A": "Diagnosis: the 100-Gbyte uploads bust the page cache\n\nThe memory numbers pointed at the page cache before any tracing started. On the problem instance, free -m reported 64,414 MB total, 15,421 MB used, 349 MB free, 48,643 MB in buff/cache, 48,409 MB available, and no swap. A 64-Gbyte box with 48 Gbytes of page cache and 349 MB genuinely free is not starved for memory, and the kernel is doing what it should: caching file contents in whatever the application is not using.\n\nSet that 48-Gbyte cache beside the file sizes and the split in behavior explains itself. A 40-Gbyte file fits inside 48 Gbytes of cache; a 100-Gbyte file does not, and misses it by better than a factor of two. If the service makes more than one pass over the file, the 40-Gbyte case reads from disk once and serves every later pass from memory, while the 100-Gbyte case evicts the head of the file before it reaches the tail and re-reads from disk on every pass.\n\ncachestat confirmed it directly. cachestat is an experimental tool, written originally for Ftrace and since ported to bcc/eBPF, that reports per-second page cache hits, misses, buffer size, and cache size. During the 100-Gbyte upload it showed hit ratios of 74.1%, 9.7%, 6.5%, 12.0%, 34.5%, 7.0%, and 11.1% across consecutive seconds, with misses climbing from 632 to 23,341 per second, BUFFERS_MB at 17, and CACHE_MB near 48,000. A healthy workload sits in the upper 90s. Five of those seven seconds are under 15%, which means most reads went to disk.\n\nThe control run settles the question. Upload a 32-Gbyte file and sample the same counters. cachestat reported a 100.0% hit ratio with zero misses in every second sampled, hits between 33,424 and 65,158, BUFFERS_MB 41, and CACHE_MB about 33,680 -- the whole file resident. free -m on that run showed 18,421 MB used, 11,218 MB free, and 34,773 MB in buff/cache, and iostat showed almost no disk I/O. The 32-Gbyte file is processed entirely from memory however many passes the code takes, because nothing evicts it.\n\nThat is the whole gap between minutes and hours. Same code, same instance type, same access pattern; only the working set changed, and it crossed the size of the page cache. The 100-Gbyte case converts what should be memory reads into disk reads at up to 23,341 misses per second, and the wall-clock cost of those reads is the entire regression.\n\nRecommendations\n\nMove the 100-Gbyte workload to a larger-memory instance. This is the quickest fix and it requires no code change: size the instance so the file plus the application's own 15 Gbytes of anonymous memory fit with headroom, which means roughly 128 Gbytes for a 100-Gbyte file. Verify the fix with cachestat rather than with wall-clock time alone, because a hit ratio back in the upper 90s tells you the mechanism was addressed and a faster run by itself does not.\n\nRework the code to respect the memory constraint. Bigger instances buy time and stop working when file sizes grow again. Process the file in parts that fit in cache instead of making multiple passes over the whole thing, so each chunk is read from disk once and all subsequent work on it hits memory. That bounds the working set independently of the input size.\n\nOne caveat on the tooling. cachestat was the tool that cracked this case, and it remains experimental, constrained by low overhead and by what the Ftrace function profiler exposes. At the LSFMMBPF 2019 keynote in Puerto Rico, in front of Linux mm kernel engineers, we argued that statistics this commonly needed belong in /proc. Those engineers raised real difficulties: page cache counters live on hot paths, and maintaining them is not free.\n", "B": "There's not much memory left, 349 Mbytes, but more interesting is the amount in the buffer/page cache: 48,643 Mbytes (48 Gbytes). This is a 64-Gbyte memory system, and 48 Gbytes is in the page cache (the file system cache). Along with the numbers from the problem statement, this gives me a theory: Do the 100-Gbyte files bust the page cache, whereas 40-Gbyte files fit? 6. cachestat cachestat is an experimental tool I developed that uses Ftrace and has since been ported to bcc/eBPF. It shows statistics for the page cache: # /apps/perf-tools/bin/cachestat Counting cache functions... Output every 1 seconds. HITS MISSES DIRTIES RATIO BUFFERS_MB CACHE_MB 1811 632 2 74.1% 17 48009 1630 15132 92 9.7% 17 48033 1634 23341 63 6.5% 17 48029 1851 13599 17 12.0% 17 48019 1941 3689 33 34.5% 17 48007 1733 23007 154 7.0% 17 48034 1195 9566 31 11.1% 17 48011 [...] This shows many cache misses, with a hit ratio varying between 6.5 and 74%. I usually like to see that in the upper 90's. This is \"cache busting.\" The 100 Gbyte file doesn't fit in the 48 Gbytes of page cache, so we have many page cache misses that will cause disk I/O and relatively poor performance. The quickest fix is to move to a larger-memory instance that does fit 100 Gbyte files. The developers can also rework the code with the memory constraint in mind to improve performance (e.g., processing parts of the file, instead of making multiple passes over the entire file). 7. Smaller File Test For further confirmation, I collected the same outputs for a 32 Gbyte file upload. cachestat shows a ~100% cache hit ratio: # /apps/perf-tools/bin/cachestat Counting cache functions... Output every 1 seconds. HITS MISSES DIRTIES RATIO BUFFERS_MB CACHE_MB 61831 0 126 100.0% 41 33680 53408 0 78 100.0% 41 33680 65056 0 173 100.0% 41 33680 65158 0 79 100.0% 41 33680 55052 0 107 100.0% 41 33680 61227 0 149 100.0% 41 33681 58669 0 71 100.0% 41 33681 33424 0 73 100.0% 41 33681 ^C This smaller size allows the service to process the file (however many passes it takes) entirely from memory, without re-reading it from disk. free(1) shows it fitting in the page cache: # free -m total used free shared buff/cache available Mem: 64414 18421 11218 5 34773 45407 Swap: 0 0 0 And iostat(1) shows little disk I/O, as expected: # iostat -xz 1 Linux 4.4.0-1072-aws (xxx) 12/19/2018 _x86_64_ (16 CPU) avg-cpu: %user %nice %system %iowait %steal %idle 12.25 0.00 1.24 0.19 0.03 86.29 Device: rrqm/s wrqm/s r/s w/s rkB/s wkB/s avgrq-sz avgqu-sz await r_await w_await svctm %util xvda 0.00 0.32 0.31 0.19 7.09 4.85 47.59 0.01 12.58 5.44 23.
