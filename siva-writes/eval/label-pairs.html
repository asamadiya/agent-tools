e dependency array in the Dashboard and are auditing our other useEffect-driven API calls for the same reference-identity mistake. We are onboarding Tenant Service to Argo Rollouts so that a bad version is withdrawn on its own error signal. We are adding retry labelling to Tenant Service telemetry so responders can separate retries from new requests on a dashboard rather than by inference. We are also giving Tenant Service standing capacity headroom and a permanent rate limit, so an abusive client degrades itself instead of every API caller.\n"}, {"pair_id": "p010", "brief": "Raw material, Cloudflare, 18 November 2025, all times UTC. 11:05 a permissions change was deployed on a ClickHouse database cluster so users could see metadata for underlying tables in the r0 database, not just the default database. The Bot Management feature file is regenerated every five minutes by a query over system.columns that filters on table name but not on database name. After 11:05 that query started returning duplicate rows, more than doubling the number of feature rows written into the generated file. The proxy's bots module preallocates memory for that file and will not load more than 200 features from it; the bot-scoring model itself uses about 60 features at runtime, so the limit had never been approached before. The doubled file carried more than 200 features. Crossing the limit triggered an unwrap on an Err in the FL2 Rust path: thread fl2_worker_thread panicked, returning HTTP 5xx. Rollout was gradual across ClickHouse nodes, so good and bad files alternated every five minutes and the network recovered then failed repeatedly. FL2 customers saw 5xx; FL1 customers saw no errors but all traffic scored bot=0, producing false positives for anyone blocking on bot score. Cloudflare's independently hosted status page went down coincidentally; responders suspected an Aisuru-style DDoS. 11:28 impact starts, 11:31 first automated detection, 11:35 incident call, 13:05 Workers KV and Access bypass, 14:24 propagation stopped, 14:30 core traffic normal, 17:06 all clear. Worst outage since 2019. Write the root-cause section of the public postmortem for customers and outside engineers.", "A": "Every request to Cloudflare takes a well-defined path through our network. It could be from a browser loading a webpage, a mobile app calling an API, or automated traffic from another service. These requests first terminate at our HTTP and TLS layer, then flow into our core proxy system (which we call FL for \u201cFrontline\u201d), and finally through Pingora, which performs cache lookups or fetches data from the origin if needed. We previously shared more detail about how the core proxy works here . As a request transits the core proxy, we run the various security and performance products available in our network. The proxy applies each customer\u2019s unique configuration and settings, from enforcing WAF rules and DDoS protection to routing traffic to the Developer Platform and R2. It accomplishes this through a set of domain-specific modules that apply the configuration and policy rules to traffic transiting our proxy. One of those modules, Bot Management, was the source of today\u2019s outage. Cloudflare\u2019s Bot Management includes, among other systems, a machine learning model that we use to generate bot scores for every request traversing our network. Our customers use bot scores to control which bots are allowed to access their sites \u2014 or not. The model takes as input a \u201cfeature\u201d configuration file. A feature, in this context, is an individual trait used by the machine learning model to make a prediction about whether the request was automated or not. The feature configuration file is a collection of individual features. This feature file is refreshed every few minutes and published to our entire network and allows us to react to variations in traffic flows across the Internet. It allows us to react to new types of bots and new bot attacks. So it\u2019s critical that it is rolled out frequently and rapidly as bad actors change their tactics quickly. A change in our underlying ClickHouse query behaviour (explained below) that generates this file caused it to have a large number of duplicate \u201cfeature\u201d rows. This changed the size of the previously fixed-size feature configuration file, causing the bots module to trigger an error. As a result, HTTP 5xx error codes were returned by the core proxy system that handles traffic processing for our customers, for any traffic that depended on the bots module. This also affected Workers KV and Access, which rely on the core proxy. Unrelated to this incident, we were and are currently migrating our customer traffic to a new version of our proxy service, internally known as FL2 . Both versions were affected by the issue, although the impact observed was different. Customers deployed on the new FL2 proxy engine, observed HTTP 5xx errors. Customers on our old proxy engine, known as FL, did not see errors, but bot scores were not generated correctly, resulting in all traffic receiving a bot score of zero. Customers that had rules deployed to block bots would have seen large numbers of false positives. Customers who were not using our bot score in their rules did not see any impact. Throwing us off and making us believe this might have been an attack was another apparent symptom we observed: Cloudflare\u2019s status page went down. The status page is hosted completely off Cloudflare\u2019s infrastructure with no dependencies on Cloudflare. While it turned out to be a coincidence, it led some of the team diagnosing the issue to believe that an attacker may be targeting both our systems as well as our status page. Visitors to the status page at that time were greeted by an error message: In the internal incident chat room, we were concerned that this might be the continuation of the recent spate of high volume Aisuru DDoS attacks : The query behaviour change I mentioned above that a change in the underlying query behaviour resulted in the feature file containing a large number of duplicate rows. The database system in question uses ClickHouse\u2019s software. For context, it\u2019s helpful to know how ClickHouse distributed queries work. A ClickHouse cluster consists of many shards. To query data from all shards, we have so-called distributed tables (powered by the table engine Distributed ) in a database called default . The Distributed engine queries underlying tables in a database r0 . The underlying tables are where data is stored on each shard of a ClickHouse cluster. Queries to the distributed tables run through a shared system account. As part of efforts to improve our distributed queries security and reliability, there\u2019s work being done to make them run under the initial user accounts instead. Before today, ClickHouse users would only see the tables in the default database when querying table metadata from ClickHouse system tables such as system.tables or system.columns . Since users already have implicit access to underlying tables in r0 , we made a change at 11:05 to make this access explicit, so that users can see the metadata of these tables as well. By making sure that all distributed subqueries can run under the initial user, query limits and access grants can be evaluated in a more fine-grained manner, avoiding one bad subquery from a user affecting others. The change explained above resulted in all users accessing accurate metadata about tables they have access to. Unfortunately, there were assumptions made in the past, that the list of columns returned by a query like this would only include the \u201c default \u201d database: SELECT name , type FROM system . columns WHERE table = 'http_requests_features' order by name ; Note how the query does not filter for the database name. With us gradually rolling out the explicit grants to users of a given ClickHouse cluster, after the change at 11:05 the query above started returning \u201cduplicates\u201d of columns because those were for underlying tables stored in the r0 database. This, unfortunately, was the type of query that was performed by the Bot Management feature file generation logic to construct each input \u201cfeature\u201d for the file mentioned at the beginning of this section. The query above would return a table of columns like the one displayed (simplified example): However, as part of the additional permissions that were granted to the user, the response now contained all the metadata of the r0 schema effectively more than doubling the rows in the response ultimately affecting the number of rows (i.e. features) in the final file output. Memory preallocation Each module running on our proxy service has a number of limits in place to avoid unbounded memory consumption and to preallocate memory as a performance optimization. In this specific instance, the Bot Management system has a limit on the number of machine learning features that can be used at runtime. Currently that limit is set to 200, well above our current use of ~60 features. Again, the limit exists because for performance reasons we preallocate memory for the features. When the bad file with more than 200 features was propagated to our servers, this limit was hit \u2014 resulting in the system panicking. The FL2 Rust code that makes the check and was the source of the unhandled error is shown below:", "B": "Root cause\n\nA routine database permissions change, not an attack, took down our network on 18 November 2025. At 11:05 UTC we deployed a change to a ClickHouse database cluster that let query accounts see metadata for the tables underlying the r0 database instead of only the default database. The change was correct in itself and had nothing to do with bot management. It was consumed, unintentionally, by a query nobody had revisited in years.\n\nThe Bot Management feature file is regenerated every five minutes by a query over system.columns. That query filtered on table name and not on database name. Before 11:05 the filter was adequate, because the querying account could see only one database and that implicit scoping did the work the WHERE clause did not. After 11:05 the same account could see the same table in two databases, and every column came back twice. The generated file carried more than double its usual number of feature rows.\n\nOur proxy will not load more than 200 features from that file. The bots module preallocates memory for the feature set, and 200 was chosen as more than three times the roughly 60 features the bot-scoring model actually uses at runtime -- headroom we believed generous, and that no file had ever approached. The doubled file crossed it. In the FL2 proxy engine, the code that loads the file called unwrap on a Result that could now be Err, and thread fl2_worker_thread panicked. A panicked worker cannot serve the request it was holding, and the request became an HTTP 5xx.\n\nThe network then failed and recovered on a five-minute cycle. The permissions change rolled out gradually across ClickHouse nodes, and each regeneration read whichever node it reached: a node still carrying the old permissions produced a good file, an updated node produced a bad one. A good file restored service, and the next bad one took it away again. An oscillation of that shape looks more like an attack than like a bad deploy, and for a while we read it that way.\n\nCustomers on the two proxy paths saw two different failures. FL2 customers saw 5xx errors, which were loud and unambiguous. FL1 customers saw no errors at all; their traffic was scored, but every request received a bot score of zero. Any customer whose rules block on a low bot score blocked real users and had nothing in their logs to explain it. The silent failure is the worse of the two to have shipped.\n\nTwo things lengthened the diagnosis. Cloudflare's status page is hosted entirely outside our infrastructure and shares no dependency with it, and it went down at the same time for unrelated reasons. We read the coincidence as evidence: an Aisuru-style DDoS large enough to hit both our edge and an independent host was a coherent story, and we spent time on it. There was no attack.\n\nImpact began at 11:28. Automated detection fired at 11:31, three minutes later, and we opened an incident call at 11:35. At 13:05 we bypassed Workers KV and Access from the affected path, which restored those products for their customers. At 14:24 we stopped propagation of the bad feature file and forced a known-good version. Core traffic was normal at 14:30, and every downstream service was clear at 17:06. Between 11:28 and 14:30, just under three hours, a large share of requests through our network failed. This is our worst outage since 2019.\n\nThe permissions change was the trigger, not the root cause. The root cause is that a query with an under-specified filter fed an unvalidated file into a hot path, and the hot path answered an unexpected input by panicking instead of rejecting the file and continuing to serve with the last good one. A ceiling of 200 features is a reasonable guard; crashing when a file exceeds it is not. We generate that file ourselves, and we treated it as trusted for exactly that reason -- the same mistake as trusting any input because of where it came from rather than because it was checked. We are now validating every internally generated configuration file the proxy consumes, on the same terms as user input, and we are removing the panic paths that let a malformed one take a worker thread down.\n"}, {"pair_id": "p011", "brief": "Raw material for a Kubernetes enhancement proposal on in-place pod resource updates. Today Pod.Spec.Containers[i].Resources is immutable, so any change to CPU or memory requests or limits forces the pod to be recreated. Three things drive a change: load rose and the allocation is short; load fell and the allocation sits idle; the values were simply set wrong. Stateless replicas usually survive recreation; low-replica services, stateful workloads and batch jobs pay in availability or cost. Core idea: the spec resources become desired state, and PodStatus is extended to report the resources actually applied. Three CRI gaps also need fixing: UpdateContainerResources takes a Linux-shaped resources parameter that does not fit Windows or future runtimes; there is no CRI call letting kubelet read back the CPU and memory limits a runtime has applied; and the behavior expected of a runtime handling a resource update is not documented. Goals: resize without necessarily restarting the container; let whoever initiated the resize (user, VPA, StatefulSet, JobController) choose what happens when in-place is impossible; let users mark which containers are safe to resize. Non-goals: QoS class change, non-restartable init containers, evicting lower-priority pods to make room, resource types other than CPU and memory, CPU/memory manager policies other than 'None', and resolving scheduler races. Write the motivation and scope section of this KEP for SIG Node reviewers.", "A": "- KEP: In-Place Update of Pod Resources\n- Sections: Motivation, Goals, Non-Goals\n- SIG: sig-node\n\n## Motivation\n[motivation]: #motivation\n\nA pod's CPU and memory requests and limits should become desired state that kubelet reconciles on the running container, because `Pod.Spec.Containers[i].Resources` is immutable today and the only way to change an allocation is to recreate the pod.\n\nThree situations produce a wrong allocation, and all three are ordinary. Load rises and the allocation is short, so the container throttles or is OOM-killed. Load falls and the allocation sits idle, billed against the node's allocatable capacity while nothing uses it. The values were set wrong when the workload was first written, and nobody noticed until it ran.\n\nRecreation is an acceptable price for exactly one class of workload. A stateless deployment with many replicas absorbs the rolling restart, because the remaining replicas serve while one is rescheduled. A service running one or two replicas loses a measurable fraction of its capacity for the duration. A stateful workload pays reattachment and recovery time. A batch job discards the work done since its last checkpoint, which for a long-running job can be hours. These workloads currently choose between an allocation they know is wrong and a restart they cannot afford.\n\nThe immutability is not an arbitrary restriction -- it follows from the spec carrying two meanings at once. `Resources` is both the value the user asked for and the record of what the runtime applied, and those are the same value only because the pod is never resized. Separating them is the whole of this proposal: the spec becomes the desired value, and PodStatus is extended to report the resources the runtime has actually applied. Kubelet drives one toward the other, and a client reads both to know whether a resize has landed.\n\nThree CRI gaps block that reconciliation loop. `UpdateContainerResources` takes a resources parameter shaped for Linux cgroups, which does not fit Windows and will not fit runtimes added later. No CRI call lets kubelet read back the CPU and memory limits a runtime has applied, so the status kubelet would report has no authoritative source. The behavior expected of a runtime handling a resource update is undocumented, so two conformant runtimes may disagree on whether a resize restarts the container. This KEP fixes all three.\n\n## Goals\n[goals]: #goals\n\n- Resize a container's CPU and memory allocation without necessarily restarting the container.\n- Let whoever initiated the resize -- a user, VPA, a StatefulSet controller, or JobController -- declare what happens when in-place resize is impossible, instead of hardcoding one fallback in kubelet.\n- Let users mark which containers in a pod are safe to resize in place.\n\n## Non-Goals\n[non-goals]: #non-goals\n\nSix things stay out of scope, and each is separable from the reconciliation loop above.\n\n- Changing a pod's QoS class as a result of a resize.\n- Resizing init containers that are not restartable.\n- Evicting lower-priority pods to make room for a resize that does not fit on the node.\n- Resource types other than CPU and memory.\n- CPU manager and memory manager policies other than `None`.\n- Resolving the race between a resize and a concurrent scheduling decision on the same node.\n\nThe last two are real problems and neither is created by this KEP. A follow-up can address them once the spec-and-status contract and the CRI surface are settled.\n", "B": "- KEP: In-place update of Pod resources\n- Target SIG: SIG Node\n\n## Summary\n[summary]: #summary\n\n`Pod.Spec.Containers[i].Resources` is immutable today. Changing a container's CPU\nor memory request or limit requires deleting the pod and creating a replacement.\nThis KEP makes the spec resources a desired value that kubelet acts on, and\nextends `PodStatus` to report the resources a runtime actually applied.\n\n## Motivation\n[motivation]: #motivation\n\nThree situations force a resize, and today all three cost a pod recreation. Load\nrose and the allocation is short, so the container throttles or the kernel\nOOM-kills it. Load fell and the allocation sits idle, holding node capacity that\nno other pod can schedule against. Or the values were wrong when the pod was\nwritten, and nothing about the workload has changed at all.\n\nStateless replicas usually absorb the recreation: the Deployment rolls a new pod,\nthe endpoint drains, and the cost is the length of the rollout. The workloads\nthat cannot absorb it are the ones that most often need a resize. A service\nrunning two or three replicas gives up a large fraction of its serving capacity\nfor the duration of the restart. A stateful pod loses local state, warm caches,\nand its place in a quorum. A batch job discards whatever it computed since its\nlast checkpoint, which for a long job can be hours.\n\nMutable spec resources require a status field, because the request and the\nreality can diverge. A runtime may refuse a limit, apply part of an update, or\napply it after the API call has returned. A controller that reads only the spec\nreads its own intent back and learns nothing about the node. `PodStatus`\ntherefore carries the applied values, and a client diffs spec against status to\ndecide whether a resize has completed.\n\nThree CRI gaps block this. `UpdateContainerResources` takes a Linux-shaped\nresources parameter that does not describe a Windows container or a future\nruntime. No CRI call lets kubelet read back the CPU and memory limits a runtime\nhas applied, so kubelet cannot populate the status it is now responsible for.\nThe behavior expected of a runtime handling a resource update is undocumented,\nwhich leaves each runtime free to decide whether the call is synchronous,\npartial, or idempotent.\n\n## Goals\n[goals]: #goals\n\n- Resize a container's CPU and memory without necessarily restarting the\n  container.\n- Let whoever initiated the resize -- a user, VPA, a StatefulSet controller, a\n  JobController -- declare what should happen when in-place is impossible.\n- Let users mark which containers in a pod are safe to resize.\n- Define the missing CRI surface: a runtime-neutral update parameter, a call to\n  read back applied limits, and documented runtime behavior for both.\n\n## Non-Goals\n[non-goals]: #non-goals\n\n- Changing a pod's QoS class. A resize that would cross a QoS boundary is\n  rejected.\n- Resizing init containers that are not restartable.\n- Evicting or preempting lower-priority pods to make room. A resize that does not\n  fit on the node fails.\n- Resource types other than CPU and memory.\n- CPU manager and memory manager policies other than `None`.\n- Resolving the race between a resize that consumes node capacity and a scheduler\n  that has already counted that capacity as free.\n"}, {"pair_id": "p012", "brief": "Raw material, Cloudflare, 5 December 2025, all times UTC. Impact 08:47 to 09:12, about 25 minutes. Roughly 28% of all HTTP traffic Cloudflare serves was affected. Not an attack. The WAF buffers HTTP request bodies in memory for inspection; the buffer had been 128KB. To cover customers against CVE-2025-55182, a critical React Server Components vulnerability, Cloudflare began raising the buffer to 1MB, the Next.js default limit. That first change went out through the gradual deployment system. During rollout an internal WAF testing tool turned out not to support the larger buffer, so a second change disabled that tool. The tool had no effect on customer traffic, but the disable was made through the global configuration system, which does no staged rollout and reaches the entire fleet within seconds. The disable was implemented as a killswitch in the rulesets system. A rule's action can be block, log, skip, or execute, where execute triggers evaluation of a sub-ruleset. A killswitch had never before been applied to a rule with action execute. The skip was honoured, but result-processing code still dereferenced rule_result.execute, which did not exist, producing a Lua nil index error at init.lua line 314 in the FL1 proxy and HTTP 500s. The bug had sat undetected for years; the Rust reimplementation in FL2 does not have it. Affected: customers on FL1 with the Cloudflare Managed Ruleset deployed, all requests 500ing except some test endpoints such as /cdn-cgi/trace. China network traffic unaffected. 08:50 declared by automated alerts, 09:11 revert, 09:12 propagation complete. Write the public incident writeup for customers who saw 500s.", "A": "Cloudflare 500 errors on 5 December 2025\n\nCloudflare returned HTTP 500 for roughly 28% of the HTTP traffic we serve between 08:47 and 09:12 UTC on 5 December 2025, because a configuration change that disabled an internal testing tool reached a code path in our Lua proxy that had never executed before. This was not an attack. We are sorry for the disruption, and the detail below is what we owe you.\n\nThe work that led here was a security fix. CVE-2025-55182 is a critical vulnerability in React Server Components. Our WAF buffers HTTP request bodies in memory in order to inspect them, and that buffer held 128KB. Protecting customers against the CVE requires inspecting bodies up to 1MB, the Next.js default limit, so we began raising the buffer to 1MB. That change went out through our gradual deployment system, which moves a change across the fleet in stages and gives us time to observe each one.\n\nAn internal WAF testing tool turned out not to support the larger buffer, and during the rollout we disabled that tool. The tool carries no customer traffic and its state is invisible to your requests. We shipped the disable through our global configuration system, which performs no staged rollout and reaches every machine in the fleet within seconds.\n\nThe disable was a killswitch in our rulesets system, and a killswitch works by forcing a rule to skip. A rule's action is one of block, log, skip, or execute, where execute triggers evaluation of a sub-ruleset. No killswitch had ever been applied to a rule whose action is execute. The skip itself was honoured correctly, and the rule did not run. Result-processing code downstream still dereferenced rule_result.execute, a field that is populated only when the sub-ruleset actually evaluates and therefore did not exist on this skipped rule, and that nil index raised a Lua error at init.lua line 314 in FL1, our older proxy. Every request reaching that line returned 500.\n\nThe blast radius was every FL1 customer with the Cloudflare Managed Ruleset deployed. Those zones 500ed on all requests, with the exception of a few endpoints answered before ruleset evaluation such as /cdn-cgi/trace. Traffic on our China network was unaffected. FL2, the Rust reimplementation of the proxy, does not contain this bug and did not serve errors.\n\nAutomated alerts declared the incident at 08:50, three minutes after the first 500. We reverted the configuration change at 09:11, propagation completed at 09:12, and error rates returned to baseline immediately. Customer impact lasted 25 minutes.\n\nThe bug sat undetected for years because one of four rule actions was never combined with a skip. That combination was unreachable in practice until this week, and unreachable is a weaker property than tested.\n\nWhat we are changing:\n\nWe are moving killswitches and the rest of request-path configuration onto the gradual deployment system. A change capable of producing 500s must not reach the whole fleet in seconds, whatever its own stated blast radius. The tool we disabled was harmless; the mechanism we used to disable it was not.\n\nWe are auditing FL1 result processing across every combination of rule action and killswitch state, rather than the combinations that production traffic happens to generate. Four actions and two killswitch states is eight cases, and we had coverage for six of them.\n\nWe are accelerating the migration of remaining FL1 zones to FL2, which is written in Rust and rejects this class of error at compile time.\n\nWe are testing internal tooling against a pending configuration change before that change begins its rollout, instead of discovering the incompatibility partway through. Nothing about the 1MB buffer required an emergency response; the tool gap made it feel like one.\n\nIf you saw 500s during this window and have questions about your own traffic, contact Cloudflare Support and we will pull the specific request data for your zones.\n", "B": "Cloudflare incident report: HTTP 500 errors, 5 December 2025\n\nSummary\n\nOn 5 December 2025, between 08:47 and 09:12 UTC, requests through Cloudflare returned HTTP 500 errors for a large share of our customers. About 28% of all HTTP traffic we serve was affected over those 25 minutes. This was not an attack, and no customer data was exposed or lost. We caused this ourselves, with a configuration change that we pushed globally in seconds, and we are sorry.\n\nAll times below are UTC.\n\nWhat you saw\n\nIf you were affected, essentially every request to your zone returned a 500 for the duration. A small number of Cloudflare-internal endpoints such as /cdn-cgi/trace continued to answer, which is why some health checks stayed green while real traffic failed. The failure was confined to customers served by our FL1 proxy with the Cloudflare Managed Ruleset deployed. Zones on FL2, and all traffic on our China network, were unaffected.\n\nWhat happened\n\nThe trigger was a WAF buffer size increase we shipped to protect customers against CVE-2025-55182, a critical React Server Components vulnerability. Our WAF buffers HTTP request bodies in memory so it can inspect them, and that buffer had been capped at 128KB. Next.js allows request bodies up to 1MB by default, so a body between those two sizes could carry an exploit past inspection. We began raising the buffer to 1MB, and that change went out through our gradual deployment system as intended.\n\nDuring the rollout we found that an internal WAF testing tool did not support the larger buffer. The tool handles no customer traffic. We disabled it, and that is where the incident started: the disable was made through our global configuration system, which performs no staged rollout and reaches every machine in the fleet within seconds. A change with no customer-facing purpose was therefore delivered with less safety than the change it was clearing the way for.\n\nThe disable was implemented as a killswitch in our rulesets system. A rule in that system carries an action, one of block, log, skip, or execute, where execute means the rule triggers evaluation of a sub-ruleset. The killswitch works by forcing a skip. No killswitch had ever been applied to a rule whose action was execute. The skip itself was honoured correctly, but the code that processes results afterwards still reached for rule_result.execute, a field that a skipped rule does not produce. In Lua that is a nil index error, raised at init.lua line 314, and the FL1 proxy failed the request with a 500.\n\nThat bug had been in FL1 for years without ever being reached, because the one input that reaches it had never been supplied. Our Rust reimplementation of the proxy, FL2, does not have it; the equivalent code cannot compile with an unchecked field access.\n\nTimeline\n\n08:47 -- Global configuration change applied; 500s begin.\n08:50 -- Automated alerts fire and we declare an incident.\n09:11 -- We revert the configuration change.\n09:12 -- The revert finishes propagating and error rates return to baseline.\n\nWhat we are changing\n\nWe are removing the asymmetry that caused this. Changes through the global configuration system will move to the same staged, health-gated rollout that code and WAF rule changes already use, so that a change reaching 100% of the fleet in seconds is a deliberate emergency action rather than the default path.\n\nWe are also fixing the specific defect and the class it belongs to. The FL1 result-processing path now checks the action before reading action-specific fields, and we are auditing the rulesets code for every other field read that assumes a rule ran. Separately, we are adding coverage for killswitches against each of the four rule actions, including execute, which no test exercised before this week. Migration of remaining FL1 zones to FL2 continues.\n"}, {"pair_id": "p013", "brief": "Raw material, Cloudflare, 12 September 2025, all times UTC. The Tenant Service API went down and took much of the public API and the Cloudflare Dashboard with it, because Tenant Service sits in the API request authorization path; when authorization cannot be evaluated, requests return 5xx. Trigger: a dashboard bug. API calls were driven by a React useEffect whose dependency array contained an object recreated on every state or prop change, so React treated it as always new and the call to /organizations fired many times per render, with retries on failure. Timeline: 16:32 the buggy dashboard version ships; 17:50 a new Tenant API Service version deploys; 17:57 Tenant Service is overwhelmed and dashboard availability starts dropping; 18:17 after adding resources the API reaches 98% availability but the dashboard does not recover; 18:58 an attempt to remove erroring codepaths ships and makes API impact worse; 19:01 a temporary rate-limiting rule is published; 19:12 the changes are reverted and dashboard availability returns to 100%. Tenant Service is a Go process on Kubernetes in a subset of datacenters; responders added pods and a global rate limit. Restarting it caused every dashboard to re-authenticate at once, a thundering herd amplified by the dashboard loop. Control plane and data plane are strictly separated, so network services were unaffected and most users noticed nothing unless making config changes. Argo Rollouts, which auto-rolls-back on detected errors, had not yet been adopted for Tenant Service and would have caught the second bad update. Responders could not distinguish retries from new requests in telemetry. Write the public postmortem for dashboard and API users.", "A": "Cloudflare Dashboard and API outage, 12 September 2025\n\nBetween 17:57 and 19:12 UTC on 12 September 2025, the Cloudflare Dashboard was unavailable and much of the public API returned 5xx errors. Tenant Service, which evaluates authorization for every API request, was overwhelmed by request volume from the Dashboard; a request whose authorization cannot be evaluated fails, so the errors propagated to every API surface behind it. The Dashboard was the loudest casualty because it is itself an API client. Our control plane and data plane are strictly separated, and no network service -- proxying, caching, WAF, DNS resolution -- was affected. If you were not making configuration changes during that window, you almost certainly saw nothing. We are sorry for the time this cost the customers who were.\n\nThe trigger was a Dashboard bug we shipped at 16:32. A React useEffect hook issued the call to our /organizations endpoint, and its dependency array held an object that was recreated on every state or prop change. React compares dependencies by reference, so it read a fresh object on each render and re-ran the effect. A single Dashboard session therefore issued that API call many times per render pass, and each failure added retry traffic on top.\n\nThe load alone did not take the service down. At 17:50 we deployed a new version of the Tenant Service API. Seven minutes later, at 17:57, Tenant Service was saturated and Dashboard availability began to drop.\n\nOur response made the incident worse before it made it better. We added pods to Tenant Service, which is a Go process running on Kubernetes across a subset of our datacenters, and by 18:17 the API had recovered to 98% availability. The Dashboard had not recovered at all. At 18:58 we shipped a change intended to remove the erroring codepaths, and API impact increased. At 19:01 we published a temporary global rate-limiting rule on the Tenant Service call path. At 19:12 we reverted the 18:58 change, and Dashboard availability returned to 100%.\n\nRestarting Tenant Service turned recovery into a second load event. Every Dashboard session re-authenticated at once when the service came back, and the retry loop described above multiplied that herd instead of letting it drain. Each restart bought a smaller window of health than the last.\n\nTwo gaps made the incident longer than it needed to be. First, Argo Rollouts, which watches error rates during a deploy and rolls back automatically, has been adopted across much of our platform but not yet for Tenant Service. It would have reverted the 18:58 change without a human in the loop, and probably the 17:50 one as well. Second, our Tenant Service telemetry counts requests, not first attempts. Responders on the call could see request volume climbing and could not tell how much of it was new work and how much was the same failing calls coming back, which is the measurement that would have pointed at the Dashboard within minutes.\n\nHere is what we are changing. We have fixed the dependency array in the Dashboard and are auditing our other useEffect-driven API calls for the same reference-identity mistake. We are onboarding Tenant Service to Argo Rollouts so that a bad version is withdrawn on its own error signal. We are adding retry labelling to Tenant Service telemetry so responders can separate retries from new requests on a dashboard rather than by inference. We are also giving Tenant Service standing capacity headroom and a permanent rate limit, so an abusive client degrades itself instead of every API caller.\n", "B": "Cloudflare Dashboard and API outage, 12 September 2025\n\nOn 12 September 2025, the Cloudflare Dashboard and much of our public API returned 5xx errors from 17:57 to 19:12 UTC, because a bug in the Dashboard's own code flooded the Tenant Service that authorizes every API request. The bug was ours, in a Dashboard version we shipped at 16:32 UTC. We are sorry for the disruption to customers who needed to change configuration during those 75 minutes.\n\nNo network traffic was affected. Our control plane and data plane are strictly separated, so the services that proxy, cache and protect customer traffic kept running on their own path and never consulted Tenant Service. If you did not attempt a configuration change or an API call during the window, you saw nothing.\n\nThe Dashboard bug was a React `useEffect` whose dependency array contained an object recreated on every state or prop change. React compares dependencies by reference, so it treated that object as new on every render and re-ran the effect, which called `/organizations`. One user session therefore issued many calls per render instead of one per page load, and each failed call was retried. The Dashboard was generating its own load, and the load grew as the calls started failing.\n\nTenant Service sits in the API request authorization path, and requests it cannot evaluate return 5xx. It is a Go process running on Kubernetes in a subset of our datacenters. At 17:50 UTC we deployed a new Tenant API Service version into a service already carrying the amplified Dashboard traffic; by 17:57 UTC Tenant Service was overwhelmed and Dashboard availability began dropping. Because the same service authorizes API calls made outside the Dashboard, customers using the API directly saw 5xx errors from a defect they had no part in.\n\nOur first mitigations restored the API and left the Dashboard broken. We added pods and applied a global rate limit, and by 18:17 UTC the API had returned to 98% availability while the Dashboard had not recovered. Restarting Tenant Service produced a thundering herd: every open Dashboard re-authenticated at once, and the render loop multiplied that burst instead of letting it drain. At 18:58 UTC we shipped a change to remove the erroring codepaths and it increased API impact. At 19:01 UTC we published a temporary rate-limiting rule. At 19:12 UTC we reverted the changes and Dashboard availability returned to 100%.\n\nTwo gaps turned a bad deploy into a 75-minute outage. First, Argo Rollouts, which automatically rolls back a deployment when it detects errors, had not yet been adopted for Tenant Service; it would have reverted the 17:50 UTC update without a human in the loop. Second, our telemetry could not distinguish a retry from a new request, so responders looking at request volume could not tell whether they were watching real demand or a feedback loop feeding on its own failures. That ambiguity is why we spent the hour after 17:57 UTC adding capacity to a service whose load was self-generated.\n\nWe are making the following changes. We are onboarding Tenant Service to Argo Rollouts so a deploy that raises the error rate rolls back automatically. We are instrumenting retries distinctly from first attempts across the API authorization path, so responders can read a feedback loop off a graph. We are adding API call-rate tests to the Dashboard build so a render-loop regression fails before it ships. We are giving Tenant Service the capacity headroom and admission controls to survive a client that misbehaves this way, since the next one will not look like a `useEffect` dependency array.\n"}, {"pair_id": "p014", "brief": "Raw material. Concurrency control in Aurora DSQL, a multi-region relational database. Optimistic concurrency control was chosen for throughput and for one isolation property: under it a client is never in a position to block another one. Claimed consequence at scale: client-to-client performance cross talk, a large driver of tail latency whenever an application sits on a pessimistic relational engine. Stock illustration: a process stops for garbage collection holding a write lock, and everything queued behind it stops too. Operational record from Amazon: lock contention, and the retries that follow a failed lock acquisition, turn up repeatedly as causes of outages and of metastable failure, with long recoveries. Two design objectives follow: keep applications out of metastable failure, and blunt the duller failures that come from badly behaved clients and client code. Measured result: figure 6 plots SELECT and UPDATE latency, and both stay fast even with the database running across regions. Second thread, consistency defaults. Two publications from the 2000s, the Amazon Dynamo paper (2007) and Werner Vogels' article Eventually Consistent (2009), held that cloud-scale systems had to give up strong consistency to reach their availability and latency targets. Four things have shifted since: how time is distributed, how data-centre networks are built, how power and cooling are provisioned, and what distributed protocols can do. Position taken: strong consistency now belongs as the default, and almost no application is better served by eventual consistency. Write a design doc justifying the concurrency-control and consistency defaults for a new transactional datastore.", "A": "Concurrency control and consistency defaults\n\nDecision\n\nWe default to optimistic concurrency control and to strong consistency. A transaction reads a snapshot, buffers its writes, and validates once at commit time; at no point does it hold a lock that another session must queue behind. Aurora DSQL made both choices for a multi-region relational database, and its published results are the main external evidence we lean on. This document gives the reasoning and the conditions under which we would revisit either default.\n\nWhy optimistic concurrency control\n\nUnder OCC a client is never in a position to block another client. We want that isolation property ahead of the throughput argument, which is real but secondary. On a pessimistic engine one slow session exports its slowness to everything queued behind its locks. The stock illustration is a process that stops for garbage collection while holding a write lock: the pause has nothing to do with the waiting transactions, and they pay for it anyway. At scale this client-to-client cross talk is a large driver of tail latency.\n\nAmazon's operational record carries more weight than the illustration. Lock contention, and the retries that follow a failed lock acquisition, turn up repeatedly as causes of outages and of metastable failure, the state in which retry load sustains an overload after its trigger is gone and recovery runs long. Two design objectives follow. Keep applications out of metastable failure, and blunt the duller failures that come from badly behaved clients and client code.\n\nOCC does not make conflict free. It relocates the cost from a waiting queue inside the engine to a retry in the application, which is a cost we can bound, observe per workload, and shed. A queue of blocked sessions is none of those things.\n\nWhy strong consistency is the default\n\nThe Dynamo paper (2007) and Werner Vogels' Eventually Consistent (2009) held that cloud-scale systems had to give up strong consistency to reach their availability and latency targets. That was an accurate reading of the hardware and protocols of the 2000s. Four things have shifted since: how time is distributed, how data-centre networks are built, how power and cooling are provisioned, and what distributed protocols can do. Figure 6 of the DSQL work plots SELECT and UPDATE latency under OCC, and both stay fast with the database running across regions.\n\nSo strong consistency becomes the default here. Eventual consistency remains available as an explicit per-workload opt-in, and we expect almost no application to be better served by it, because the reasoning required to stay correct under weak reads is paid by every engineer who later touches that code.\n\nWhat would change our mind\n\nRun the workload at target concurrency and measure the abort rate per transaction class. If a class aborts often enough that its retry budget exceeds the latency we save by not queueing, that class needs a different design, not a different engine default.\n", "B": "Concurrency Control and Consistency Defaults\n\nTwo defaults need justifying before anything else in this datastore is designed: how transactions are isolated from each other, and how strong the consistency guarantee is. Both are load-bearing, both are hard to reverse, and both go against what a lot of existing practice would suggest.\n\nOptimistic concurrency control\n\nWe are choosing optimistic concurrency control. The obvious argument is throughput, but the more important one is an isolation property: under OCC a client is never in a position to block another client. Nothing a client does \u2014 holding a transaction open, stalling mid-statement, disappearing entirely \u2014 can make another client wait.\n\nThat property is what removes client-to-client performance cross talk, which is a large driver of tail latency in applications sitting on pessimistic relational engines. The textbook version is a process that stops for garbage collection while holding a write lock: everything queued behind it stops too, and the tail is now shaped by someone else's heap. The operational version is worse. In Amazon's record, lock contention and the retries that follow a failed lock acquisition turn up repeatedly as causes of outages and of metastable failure, where the system stays degraded long after the triggering event has passed and recovery takes far longer than the incident that started it.\n\nTwo objectives follow directly. First, keep applications out of metastable failure \u2014 the failure mode that does not clear on its own. Second, blunt the duller failures caused by badly behaved clients and client code, which under lock-based isolation are free to impose their own bugs on everyone else's latency.\n\nThe cost of OCC is retries on conflict, paid by the conflicting transaction rather than by every transaction queued behind a lock. Figure 6 shows the result: SELECT and UPDATE latency both stay fast, including with the database running across regions.\n\nStrong consistency as the default\n\nThe counterargument comes from the 2000s. The Dynamo paper (2007) and Werner Vogels' Eventually Consistent (2009) held that cloud-scale systems had to give up strong consistency to hit their availability and latency targets. That was an accurate reading of the hardware and protocols of the time.\n\nFour things have changed since. Time is distributed differently. Data-centre networks are built differently. Power and cooling are provisioned differently. And distributed protocols can do things they could not then. Each of these independently moved the price of a strongly consistent commit, and together they moved it enough that the 2007 tradeoff no longer describes the choice in front of us.\n\nSo strong consistency is the default here. Eventual consistency pushes reconciliation into application code, where it is written once per application and tested approximately never. Almost no application is better served by that bargain.\n"}, {"pair_id": "p015", "brief": "Raw material for the section of the node-swap KEP that specifies how a container's swap limit is computed. Swap access is granted only to Burstable QoS pods, and the values are computed automatically rather than entered by the user. Two steps. First, take the container's memory request divided by the node's total physical memory; call that ContainerMemoryProportion. If a container has memory requests equal to memory limits, its proportion is defined as zero, so its swap limit works out to zero. Second, multiply that proportion by TotalPodsSwapAvailable, which is the total swap on the system minus the system-reserved memory \u2014 the residue that keeps swap available to system-critical daemons, since the kernel has no memory.swap.min to reserve with. Worked example: a Burstable pod with container A requesting 20 GB and container B requesting 10 GB, on a node with 40 GB of physical memory and 40 GB of swap, with system-reserved memory configured at 2 GB. Proportions come out at 0.5 and 0.25; TotalPodsSwapAvailable is 38 GB; A gets a 19 GB swap limit and B gets 9.5 GB. The scheme ties each container's share of swap to its memory request and rescales it against whatever swap the system actually has. Write this calculation section of the KEP for reviewers who will implement and test it.", "A": "## Calculating a container's swap limit\n\nThe kubelet computes every swap limit; no user sets one. Only containers in\nBurstable pods are eligible, and for those the limit falls out of two numbers\nthe kubelet already has: the container's memory request and the node's swap\ncapacity after system reservation. The scheme ties each container's share of\nswap to its memory request, then rescales that share against whatever swap the\nsystem actually has.\n\n### Step 1: ContainerMemoryProportion\n\nDivide the container's memory request by the total physical memory on the node.\n\n```\nContainerMemoryProportion = ContainerMemoryRequest / TotalNodePhysicalMemory\n```\n\nA container whose memory request equals its memory limit is a special case: its\nproportion is defined to be zero, not the computed ratio. Such a container is\nindividually Guaranteed even though the pod as a whole is Burstable, and the\nzero proportion carries through step 2 to give it a swap limit of zero. Note\nthat the proportions of the containers in a pod do not sum to one in general,\nbecause the denominator is node memory and not pod memory. That is intended:\neach container is sized against the node, so a pod that requests little memory\non a large node claims little swap.\n\n### Step 2: Scale against available swap\n\nMultiply the proportion by the swap the kubelet is willing to hand to pods.\n\n```\nTotalPodsSwapAvailable = TotalNodeSwap - SystemReservedMemory\nContainerSwapLimit     = ContainerMemoryProportion * TotalPodsSwapAvailable\n```\n\nThe subtraction of SystemReservedMemory is the residue that keeps swap\navailable to system-critical daemons. The kernel offers no `memory.swap.min`,\nso there is no way to reserve swap for a cgroup directly; withholding it from\nthe sum that pods divide is the only lever the kubelet has. The quantity\nsubtracted is the configured system-reserved *memory*, not a separately\nconfigured swap reservation, which means a node with generous memory\nreservation also holds back proportionally more swap.\n\n### Worked example\n\nTake a node with 40 GB of physical memory and 40 GB of swap, with\n`--system-reserved=memory=2Gi`. A Burstable pod runs container A requesting\n20 GB and container B requesting 10 GB, neither with a memory limit equal to\nits request.\n\n| | request | proportion | swap limit |\n|---|---|---|---|\n| A | 20 GB | 20 / 40 = 0.5 | 0.5 * 38 GB = 19 GB |\n| B | 10 GB | 10 / 40 = 0.25 | 0.25 * 38 GB = 9.5 GB |\n\nTotalPodsSwapAvailable is 40 - 2 = 38 GB. The two containers together may swap\n28.5 GB, leaving 11.5 GB of the node's swap uncommitted -- 2 GB of it reserved\nby construction, the remaining 9.5 GB simply unclaimed by any running pod.\n\n### What implementers and testers should check\n\nSet a container's memory limit equal to its request inside an otherwise\nBurstable pod and confirm the written `memory.swap.max` is 0. Vary\n`--system-reserved` on a fixed node and confirm each container's limit moves\nlinearly with it. Schedule pods whose requests sum past node memory and confirm\nthe limits still sum past TotalPodsSwapAvailable, since nothing in this\ncalculation caps the aggregate; the scheduler's memory-request accounting is\nwhat keeps the sum bounded in practice.\n", "B": "1. **Calculate the container's memory proportionate to the node's memory:** - Divide the container's memory request by the total node's physical memory. Let's call this value `ContainerMemoryProportion`. - If a container is defined with memory requests == memory limits, its `ContainerMemoryProportion` is defined as 0. Therefore, as can be seen below, its overall swap limit is also 0. 2. **Multiply the container memory proportion by the available swap memory for Pods:** - Meaning: `ContainerMemoryProportion * TotalPodsSwapAvailable`. #### Example Suppose we have a Burstable QoS pod with two containers: - Container A: Memory request 20 GB - Container B: Memory request 10 GB Let's assume the total physical memory is 40 GB and the total swap memory available is also 40 GB. Also assume that the system reserved memory is configured at 2GB, Step 1: Determine the containers memory proportion: - Container A: `20G/40G` = `0.5`. - Container B: `10G/40G` = `0.25`. Step 2: Determine swap limitation for the containers: - Container A: `ContainerMemoryProportion * TotalPodsSwapAvailable` = `0.5 * 38G` = `19G`. - Container B: `ContainerMemoryProportion * TotalPodsSwapAvailable` = `0.25 * 38G` = `9.5G`. In this example, Container A would have a swap limit of 19 GB, and Container B would have a swap limit of 9.5 GB. This approach allocates swap limits based on each container's memory request and adjusts the proportion based on the total swap memory available in the system. It ensures that each container gets a fair share of the swap space and helps maintain resource allocation efficiency."}, {"pair_id": "p016", "brief": "Raw material for the constraints-and-caveats section of the pod scheduling readiness KEP, about the new .spec.schedulingGates field. State transitions are deliberately restricted. The field can only be initialized when the pod is created, either by the client or by a mutating admission webhook. After creation, gates may be removed in any order, but adding a new gate is not allowed. A scheduled pod must always carry empty scheduling gates, which means a client \u2014 administrator or custom controller \u2014 cannot create a pod that has schedulingGates populated and also specifies spec.nodeName; the API server returns a validation error. Stated as a matrix: for an unscheduled pod with nil nodeName, create with non-nil gates is allowed and update is not, while nil gates allow both; for a scheduled pod with non-nil nodeName, neither create nor update with non-nil gates is allowed, and nil gates allow both. Feature-gating is not uniform across the three parts of the feature: (a) the pod spec field plus feature gate and associated bits, (b) the SchedulingGates scheduler plugin, and (c) the underlying scheduler framework change, the new PreEnqueue extension point. Disabling the feature turns off a and b but leaves c on, so a plugin developer can use c alone to build their own equivalents of a and b. Separately, kubectl gets a new phase literal, SchedulingPaused, in the phase column of kubectl get pod, to show whether a pod is scheduling-paused. Write this notes and constraints section of the KEP for API and scheduler reviewers.", "A": "- **Restricted state transition:** The `schedulingGates` field can be initialized only when a Pod is created (either by the client, or mutated during admission). After creation, each `schedulingGate` can be removed in arbitrary order, but addition of a new scheduling gate is disallowed. To ensure consistency, scheduled Pod must always have empty `schedulingGates`. This means that a client (an administrator or custom controller) cannot create a Pod that has `schedulingGates` populated in any way, if that Pod also specified a `spec.nodeName`. In this case, API Server will return a validation error. | | non-nil schedulingGates\u23f8\ufe0f | nil schedulingGates\u25b6\ufe0f | |----------------------------------------------|-------------------------|-------------------------| | unscheduled Pod<br>(nil <tt>nodeName</tt>) | \u2705 create<br>\u274c update | \u2705 create<br>\u2705 update | | scheduled Pod<br>(non-nil <tt>nodeName</tt>) | \u274c create<br>\u274c update | \u2705 create<br>\u2705 update | - **New field disabled in Alpha but not scheduler extension:** In a high level, this feature contains the following parts: - a. Pod's spec, feature gate, and other misc bits describing the field `schedulingGates` - b. the `SchedulingGates` scheduler plugin - c. the underlying scheduler framework, i.e., the new PreEnqueue extension point If the feature is disabled, part `a` and `b` are disabled, but `c` is enabled anyways. This implies a scheduler plugin developer can leverage part `c` _only_ to craft their own `a'` and `b'` to accomplish their own feature set. - **New phase literal in kubectl:** To provide better UX, we're going to add a new phase literal `SchedulingPaused` to the \"phase\" column of `kubectl get pod`. This new literal indicates whether it's scheduling-paused or not.", "B": "Notes and Constraints\n\nThis section records the restrictions the API server enforces on `.spec.schedulingGates`, the validation matrix reviewers should check against, the asymmetry in how the three parts of the feature respond to the feature gate, and the one kubectl surface the feature adds. It is written for API reviewers auditing the validation rules and for scheduler reviewers auditing the plugin and framework split.\n\nState transitions on the field are deliberately one-way. A client or a mutating admission webhook may initialize `schedulingGates` only at pod creation; no path adds a gate afterward. After creation, a controller may remove gates in any order, and removal is the only update the API server accepts. The one-way restriction is what lets the scheduler treat an empty gate list as terminal: once a pod leaves the gated state it cannot re-enter it, so the PreEnqueue check does not have to handle a pod moving backward out of the scheduling queue.\n\nA scheduled pod always carries empty scheduling gates, which rules out one create call that reviewers commonly expect to work. A client -- administrator or custom controller -- cannot create a pod that populates `schedulingGates` and sets `spec.nodeName` in the same object; the API server rejects it with a validation error. Assigning a node and asking the scheduler to hold the pod are contradictory requests, and the rejection happens at admission rather than being resolved later by the scheduler.\n\nThe full matrix has four cells, two of them closed:\n\n| nodeName | operation | non-nil gates | nil gates |\n|---|---|---|---|\n| nil (unscheduled) | create | allowed | allowed |\n| nil (unscheduled) | update | denied | allowed |\n| non-nil (scheduled) | create | denied | allowed |\n| non-nil (scheduled) | update | denied | allowed |\n\nRead the `non-nil gates` column as the whole constraint: exactly one of the four cells permits a non-nil gate list, and it is creation of a pod with no node assigned. The `nil gates` column is unconditionally permitted, so a pod that never uses the feature sees no new validation behavior.\n\nFeature-gating covers two of the three parts, not all three. The feature gate controls (a) the pod spec field and its associated API bits, and (b) the `SchedulingGates` scheduler plugin. It does not control (c) the underlying framework change, the new `PreEnqueue` extension point, which stays registered whether or not the gate is on. A plugin developer can therefore build an equivalent of (a) and (b) on top of (c) alone: implement `PreEnqueue` in an out-of-tree plugin and carry the gating state in an annotation or CRD. Disabling the feature removes the in-tree path and leaves that capability intact, and reviewers evaluating the disablement story should evaluate it on those terms.\n\nkubectl gains one new value in the phase column. `kubectl get pod` prints `SchedulingPaused` for a pod whose gates are non-empty. The literal is a display value computed by kubectl from the gate list; it is not a new value of `.status.phase`, and no controller should key off it.\n"}, {"pair_id": "p017", "brief": "Netflix, December 2018, kernel 4.4.0-1072-aws, 16-CPU instance. A service team reported that uploads of roughly 100-Gbyte files ran for hours, while uploads of files up to 40 Gbytes finished in minutes. The affected service encrypts large files and ships them to S3. The slow uploads lined up with a paging spike in Atlas, the cloud-wide monitoring tool - specifically pageins, which count pages faulted in off disk; plenty of healthy workloads generate them, so the signal is suggestive rather than damning.\n\nInvestigation started from the 60-second performance checklist. iostat -xz 1 during a large upload, device xvdb: r/s 734 to 750, rkB/s 91,656 to 92,152, avgrq-sz 246 to 250, avgqu-sz about 25, r_await 33 to 34 ms, %util pegged at 100. CPU over the same seconds: about 14.8% user and 24 to 30% iowait. Reads are the operations applications block on; writes often are not, because of write-back caching. A 33 ms read wait is high, and it tracks the queue depth rather than any slowness in the device. Dividing rkB/s by r/s puts the I/O size at about 128 Kbytes - large.\n\nNext tool: biolatency -m from bcc, an eBPF latency histogram, run in case per-second averages were concealing device-level outliers. Buckets: 8,139 I/O at 32-63 ms, 1,620 at 16-31 ms, 176 at 64-127 ms, 95 at 128-255 ms, 61 at 256-511 ms, 93 at 512-1023 ms, 83 at 0-1 ms. The bulk of the I/O falls between 16 and 127 ms with a tail stretching to 0.5-1.0 s, all of it consistent with the queueing already visible in iostat. Reading: workload, not device.\n\nThen bitesize from bcc, to check the size distribution for anything anomalous: process name java, 1,682 I/O in the 128-255 Kbyte bucket, only tens in every other bucket - consistent with iostat, nothing unusual.\n\nWrite the opening diagnosis section of a case-study post for systems and performance engineers.", "A": "Uploads of 100-Gbyte files ran for hours while 40-Gbyte files finished in minutes, and that nonlinearity is the finding worth chasing. A 2.5x increase in file size bought roughly a 20x increase in wall time. Linear resource exhaustion -- a saturated NIC, a CPU-bound cipher, a throttled device -- does not produce that shape. Something changes state between 40 and 100 Gbytes. The service encrypts large files and ships them to S3, running on a 16-CPU AWS instance under kernel 4.4.0-1072-aws, December 2018.\n\nAtlas, the cloud-wide monitoring tool, showed a paging spike over the slow window, specifically pageins, which count pages faulted in off disk. Plenty of healthy workloads generate pageins, and the instance was not swapping in any obvious way, so treat this as a direction to look rather than a diagnosis. It does agree with the size threshold: pageins rise when a working set stops fitting in memory.\n\nWe started from the 60-second checklist. Here is iostat -xz 1 during a large upload, device xvdb: r/s 734 to 750, rkB/s 91,656 to 92,152, avgrq-sz 246 to 250, avgqu-sz about 25, r_await 33 to 34 ms, %util pegged at 100. CPU over the same seconds ran about 14.8% user and 24 to 30% iowait. At 27% iowait across 16 CPUs, 4.3 CPUs' worth of capacity sat blocked in disk wait while user code burned 2.4.\n\nReads are the operations applications block on; writes often are not, because the page cache absorbs them and flushes later. A 33 ms read wait is high for an EBS volume. Check where it comes from before blaming the device: queue depth divided by completion rate gives 25 / 740 = 33.8 ms, which reproduces the measured 33 to 34 ms to within the rounding of the inputs. The latency is the queue. The device is servicing requests at the rate it always does, and 25 of them are stacked up waiting their turn.\n\nThat also disarms %util. At 100% the column means the device had at least one request outstanding during every sampling interval, which for a virtual, network-attached, internally parallel block device is a statement about continuous demand and not about a hardware limit being reached.\n\nDividing rkB/s by r/s puts the average read at 123 to 125 Kbytes. That is large, and large reads at a steady 92 Mbytes/s are the signature of sequential streaming, not of scattered metadata access. Note the arithmetic on the complaint: one pass over 100 Gbytes at 92 Mbytes/s costs 1,113 seconds, about 19 minutes. Hours means the file is being read several times over, or the stream stalls for long stretches, or both.\n\nPer-second averages can hide device-level outliers, so we ran biolatency -m from bcc, an eBPF histogram of block I/O completion times. Of 10,267 sampled I/O, 8,139 landed in the 32-63 ms bucket and 1,620 in 16-31 ms; 96.8% of all I/O fell between 16 and 127 ms. The tail reached 512-1023 ms, but only 154 I/O, 1.5% of the sample, exceeded 256 ms. No bimodality, no cliff, no cluster of multi-second completions. The distribution is centered exactly where Little's law said queueing would put it.\n\nbitesize from bcc, which buckets I/O size by process, attributed 1,682 I/O to java in the 128-255 Kbyte bucket with only tens in every other bucket. One process, one size class, matching the iostat average.\n\nFour tools agree, and none of them accuses the storage device. The workload is issuing large sequential reads faster than the volume will retire them, and the queue it builds accounts for the full observed latency. The open question is why a file this size generates disk reads at all, given that 40-Gbyte files apparently do not. Run the upload against files stepped from 40 to 100 Gbytes and watch where pageins begin; the size at which they appear should name the memory boundary being crossed.\n", "B": "The Hundred-Gigabyte Cliff\n\nIn December 2018 a service team came to us with a complaint that had a suspicious shape. Their service encrypts large files and ships them to S3. Files up to about 40 Gbytes uploaded in minutes. Files around 100 Gbytes took hours. The environment was a 16-CPU AWS instance running kernel 4.4.0-1072-aws.\n\nThe shape is the first piece of evidence, before any tool is run. A 2.5x increase in file size producing a 10x or worse increase in wall-clock time is not a throughput problem. Throughput problems scale linearly: twice the bytes, twice the time. Something in this system behaves differently once the working set crosses a threshold somewhere between 40 and 100 Gbytes, and the job of the investigation is to find what changes state at that boundary.\n\nAtlas, our cloud-wide monitoring tool, showed a spike in pageins that lined up with the slow uploads. Pageins count pages faulted in from disk. This is worth writing down but not worth leaning on: plenty of perfectly healthy workloads generate pageins by the million, and a correlated counter in a cloud-wide dashboard is suggestive, not damning. It tells us where to point the next tool, nothing more.\n\nWe started where we always start, with the 60-second performance checklist, and the disk statistics were the first thing that did not look ordinary. Here is iostat -xz 1 for device xvdb during a large upload, with the range across the sampled seconds:\n\n  r/s        734 - 750\n  rkB/s      91,656 - 92,152\n  avgrq-sz   246 - 250\n  avgqu-sz   ~25\n  r_await    33 - 34 ms\n  %util      100\n\nCPU over the same seconds ran about 14.8% user with 24 to 30% iowait.\n\nThree things fall out of that table. First, this is a read workload, and reads are what matters: applications block on reads, whereas writes frequently return as soon as they land in the page cache and are flushed later. If the disk were busy with writes we would have to work harder to connect the device to the stall. It is busy with reads.\n\nSecond, 33 ms is a long time to wait for a read, but the shape of the numbers says the device is not the thing that is slow. Average queue depth is around 25. Roughly twenty-five requests are outstanding at any moment, so the wait each one experiences is dominated by the time spent behind the other twenty-four, not by the time the device spends servicing it. %util pegged at 100 says the same thing from the other direction: the device is never idle, which means it is the bottleneck for this workload, but \"saturated\" and \"defective\" are different diagnoses with different fixes.\n\nThird, dividing rkB/s by r/s gives about 128 Kbytes per I/O, confirmed independently by avgrq-sz of roughly 248 sectors. These are large reads, not the scattered small ones you would expect from, say, random metadata lookups.\n\nPer-second averages can hide outliers, so before accepting that reading we checked the distribution directly with biolatency -m from bcc, an eBPF histogram of block I/O latency. The result:\n\n  0 - 1 ms         83\n  16 - 31 ms     1,620\n  32 - 63 ms     8,139\n  64 - 127 ms      176\n  128 - 255 ms      95\n  256 - 511 ms      61\n  512 - 1023 ms     93\n\nThe bulk of the I/O sits between 16 and 127 ms, with a thin tail out to a second. That is exactly the profile queueing produces, and there is no separate population of pathologically slow operations hiding under the average. The device is behaving.\n\nWe then ran bitesize from bcc to check the size distribution for anything anomalous. Process java, 1,682 I/O in the 128-255 Kbyte bucket, only tens in every other bucket. Consistent with iostat, and unremarkable.\n\nSo the disk is doing honest work at its limit, in large sequential-sized reads, on behalf of a Java process. The question the rest of this investigation has to answer is why a workload whose job is to encrypt a file and push it to the network is reading 90 Mbytes per second off local disk at all - and why it only starts doing so above 40 Gbytes.\n"}, {"pair_id": "p018", "brief": "Raw material. The feedback loop hypothesis: in the long term, coding agents will find tasks with effective feedback easy and tasks without effective feedback hard, and the availability of accurate feedback sets the limit on their capability. Current evidence. Good error messages keep agents unstuck. Rust steers agents toward correct code by signalling some kinds of incorrectness explicitly and immediately. Agents do well on performance work where good benchmarks exist. Property-based testing is unusually valuable. Agents do poorly on architecture, where feedback is of the know-it-when-I-see-it kind, and on concurrent programs, where feedback arrives as silent data corruption at runtime. Two comparison problems: building a delightful, ergonomic photo-editing website, and building a correct high-performance database storage engine at the scale of RocksDB or InnoDB, not Aurora DSQL or PostgreSQL. For open-loop models the website is easier and gets closer to success in a single shot. The hypothesis inverts this over the long run: the website's loop needs a human, and humans are slow, squishy, inconsistent feedback providers, while the storage engine has a simple specification covering API, safety properties, and liveness properties, so iteration needs no human. Implied tooling: Rust, Hydro, Verus at compile time; TLA+ and P at modelling time; Kiro's spec analyzer; testing tools, simulators, mocks. Write a design doc for engineering leadership on where to invest in agent tooling.", "A": "Agent tooling investment: fund the feedback loop\n\nThe claim\n\nCoding agents will find tasks with fast, accurate, machine-checkable feedback easy, and tasks without it hard. If that holds, the availability of feedback -- not model capability -- sets the ceiling on what agents can do for us, and our tooling budget should buy feedback channels instead of agent harnesses and prompt libraries. This document argues the case and names the three tiers I would fund.\n\nWhat the current evidence shows\n\nFour observations point the same way. Agents recover from a failure when the error message says what broke and where; they thrash when it says that something went wrong. The Rust compiler rejects a large class of incorrect programs explicitly and immediately, which steers an agent toward correct code before any test runs. Agents do well on performance work wherever a benchmark already exists, because the benchmark answers \"did that change help\" in seconds. Property-based testing pays back more than the cost of writing the property, since one property generates thousands of adversarial inputs and returns a shrunk counterexample the agent can read.\n\nThe failures share a shape. Architecture quality is know-it-when-I-see-it feedback, it lives in a senior engineer's head, and it arrives days after the work. Concurrency bugs surface as silent data corruption at runtime, on some schedules, sometimes in production. Neither loop closes at machine speed, and both are where agents are weakest today.\n\nThe comparison that decides the investment\n\nCompare two projects. Build a delightful, ergonomic photo-editing website. Build a correct, high-performance storage engine in the class of RocksDB or InnoDB -- not Aurora DSQL or PostgreSQL, which are far larger systems. Ask which one an agent finishes.\n\nAn open-loop model, judged on a single shot, gets much closer on the website. The hypothesis inverts that ranking over any horizon longer than one shot. The website's loop needs a human to look at the result and say whether it feels right, and humans are slow, squishy, and inconsistent graders. The storage engine has a written specification covering the API, the safety properties, and the liveness properties, all three of which a machine can check, so the agent iterates without us in the loop at all.\n\nWhere to spend\n\nFund three tiers, ordered by how tight a loop each one closes.\n\nCompile time is the cheapest feedback we can buy, because it costs one build. Invest in Rust adoption on new services, and evaluate Verus for the components where we already write proofs by hand and Hydro for distributed dataflow.\n\nModelling time catches what the compiler cannot. Fund TLA+ and P for the concurrent and distributed designs, and fund a spec analyzer in the shape of Kiro's, which turns a written specification into checkable obligations rather than a document nobody rereads.\n\nRun time is where we have the most existing surface and the least discipline. Deterministic simulators, fault injection, mocks that fail the way the real dependency fails, and property-based suites on the data structures all convert a silent runtime corruption into a reproducible failing case.\n\nHow we would know this is wrong\n\nTrack one number per quarter: the fraction of agent-authored changes merged without a human correction, split by whether the task had a machine-checkable acceptance test. If that fraction converges across the two groups as models improve, feedback is not the binding constraint and we should move the money to harnesses. I expect the gap to widen for at least the next four quarters.\n", "B": "Where to invest in coding-agent tooling\n\nA coding agent stops when something tells it that it is done, and the quality of that something, not the difficulty of the task, sets the ceiling on what agents can build for us. Our tooling budget should buy checkers.\n\nThe mechanism is the loop. An agent proposes a change and reads a signal: a compiler error, a failing property, a benchmark number, a model checker's counterexample. A good signal names the defect and locates it, so the next proposal is conditioned on something specific instead of on the agent's own belief about its work. Where no such signal exists, the agent cannot tell whether the last edit helped, and the loop degenerates into sampling.\n\nWhat we already observe follows from that. Agents stay unstuck on code with good error messages. Rust steers them toward correct programs because it signals whole classes of incorrectness explicitly and at compile time, before any test runs. Agents do well on performance work wherever a benchmark exists, because the benchmark returns a number after every attempt. Property-based testing is worth more to an agent than to a human author, because the agent can afford to run it on every candidate. Agents do badly on architecture, where the feedback is of the know-it-when-I-see-it kind, and on concurrent code, where a wrong program passes every run on the machine and shows up later as silent data corruption.\n\nTwo problems make the argument concrete. First: build a delightful, ergonomic photo-editing website. Second: build a correct, high-performance storage engine at the scale of RocksDB or InnoDB -- the storage layer itself, not a distributed database like Aurora DSQL or PostgreSQL. Ask which one an agent will finish.\n\nFor a model asked to produce one shot with no loop, the website is easier and lands closer to success. Over the long run that ranking inverts. The website's loop has a human in it: only a person can say whether the crop tool feels right, people answer in hours, and two people, or the same person on two days, score the same mockup differently. The storage engine has a specification with three parts -- the API, the safety properties, and the liveness properties -- and all three are machine-checkable, so the engine's loop runs at machine speed with nobody in it.\n\nThis tells us what to fund. Buy compile-time checking: Rust, Hydro for distributed dataflow, Verus for proofs the compiler enforces. Buy modelling tools that produce counterexample traces, TLA+ and P, and treat a trace as the highest-value feedback we can hand an agent for concurrency. Buy Kiro's spec analyzer and anything else that turns a vague requirement into a checkable one. Buy the unglamorous layer -- deterministic simulators, fault injectors, mocks, and benchmark harnesses -- and staff it, because that layer is where the agent's ceiling actually sits.\n\nIt also tells us what not to buy. Spending on raw agent capability for architecture and UX work will not move those tasks much, because the missing ingredient there is a checker and not a smarter proposer. The cheaper path is to convert a know-it-when-I-see-it judgment into something a program can evaluate, even partially.\n\nThe hypothesis is falsifiable and we should try to falsify it. If agents start closing hard architecture tasks without anyone building new checkers for them, this investment thesis is wrong and we should redirect.\n"}, {"pair_id": "p019", "brief": "li-httpclient v3 reaches end of life on Jan 31 2027. Owner Tomasz Hejna. 1,000 multiproducts consume it; 388 are on v4, which is 38.8%, and 612 remain on v3. The driver is CVE-2026-31819, CVSS 7.5, an HTTP request-smuggling flaw in Netty 4.1.79, which v3 pins and cannot move off without an ABI break. v4 renames every connection-pool configuration key and drops support for HTTP/1.0 upstreams; 17 upstreams are known to still speak HTTP/1.0 and each needs an owner-side fix or a proxy shim. An automated codemod covers 84% of call sites, 7,910 of 9,417, leaving 1,507 that need hand edits, concentrated in 63 multiproducts. Build enforcement: v3 builds start failing on Dec 1 2026. An exemption process grants 30 days at a time; 22 exemptions have been granted so far, 9 of them to the same three teams. Median migration time for teams that have finished
