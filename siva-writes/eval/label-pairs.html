const D=[{"pair_id": "p001", "brief": "Write the case-study post for an engineering blog read by systems and performance engineers. A short Netflix debugging story, from the material below.\n\nA colleague, Vadim, was reading a CPU flame graph from a TensorFlow workload and picked out an orange kernel tower that did not belong: page-fault work, 10% of all CPU time on the box. Why that number is worth chasing: multiply a tenth of the CPU by a fleet of thousands of instances and the waste is expensive; the team will open a flame graph over a single percentage point, let alone ten.\n\nThe faulting stacks led to __memcpy_avx_unaligned() - memcpy touching data segment mappings that were not resident. Early in a process's life that is ordinary, because segments and the heap have no mappings yet. This one had been running for hours, by which point growth of RSS from faults should have flattened off.\n\nOne standard reason for heavy faulting is a process cycling memory through mmap() and munmap(). eBPF tracing with mmapsnoop.py recorded no such calls. A flame-graph search on madvise put it at 0.8% of CPU, with the madvise() path reaching zap_page_range(), and that was where the faults came from. Reading the kernel's mm/advise.c settled which flag mattered: MADV_DONTNEED is what sends madvise() into zap_page_range(). Tracing sys_madvise() flags with kprobes or tracepoints would have answered the same question.\n\nDiagnosis: an optimization that backfired. The allocator was declaring pages unneeded that the workload still used; each dontneed threw away the virtual-to-physical mapping, and a page fault then had to put it back.\n\nThe allocator turned out to be jemalloc, pulled in by a configure option. Vadim did a rebuild against glibc, which cleared the problem. Measured result: the first round of testing came back at 3%, against the 10% the team had in mind, and the fixed flame graph shows it.", "A": "Ten Percent of the CPU, Spent Undoing an Optimization\n\nVadim was reading a CPU flame graph from a TensorFlow workload when he noticed an orange tower that had no business being there: page-fault handling, ten percent of all CPU time on the box.\n\nTen percent is worth a morning. We will open a flame graph over a single percentage point, because a point across a fleet of thousands of instances is real money; a tenth of every CPU is a line item.\n\nThe faulting stacks led to __memcpy_avx_unaligned(). A memcpy was touching data segment mappings that were not resident, and each touch trapped into the kernel to fault a page in. That is perfectly ordinary behavior early in a process's life, when the segments and the heap have no mappings yet and the process is warming up. This process had been running for hours. By then the growth of RSS from faults should have flattened, and the fault tower should have shrunk to noise. It had not.\n\nThe usual suspect for sustained faulting is a process cycling memory through mmap() and munmap(), handing address space back to the kernel and then asking for it again. eBPF tracing with mmapsnoop.py said no: the process was not making those calls.\n\nSearching the same flame graph for madvise turned up the answer. madvise() accounted for 0.8% of CPU, and its stacks descended into zap_page_range() -- the kernel routine that tears down page table entries. Faults were being manufactured by the process itself. Reading mm/advise.c settled which flag was responsible: MADV_DONTNEED is the one that routes madvise() into zap_page_range(). Tracing the flags argument to sys_madvise() with a kprobe or the syscall tracepoint would have answered the same question without the source dive; the source was faster to reach.\n\nThat gave us the diagnosis. An optimization was eating itself. The allocator was declaring pages unneeded that the workload was still using. Each MADV_DONTNEED discarded the virtual-to-physical mapping, and the next access -- that memcpy -- took a fault so the kernel could put the mapping back. The allocator paid 0.8% to hand the kernel a job that cost the fault path ten times as much. All of that work, on both sides, produced nothing: the same pages went out and came back.\n\nThe allocator was jemalloc, pulled in by a configure option that nobody had revisited. jemalloc is a good allocator, and on many workloads its decay-based purging is exactly right; on this one, with this access pattern, it was wrong. Vadim rebuilt the workload against glibc's allocator and the behavior cleared.\n\nThe first round of testing measured a 3% improvement, not the 10% we had in mind. The gap is worth naming rather than hiding: the CPU freed from the fault path is not all recovered as throughput, and the fixed flame graph shows the fault tower gone. Three percent across the fleet still pays for the afternoon.\n\nThe general lesson is smaller than the number. A tower in a flame graph that should have decayed and did not is a question, not a cost of doing business -- and the thing generating the work is sometimes the thing installed to avoid it.\n", "B": "Ten percent of CPU in page-fault stacks\n\nA colleague of mine, Vadim, was reading a CPU flame graph from a TensorFlow workload and picked out\nan orange kernel tower that had no business being there: page-fault handling, 10% of all CPU time on\nthe box. Ten percent of one instance is not, by itself, an emergency, but the workload runs across\nthousands of instances, and a tenth of the CPU across a fleet that size is an expensive thing to be\nspending on bookkeeping. We will open a flame graph over a single percentage point, so ten was going\nto get looked at.\n\nThe faulting stacks bottomed out in __memcpy_avx_unaligned(), which means memcpy was touching data\nsegment mappings that were not resident. Early in a process's life that is exactly what you expect,\nbecause the segments and the heap have no mappings behind them yet and every first touch costs a\nfault. This process had been up for hours. By then the fault-driven growth of RSS should have\nflattened out, and a process that is still paying fault costs hours in is either mapping new memory\nor losing the mappings it already had.\n\nThe standard explanation for the first case is a process cycling memory through mmap() and munmap(),\nwhich was easy enough to check. eBPF tracing with mmapsnoop.py recorded no such calls at all, which\nruled that out and left the second case.\n\nA flame-graph search on madvise put the madvise() path at 0.8% of CPU, small enough to miss by eye\nbut visible once searched for, and the path ran through zap_page_range(). That is where the faults\nwere being manufactured. Reading mm/madvise.c settled which flag was responsible: MADV_DONTNEED is\nthe one that sends madvise() into zap_page_range() to tear mappings down. Tracing the flags argument\nto sys_madvise() with a kprobe or a tracepoint would have answered the same question, and would have\nbeen the better move on a kernel whose source you do not have open in another window.\n\nThe diagnosis is an optimization that ran backwards. The allocator was telling the kernel it no\nlonger needed pages that the workload was in fact still using; each MADV_DONTNEED threw away the\nvirtual-to-physical mapping for those pages, and the next touch took a fault to put the mapping\nback. The 0.8% spent in madvise() was buying the 10% spent in the fault handler, which is a poor\ntrade even before you count the TLB and the zeroing.\n\nThe allocator turned out to be jemalloc, pulled in by a configure option that nobody had thought\nhard about for this workload. Vadim rebuilt against glibc's allocator and the problem cleared. The\nfirst round of testing came back at 3%, against the 10% we started with, and the fixed flame graph\nshows the tower gone. That is one round of measurement on one configuration, not a fleet rollout,\nand the remaining 3% has not been chased.\n\nThe transferable part is not jemalloc, which is a good allocator that was making a reasonable\nguess about a workload it guessed wrong about. It is that a 0.8% entry on a flame graph can be the\ncause of a 10% one, and that the search box is how you find it.\n"}, {"pair_id": "p002", "brief": "Raw material, Cloudflare, 21 August 2025, all times UTC. A single customer began requesting large volumes of cached objects from AWS us-east-1 at about 16:27, and the response traffic doubled total Cloudflare-to-AWS traffic, saturating every direct peering link between the two networks. At 16:37 AWS started withdrawing BGP advertisements on congested private network interconnects to shed load; that steered traffic onto peering links reached through an offsite interconnection switch, which then also saturated. Two pre-existing conditions made it worse: one direct peering link was running at half capacity due to an earlier failure, and the Data Center Interconnect to the offsite switch was already due for a capacity upgrade. 16:44 the network team is alerted to congestion in Ashburn (IAD); 16:45 responders find that uncongested paths no longer carry AWS prefixes because of the withdrawals; 17:22 dropped traffic increases; 17:45 a customer-impact incident is raised; 19:05 rate-limiting the customer reduces congestion; 19:27 traffic engineering fully resolves congestion; 19:45 AWS begins reverting withdrawals; 20:07 AWS finishes normalizing announcements over IAD PNIs; 20:18 impact ends. Router queues grew and edge routers dropped high-priority packets throughout. Customers saw latency, timeouts and low throughput; the share of synthetic origin requests missing the latency SLO tracked the packet drops. Latency recovered after drops because both sides were renormalizing prefix advertisements. Regional only; global Cloudflare services were unaffected. Not an attack, not a BGP hijack. Write the public postmortem for customers with origins in AWS us-east-1.", "A": "Incident report: congestion between Cloudflare and AWS us-east-1, 21 August 2025\n\nCustomers with origins in AWS us-east-1 saw elevated latency, timeouts and reduced throughput from 16:27 to 20:18 UTC on 21 August 2025, because one customer's cache-fill traffic doubled total Cloudflare-to-AWS traffic and the load-shedding that followed concentrated that traffic onto the paths that were left. All times below are UTC. Impact was limited to this interconnection; Cloudflare's global services carried normal traffic throughout. This was not an attack and no BGP hijack occurred.\n\nAt about 16:27 a single customer began requesting large volumes of cached objects stored in AWS us-east-1. Those responses travel from AWS into our network, and the added volume doubled total Cloudflare-to-AWS traffic, saturating every direct peering link between the two networks. Two pre-existing conditions removed the headroom that would normally have absorbed part of this. One direct peering link was running at half its capacity after an earlier failure, and the Data Center Interconnect carrying traffic to our offsite interconnection switch was already scheduled for a capacity upgrade.\n\nAt 16:37 AWS began withdrawing BGP advertisements on the congested private network interconnects to shed load. A withdrawal does not reduce the number of bytes customers are asking for; it deletes a path, and every packet still destined for those prefixes must take a path that remains advertised. The shed traffic moved onto peering links reached through the offsite interconnection switch, crossing the Data Center Interconnect that was already short of capacity, and that path saturated in turn. Router queues grew and edge routers dropped packets, including the high-priority packets our queueing policy exists to protect.\n\nOur network team was alerted to congestion in Ashburn (IAD) at 16:44, 17 minutes after the first links saturated. Responders confirmed at 16:45 that the uncongested paths they would have shifted traffic onto no longer carried AWS prefixes, which removed traffic engineering as an immediate option. Dropped traffic increased at 17:22, and we raised a customer-impact incident at 17:45.\n\nRate-limiting the customer at 19:05 was the action that reduced congestion, and traffic engineering fully resolved it at 19:27. AWS began reverting the withdrawn advertisements at 19:45 and finished normalizing announcements over the IAD private network interconnects at 20:07. Impact ended at 20:18, 3 hours and 51 minutes after the first saturation.\n\nThe share of synthetic origin requests missing our latency SLO tracked packet drops through the event, which is how we sized customer impact without depending on any single customer's telemetry. Latency stayed elevated for a period after drops stopped, because both networks were still renormalizing prefix advertisements and traffic had not yet settled back onto the direct paths.\n\nThe mechanism that turned a saturated link into a 3 hour 51 minute incident is that our fastest mitigation depended on alternate paths that load-shedding had withdrawn. We are making the following changes.\n\nWe are adding per-customer origin fetch rate limits at the edge, triggered by measured link utilization on the path toward the origin network, so a single customer's cache-fill cannot consume an entire interconnection's headroom before a human is alerted.\n\nWe are completing the Data Center Interconnect capacity upgrade to the offsite interconnection switch and restoring the failed direct peering link to full capacity. Both were known gaps on 21 August, and together they determined how quickly the second path saturated.\n\nInterconnect alerting will fire on utilization crossing a threshold instead of on the packet drops it eventually causes. Drops at 16:44 were a late signal; utilization crossed its saturation point at about 16:27.\n\nFinally, we have opened work with AWS on load-shedding behaviour that preserves reachability on at least one uncongested path, so that shedding traffic and removing our ability to reroute it stop being the same operation.\n\nCloudflare apologizes for the disruption to your origin traffic. If you observed impact outside the window above, please open a support ticket and include the affected hostnames.\n", "B": "When impact started, we saw a significant amount of traffic related to one customer, resulting in congestion: This was handled by manual traffic actions both from Cloudflare and AWS. You can see some of the attempts by AWS to alleviate the congestion by looking at the number of IP prefixes AWS is advertising to Cloudflare during the duration of the outage. The lines in different colors correspond to the number of prefixes advertised per BGP session with us. The dips indicate AWS attempting to mitigate by withdrawing prefixes from the BGP sessions in an attempt to steer traffic elsewhere: The congestion in the network caused network queues on the routers to grow significantly and begin dropping packets. Our edge routers were dropping high priority packets consistently during the outage, as seen in the chart below, which shows the queue drops for our Ashburn routers during the impact period: The primary impact to customers as a result of this congestion would have been latency, loss (timeouts), or low throughput. We have a set of latency Service Level Objectives defined which imitate customer requests back to their origins measuring availability and latency. We can see that during the impact period, the percentage of requests whose latency fails to meet the target SLO threshold dips below an acceptable level in lock step with the packet drops during the outage: After the congestion was alleviated, there was a brief period where both AWS and Cloudflare were attempting to normalize the prefix advertisements that had been adjusted to attempt to mitigate the congestion. That caused a long tail of latency that may have impacted some customers, which is why you see the packet drops resolve before the customer latencies are restored. Remediations and follow-up steps This event has underscored the need for enhanced safeguards to ensure that one customer's usage patterns cannot negatively affect the broader ecosystem. Our key takeaways are the necessity of architecting for better customer isolation to prevent any single entity from monopolizing shared resources and impacting the stability of the platform for others, and augmenting our network infrastructure to have sufficient capacity to meet demand. To prevent a recurrence of this issue, we are implementing a multi-phased mitigation strategy. In the short and medium term: We are developing a mechanism to selectively deprioritize a customer\u2019s traffic if it begins to congest the network to a degree that impacts others. We are expediting the Data Center Interconnect (DCI) upgrades which will provide network capacity significantly above what it is today. We are working with AWS to make sure their and our BGP traffic engineering actions do not conflict with one another in the future. Looking further ahead, our long-term solution involves building a new, enhanced traffic management system. This system will allot network resources on a per-customer basis, creating a budget that, once exceeded, will prevent a customer's traffic from degrading the service for anyone else on the platform. This system will also allow us to automate many of the manual actions that were taken to attempt to remediate the congestion seen during this incident."}, {"pair_id": "p003", "brief": "Raw material. Concurrency control in Aurora DSQL, a multi-region relational database. Optimistic concurrency control was chosen for throughput and for one isolation property: under it a client is never in a position to block another one. Claimed consequence at scale: client-to-client performance cross talk, a large driver of tail latency whenever an application sits on a pessimistic relational engine. Stock illustration: a process stops for garbage collection holding a write lock, and everything queued behind it stops too. Operational record from Amazon: lock contention, and the retries that follow a failed lock acquisition, turn up repeatedly as causes of outages and of metastable failure, with long recoveries. Two design objectives follow: keep applications out of metastable failure, and blunt the duller failures that come from badly behaved clients and client code. Measured result: figure 6 plots SELECT and UPDATE latency, and both stay fast even with the database running across regions. Second thread, consistency defaults. Two publications from the 2000s, the Amazon Dynamo paper (2007) and Werner Vogels' article Eventually Consistent (2009), held that cloud-scale systems had to give up strong consistency to reach their availability and latency targets. Four things have shifted since: how time is distributed, how data-centre networks are built, how power and cooling are provisioned, and what distributed protocols can do. Position taken: strong consistency now belongs as the default, and almost no application is better served by eventual consistency. Write a design doc justifying the concurrency-control and consistency defaults for a new transactional datastore.", "A": "Concurrency Control and Consistency Defaults\n\nTwo defaults need justifying before anything else in this datastore is designed: how transactions are isolated from each other, and how strong the consistency guarantee is. Both are load-bearing, both are hard to reverse, and both go against what a lot of existing practice would suggest.\n\nOptimistic concurrency control\n\nWe are choosing optimistic concurrency control. The obvious argument is throughput, but the more important one is an isolation property: under OCC a client is never in a position to block another client. Nothing a client does \u2014 holding a transaction open, stalling mid-statement, disappearing entirely \u2014 can make another client wait.\n\nThat property is what removes client-to-client performance cross talk, which is a large driver of tail latency in applications sitting on pessimistic relational engines. The textbook version is a process that stops for garbage collection while holding a write lock: everything queued behind it stops too, and the tail is now shaped by someone else's heap. The operational version is worse. In Amazon's record, lock contention and the retries that follow a failed lock acquisition turn up repeatedly as causes of outages and of metastable failure, where the system stays degraded long after the triggering event has passed and recovery takes far longer than the incident that started it.\n\nTwo objectives follow directly. First, keep applications out of metastable failure \u2014 the failure mode that does not clear on its own. Second, blunt the duller failures caused by badly behaved clients and client code, which under lock-based isolation are free to impose their own bugs on everyone else's latency.\n\nThe cost of OCC is retries on conflict, paid by the conflicting transaction rather than by every transaction queued behind a lock. Figure 6 shows the result: SELECT and UPDATE latency both stay fast, including with the database running across regions.\n\nStrong consistency as the default\n\nThe counterargument comes from the 2000s. The Dynamo paper (2007) and Werner Vogels' Eventually Consistent (2009) held that cloud-scale systems had to give up strong consistency to hit their availability and latency targets. That was an accurate reading of the hardware and protocols of the time.\n\nFour things have changed since. Time is distributed differently. Data-centre networks are built differently. Power and cooling are provisioned differently. And distributed protocols can do things they could not then. Each of these independently moved the price of a strongly consistent commit, and together they moved it enough that the 2007 tradeoff no longer describes the choice in front of us.\n\nSo strong consistency is the default here. Eventual consistency pushes reconciliation into application code, where it is written once per application and tested approximately never. Almost no application is better served by that bargain.\n", "B": "Concurrency control and consistency defaults for a new transactional datastore\n\nTwo defaults\n\nWe propose two defaults for the datastore: optimistic concurrency control, and strong consistency. Both are decisions about what an application gets when nobody on the team has thought about the question yet, which is most of the time, so they should be the choices that fail least badly under load.\n\nOptimistic concurrency control\n\nWe choose optimistic concurrency control for throughput and for one isolation property: under it, a client is never in a position to block another one. A pessimistic engine hands a client a lock and then waits on that client's own health. The stock illustration is a process that stops for garbage collection while holding a write lock. Everything queued behind the lock stops too, and the stall propagates to clients that share nothing with the stalled one except a row. At scale this becomes client-to-client performance cross talk, and cross talk is a large driver of tail latency in applications sitting on pessimistic relational engines.\n\nThe operational record is what makes this more than a preference. Lock contention, and the retries that follow a failed lock acquisition, turn up repeatedly in Amazon's outage history, and they turn up specifically as causes of metastable failure -- the state where load that originally triggered the problem has receded and the system stays down anyway, sustained by its own retries. Recoveries from that state are long. Retries against a contended lock are a feedback loop: each failed acquisition adds load, which lengthens the critical section, which fails more acquisitions.\n\nTwo design objectives follow. Keep applications out of metastable failure, which is the sharp failure. Blunt the duller failures that come from badly behaved clients and client code, which is the common one. Optimistic concurrency control serves both by removing the shared resource whose queue does the amplifying.\n\nAurora DSQL is the existence proof that the throughput cost is acceptable. Figure 6 of the DSQL paper plots SELECT and UPDATE latency against load, and both stay fast with the database running across regions.\n\nStrong consistency as the default\n\nWe propose strong consistency as the default, and we expect almost no application on this datastore to be better served by eventual consistency. That position contradicts the received reading of the Dynamo paper (2007) and Werner Vogels' Eventually Consistent (2009), which held that cloud-scale systems had to give up strong consistency to reach their availability and latency targets.\n\nFour things have shifted since. Time is distributed differently, data-centre networks are built differently, power and cooling are provisioned differently, and distributed protocols do more than they did. The 2000s conclusion was correct given the 2000s cost of coordination. We are asking readers to re-derive it against current costs, not to discard it.\n\nEventual consistency remains available. It stops being what you get by not choosing.\n"}, {"pair_id": "p004", "brief": "Raw material, Cloudflare, 21 August 2025, all times UTC. A single customer began requesting large volumes of cached objects from AWS us-east-1 at about 16:27, and the response traffic doubled total Cloudflare-to-AWS traffic, saturating every direct peering link between the two networks. At 16:37 AWS started withdrawing BGP advertisements on congested private network interconnects to shed load; that steered traffic onto peering links reached through an offsite interconnection switch, which then also saturated. Two pre-existing conditions made it worse: one direct peering link was running at half capacity due to an earlier failure, and the Data Center Interconnect to the offsite switch was already due for a capacity upgrade. 16:44 the network team is alerted to congestion in Ashburn (IAD); 16:45 responders find that uncongested paths no longer carry AWS prefixes because of the withdrawals; 17:22 dropped traffic increases; 17:45 a customer-impact incident is raised; 19:05 rate-limiting the customer reduces congestion; 19:27 traffic engineering fully resolves congestion; 19:45 AWS begins reverting withdrawals; 20:07 AWS finishes normalizing announcements over IAD PNIs; 20:18 impact ends. Router queues grew and edge routers dropped high-priority packets throughout. Customers saw latency, timeouts and low throughput; the share of synthetic origin requests missing the latency SLO tracked the packet drops. Latency recovered after drops because both sides were renormalizing prefix advertisements. Regional only; global Cloudflare services were unaffected. Not an attack, not a BGP hijack. Write the public postmortem for customers with origins in AWS us-east-1.", "A": "Congestion between Cloudflare and AWS us-east-1 on 21 August 2025\n\nOn 21 August 2025, between 16:27 and 20:18 UTC, customers whose origins sit in AWS us-east-1 saw elevated latency, timeouts and reduced throughput on traffic between Cloudflare and that region. The cause was network congestion on the links between the two networks, made worse by an automated attempt to relieve it. This was not an attack, and it was not a BGP hijack. Cloudflare's global network was unaffected; the impact was confined to paths into and out of us-east-1.\n\nWhat happened\n\nAt approximately 16:27 UTC a single customer began requesting cached objects from us-east-1 in large volume. The responses roughly doubled total Cloudflare-to-AWS traffic and saturated every direct peering link between the two networks. Two conditions that predated the event narrowed the headroom we had. One direct peering link was running at half its normal capacity following an earlier hardware failure, and the Data Center Interconnect to an offsite interconnection switch was already scheduled for a capacity upgrade it had not yet received.\n\nAt 16:37 UTC, AWS began withdrawing BGP advertisements on congested private network interconnects in order to shed load. This is a standard response, and in isolation a reasonable one. In this case it moved traffic onto peering links reached through the offsite interconnection switch, which then saturated as well. The withdrawals also removed AWS prefixes from paths that were not congested, so the traffic engineering options normally available to us were narrowed at the moment we most needed them.\n\nRouter queues grew on both sides. Our edge routers began dropping packets, including packets we classify as high priority. Customers experienced this as slow connections to origin, request timeouts, and low throughput. Our own synthetic monitoring of origin requests shows the share of requests missing the latency SLO tracking the packet drop rate closely throughout the event.\n\nTimeline (UTC)\n\n16:27 \u2014 Customer traffic to us-east-1 begins ramping; direct peering links saturate.\n16:37 \u2014 AWS begins withdrawing BGP advertisements on congested PNIs; traffic shifts to the offsite interconnection switch, which also saturates.\n16:44 \u2014 Our network team is alerted to congestion in Ashburn (IAD).\n16:45 \u2014 Responders determine that otherwise uncongested paths are no longer carrying AWS prefixes as a result of the withdrawals.\n17:22 \u2014 Dropped traffic increases.\n17:45 \u2014 A customer-impact incident is declared.\n19:05 \u2014 Rate-limiting applied to the customer whose traffic triggered the event; congestion begins to fall.\n19:27 \u2014 Traffic engineering fully resolves congestion on our side.\n19:45 \u2014 AWS begins reverting the BGP withdrawals.\n20:07 \u2014 AWS completes normalization of announcements over the IAD PNIs.\n20:18 \u2014 Impact ends.\n\nLatency remained elevated for a period after packet drops subsided. That gap is expected: both networks were renormalizing prefix advertisements, and traffic settled back onto its usual paths gradually rather than all at once.\n\nWhat we are doing about it\n\nThree things went wrong here, and each gets its own remedy.\n\nCapacity. The half-capacity peering link and the pending DCI upgrade both removed margin that would have absorbed this surge. We are restoring the degraded link to full capacity and accelerating the DCI upgrade to the offsite switch.\n\nDetection. Forty-four minutes is too long to reach the responding team. We are tightening alerting on interconnect utilization so congestion between us and a major cloud provider pages before queues build, and we are adding alerting on sudden prefix withdrawals from a peer so that the second-order effect is visible immediately rather than discovered during triage.\n\nBlast radius. A single customer's request pattern should not be able to saturate an interconnect shared by everyone. We are extending per-customer rate controls on origin-bound traffic so that this kind of surge is shaped automatically, well before it becomes an incident, instead of requiring a manual intervention two and a half hours in.\n\nWe are also working with AWS on load-shedding behavior that does not remove the alternate paths both networks depend on during congestion. We regret the disruption, and we are treating the detection gap in particular as the part of this we most need to fix.\n", "B": "Incident report: congestion between Cloudflare and AWS us-east-1, 21 August 2025\n\nCustomers with origins in AWS us-east-1 saw elevated latency, timeouts and reduced throughput from 16:27 to 20:18 UTC on 21 August 2025, because one customer's cache-fill traffic doubled total Cloudflare-to-AWS traffic and the load-shedding that followed concentrated that traffic onto the paths that were left. All times below are UTC. Impact was limited to this interconnection; Cloudflare's global services carried normal traffic throughout. This was not an attack and no BGP hijack occurred.\n\nAt about 16:27 a single customer began requesting large volumes of cached objects stored in AWS us-east-1. Those responses travel from AWS into our network, and the added volume doubled total Cloudflare-to-AWS traffic, saturating every direct peering link between the two networks. Two pre-existing conditions removed the headroom that would normally have absorbed part of this. One direct peering link was running at half its capacity after an earlier failure, and the Data Center Interconnect carrying traffic to our offsite interconnection switch was already scheduled for a capacity upgrade.\n\nAt 16:37 AWS began withdrawing BGP advertisements on the congested private network interconnects to shed load. A withdrawal does not reduce the number of bytes customers are asking for; it deletes a path, and every packet still destined for those prefixes must take a path that remains advertised. The shed traffic moved onto peering links reached through the offsite interconnection switch, crossing the Data Center Interconnect that was already short of capacity, and that path saturated in turn. Router queues grew and edge routers dropped packets, including the high-priority packets our queueing policy exists to protect.\n\nOur network team was alerted to congestion in Ashburn (IAD) at 16:44, 17 minutes after the first links saturated. Responders confirmed at 16:45 that the uncongested paths they would have shifted traffic onto no longer carried AWS prefixes, which removed traffic engineering as an immediate option. Dropped traffic increased at 17:22, and we raised a customer-impact incident at 17:45.\n\nRate-limiting the customer at 19:05 was the action that reduced congestion, and traffic engineering fully resolved it at 19:27. AWS began reverting the withdrawn advertisements at 19:45 and finished normalizing announcements over the IAD private network interconnects at 20:07. Impact ended at 20:18, 3 hours and 51 minutes after the first saturation.\n\nThe share of synthetic origin requests missing our latency SLO tracked packet drops through the event, which is how we sized customer impact without depending on any single customer's telemetry. Latency stayed elevated for a period after drops stopped, because both networks were still renormalizing prefix advertisements and traffic had not yet settled back onto the direct paths.\n\nThe mechanism that turned a saturated link into a 3 hour 51 minute incident is that our fastest mitigation depended on alternate paths that load-shedding had withdrawn. We are making the following changes.\n\nWe are adding per-customer origin fetch rate limits at the edge, triggered by measured link utilization on the path toward the origin network, so a single customer's cache-fill cannot consume an entire interconnection's headroom before a human is alerted.\n\nWe are completing the Data Center Interconnect capacity upgrade to the offsite interconnection switch and restoring the failed direct peering link to full capacity. Both were known gaps on 21 August, and together they determined how quickly the second path saturated.\n\nInterconnect alerting will fire on utilization crossing a threshold instead of on the packet drops it eventually causes. Drops at 16:44 were a late signal; utilization crossed its saturation point at about 16:27.\n\nFinally, we have opened work with AWS on load-shedding behaviour that preserves reachability on at least one uncongested path, so that shedding traffic and removing our ability to reroute it stop being the same operation.\n\nCloudflare apologizes for the disruption to your origin traffic. If you observed impact outside the window above, please open a support ticket and include the affected hostnames.\n"}, {"pair_id": "p005", "brief": "Raw material, Cloudflare, 12 September 2025, all times UTC. The Tenant Service API went down and took much of the public API and the Cloudflare Dashboard with it, because Tenant Service sits in the API request authorization path; when authorization cannot be evaluated, requests return 5xx. Trigger: a dashboard bug. API calls were driven by a React useEffect whose dependency array contained an object recreated on every state or prop change, so React treated it as always new and the call to /organizations fired many times per render, with retries on failure. Timeline: 16:32 the buggy dashboard version ships; 17:50 a new Tenant API Service version deploys; 17:57 Tenant Service is overwhelmed and dashboard availability starts dropping; 18:17 after adding resources the API reaches 98% availability but the dashboard does not recover; 18:58 an attempt to remove erroring codepaths ships and makes API impact worse; 19:01 a temporary rate-limiting rule is published; 19:12 the changes are reverted and dashboard availability returns to 100%. Tenant Service is a Go process on Kubernetes in a subset of datacenters; responders added pods and a global rate limit. Restarting it caused every dashboard to re-authenticate at once, a thundering herd amplified by the dashboard loop. Control plane and data plane are strictly separated, so network services were unaffected and most users noticed nothing unless making config changes. Argo Rollouts, which auto-rolls-back on detected errors, had not yet been adopted for Tenant Service and would have caught the second bad update. Responders could not distinguish retries from new requests in telemetry. Write the public postmortem for dashboard and API users.", "A": "In this case we noticed increased usage across our Tenant Service, so we focused on reducing the load and increasing the available resources. We installed a global rate limit on the Tenant Service to help regulate the load. The Tenant Service is a GoLang process that runs on Kubernetes in a subset of our datacenters. We increased the number of pods available as well to help improve throughput. While we did this, we had others on the team continue to investigate why we were seeing the unusually high usage. Ultimately, increasing the resources available to the tenant service helped with availability but was insufficient to restore normal service. After the Tenant Service began reporting healthy again and the API largely recovered, we still observed a considerable number of errors being reported from the service. We theorized that these were responsible for the ongoing Dashboard availability issues and made a patch to the service with the expectation that it would improve the API health and restore the dashboard to a healthy state. Ultimately this change degraded service further and was quickly reverted. The second outage can be seen in the graph above. It\u2019s painful to have an outage like this. That said, there were a few things that helped lessen the impact. Our automatic alerting service quickly identified the correct people to join the call and start working on remediation. Additionally, this was a failure in the control plane which has strict separation of concerns from the data plane. Thus, the outage did not affect services on Cloudflare\u2019s network. The majority of users at Cloudflare were unaffected unless they were making configuration changes or using our dashboard. Going forward We believe it\u2019s important to learn from our mistakes and this incident is an opportunity to make some improvements. Those improvements can be categorized as either ways to reduce / eliminate the impact of a similar change or as improvements to our observability tooling to better inform the team during future events. Reducing impact We use Argo Rollouts for releasing, which monitors deployments for errors and automatically rolls back that service on a detected error. We\u2019ve been migrating our services over to Argo Rollouts but have not yet updated the Tenant Service to use it. Had it been in place, we would have automatically rolled back the second Tenant Service update limiting the second outage. This work had already been scheduled by the team and we\u2019ve increased the priority of the migration. When we restarted the Tenant Service, everyone\u2019s dashboard began to re-authenticate with the API. This caused the API to become unstable again causing issues with everyone\u2019s dashboard. This pattern is a common one often referred to as a Thundering Herd. Once a resource or service is made available, everyone tries to use it all at once. This is common, but was amplified by the bug in our dashboard logic. The fix for this behavior has already been released via a hotfix shortly after the impact was over. We\u2019ll be introducing changes to the dashboard that include random delays to spread out retries and reduce contention as well. Finally, the Tenant Service was not allocated sufficient capacity to handle spikes in load like this. We\u2019ve allocated substantially more resources to this service, and are improving the monitoring so that we will be proactively alerted before this service hits capacity limits. Improving visibility We immediately saw an increase in our API usage but found it difficult to identify which requests were retries vs new requests. Had we known that we were seeing a sustained large volume of new requests, it would have made it easier to identify the issue as a loop in the dashboard. We are adding changes to how we call our APIs from our dashboard to include additional information, including if the request is a retry or new request.", "B": "Cloudflare Dashboard and API outage, 12 September 2025\n\nOn 12 September 2025, the Cloudflare Dashboard and much of our public API returned 5xx errors from 17:57 to 19:12 UTC, because a bug in the Dashboard's own code flooded the Tenant Service that authorizes every API request. The bug was ours, in a Dashboard version we shipped at 16:32 UTC. We are sorry for the disruption to customers who needed to change configuration during those 75 minutes.\n\nNo network traffic was affected. Our control plane and data plane are strictly separated, so the services that proxy, cache and protect customer traffic kept running on their own path and never consulted Tenant Service. If you did not attempt a configuration change or an API call during the window, you saw nothing.\n\nThe Dashboard bug was a React `useEffect` whose dependency array contained an object recreated on every state or prop change. React compares dependencies by reference, so it treated that object as new on every render and re-ran the effect, which called `/organizations`. One user session therefore issued many calls per render instead of one per page load, and each failed call was retried. The Dashboard was generating its own load, and the load grew as the calls started failing.\n\nTenant Service sits in the API request authorization path, and requests it cannot evaluate return 5xx. It is a Go process running on Kubernetes in a subset of our datacenters. At 17:50 UTC we deployed a new Tenant API Service version into a service already carrying the amplified Dashboard traffic; by 17:57 UTC Tenant Service was overwhelmed and Dashboard availability began dropping. Because the same service authorizes API calls made outside the Dashboard, customers using the API directly saw 5xx errors from a defect they had no part in.\n\nOur first mitigations restored the API and left the Dashboard broken. We added pods and applied a global rate limit, and by 18:17 UTC the API had returned to 98% availability while the Dashboard had not recovered. Restarting Tenant Service produced a thundering herd: every open Dashboard re-authenticated at once, and the render loop multiplied that burst instead of letting it drain. At 18:58 UTC we shipped a change to remove the erroring codepaths and it increased API impact. At 19:01 UTC we published a temporary rate-limiting rule. At 19:12 UTC we reverted the changes and Dashboard availability returned to 100%.\n\nTwo gaps turned a bad deploy into a 75-minute outage. First, Argo Rollouts, which automatically rolls back a deployment when it detects errors, had not yet been adopted for Tenant Service; it would have reverted the 17:50 UTC update without a human in the loop. Second, our telemetry could not distinguish a retry from a new request, so responders looking at request volume could not tell whether they were watching real demand or a feedback loop feeding on its own failures. That ambiguity is why we spent the hour after 17:57 UTC adding capacity to a service whose load was self-generated.\n\nWe are making the following changes. We are onboarding Tenant Service to Argo Rollouts so a deploy that raises the error rate rolls back automatically. We are instrumenting retries distinctly from first attempts across the API authorization path, so responders can read a feedback loop off a graph. We are adding API call-rate tests to the Dashboard build so a render-loop regression fails before it ships. We are giving Tenant Service the capacity headroom and admission controls to survive a client that misbehaves this way, since the next one will not look like a `useEffect` dependency array.\n"}, {"pair_id": "p006", "brief": "Raw material for the motivation and goals section of a Kubernetes enhancement proposal on pod scheduling readiness. Today a pod is treated as ready for scheduling the moment it is created, and the scheduler keeps trying to place every pending pod. In practice some pods sit for long stretches missing an essential resource, and the repeated attempts churn the scheduler and the downstream integrators that watch it, such as Cluster Autoscaler. Without a way to flag a pod as paused, those cycles are spent retrying pods already known to be unschedulable, which delays other pods and lowers overall scheduling throughput; it also constrains vendors who want to build features such as hierarchical quota natively. A constraint on any solution: the condition {type:PodScheduled, reason:Unschedulable} is the canonical signal the scheduler publishes so integrators such as Cluster Autoscaler know to add cluster resources, and that contract must not break. What the proposal wants: an API to mark pods scheduling-paused or scheduling-ready; a new Enqueue extension point so queueing behavior can be customized; paused pods must not be marked Unschedulable through the PodScheduled condition; and a default enqueue plugin that honors the new API's semantics. Out of scope: forcing pod conditions to expose more context about paused pods, and focusing on in-house uses of the Enqueue extension point. Noted as future work: permission control on individual scheduling gates, which depends on a fine-grained permissions design. Write the motivation, goals and non-goals section of this KEP for SIG Scheduling reviewers.", "A": "Pods are currently considered ready for scheduling once created. Kubernetes scheduler does its due diligence to find nodes to place all pending Pods. However, in a real-world case, some Pods may stay in a \"miss-essential-resources\" state for a long period. These pods actually churn the scheduler (and downstream integrators like Cluster AutoScaler) in an unnecessary manner. Lacking the knob to flag Pods as scheduling-paused/ready wastes scheduling cycles on retrying Pods that are determined to be unschedulable. As a result, it delays the scheduling of other Pods, and also lowers the overall scheduling throughput. Moreover, it imposes restrictions to vendors to develop some in-house features (such as hierarchical quota) natively. On the other hand, a condition `{type:PodScheduled, reason:Unschedulable}` works as canonical info exposed by scheduler to guide downstream integrators (e.g., ClusterAutoscaler) to supplement cluster resources. Our solution should not break this contract. This proposal describes APIs and mechanics to allow users/controllers to control when a pod is ready to be considered for scheduling. ### Goals <!-- List the specific goals of the KEP. What is it trying to achieve? How will we know that this has succeeded? --> - Define an API to mark Pods as scheduling-paused/ready. - Design a new Enqueue extension point to customize Pod's queueing behavior. - Not mark scheduling-paused Pods as `Unschedulable` by updating their `PodScheduled` condition. - A default enqueue plugin to honor the new API semantics. ### Non-Goals <!-- What is out of scope for this KEP? Listing non-goals helps to focus discussion and make progress. --> - Enforce updating the Pod's conditions to expose more context for scheduling-paused Pods. - Focus on in-house use-cases of the Enqueue extension point.", "B": "- Title: Pod Scheduling Readiness\n- Section: Motivation, Goals, Non-Goals\n- Audience: SIG Scheduling\n\n## Motivation\n\nA pod should be able to tell the scheduler that it is not ready to be placed, and today it cannot. The kube-apiserver admits a pod and the scheduler treats it as schedulable in the same instant; from then on the pod sits in the scheduling queue and is retried on every backoff cycle until it binds. For a pod that is waiting on something the scheduler does not supply -- a quota grant, a peer pod, a secret, a device plugin that has not registered -- every one of those cycles is known-futile before it runs.\n\nThe cost lands in two places. Each attempt on an unplaceable pod occupies a scheduling cycle that a placeable pod would otherwise get, which lowers throughput for the whole cluster. Each attempt also writes the condition `{type: PodScheduled, reason: Unschedulable}`, and every integrator watching that condition reacts. Cluster Autoscaler reads it as a request for capacity, so a pod blocked on a quota decision can drive a scale-up that no amount of new capacity will satisfy.\n\nWe have no measurement to offer here; the argument is structural. The scheduler cannot distinguish \"no node fits this pod\" from \"nothing outside the scheduler has released this pod yet\", and the two cases want opposite handling.\n\nThe absence also constrains vendors. Hierarchical quota, gang admission, and capacity reservation are all built today by holding pods outside the API and creating them late, because the API offers no supported way to hold a created pod. A first-class pause makes those features implementable against upstream Kubernetes.\n\nOne contract bounds any solution. `{type: PodScheduled, reason: Unschedulable}` is the signal integrators already depend on, and its meaning must not widen. A paused pod is not unschedulable -- no node has been rejected on its behalf -- and marking it so would teach Cluster Autoscaler to add nodes for pods that are not asking for nodes.\n\n## Goals\n\n- Add an API on the pod that marks it either scheduling-paused or scheduling-ready, settable at creation and clearable afterwards by a controller.\n- Add an Enqueue extension point to the scheduler framework so queueing behavior can be customized by out-of-tree plugins.\n- Keep a paused pod out of the `PodScheduled`/`Unschedulable` condition entirely, preserving the existing meaning of that condition for Cluster Autoscaler and other integrators.\n- Ship a default enqueue plugin that implements the semantics of the new API, so the feature works with no plugin authoring.\n\n## Non-Goals\n\n- Extending pod conditions to carry more context about why a pod is paused or who paused it. Read the pause state from the new API.\n- Designing or advocating in-house uses of the Enqueue extension point. This KEP specifies the extension point and the default plugin only.\n\n## Future Work\n\nPer-gate permission control, so that a controller can clear one scheduling gate and not the rest, depends on a fine-grained permissions design that does not exist yet. This KEP leaves gate removal governed by existing pod update permissions.\n"}, {"pair_id": "p007", "brief": "Raw material. Paul E. McKenney published Stochastic Fairness Queuing in 1990. Baseline fairness queuing keeps a separate FCFS queue per conversation and services queues bit-by-bit round-robin; ill-behaved conversations that exceed their fair share get longer delays and higher packet loss than well-behaved ones. The same construction works for RPC traffic by keying on something else, such as authorized customer id, instead of a source-destination address pair. Cost of the baseline in a distributed system: O(customers) queues plus O(customers) work to round-robin across them. SFQ replaces per-conversation queues with a fixed set of queues and a simple hash mapping into them: O(1) queues, O(1) time. New problem: two conversations that collide keep colliding, so each persistently receives less than its share. Remedy: periodically perturb the hash function so colliders in one period are unlikely to collide in the next. A further variant combines SFQ with shuffle sharding and best-of-two: map each customer to a subset of queues (possibly just two), enqueue each request into the shortest queue in that customer's subset, and periodically perturb subsets. Properties: O(1) queues, O(1) enqueue, O(1) dequeue, strong noisy-neighbour isolation provided only a small portion of customers are noisy. Usable on a single host or across hosts for load balancing. Write a design doc proposing a request-queuing scheme for a multi-tenant RPC service.", "A": "Request queuing for a multi-tenant RPC service\n\nProposal\n\nThe problem\n\nOne customer can consume a shared RPC service's capacity and leave every other customer waiting. A single FIFO queue in front of a worker pool has no opinion about who filled it. If one customer sends a burst, or has a retry storm, or simply runs a batch job at midnight, their requests sit ahead of everyone else's requests in the same line. Latency for the well-behaved customers degrades in proportion to the misbehavior of one, and we find out from their tickets.\n\nFair queuing solves this, and we cannot afford it\n\nFair queuing is the textbook answer. Keep a separate FCFS queue per conversation and service the queues bit-by-bit round-robin. A conversation that exceeds its fair share gets longer delays and higher packet loss, and the conversations that stay within their share do not. The construction does not care that it was invented for packets: for RPC we key on the authorized customer id instead of a source-destination address pair, and the same isolation property falls out.\n\nThe cost is the problem. Per-customer queuing is O(customers) queues and O(customers) work per round-robin sweep. A service with a hundred thousand authorized customers would spend its dequeue loop walking overwhelmingly empty queues, and would hold the memory for all of them on every host. The isolation is real; the bookkeeping is not something we want on the request path.\n\nStochastic Fairness Queuing\n\nMcKenney's 1990 Stochastic Fairness Queuing replaces per-customer queues with a fixed set of queues and a hash. Allocate Q queues. Hash the customer id into [0, Q) and enqueue there. Round-robin over the Q queues to dequeue. This is O(1) queues and O(1) time on both sides, independent of how many customers exist, and it approximates the fairness of the exact scheme because most customers land alone in their queue most of the time.\n\nThe approximation has a sharp edge. Two customers that hash to the same queue keep hashing to the same queue, for as long as the hash function is fixed. If one of them is noisy, the other one persistently receives less than its share -- not for a burst, but forever. McKenney's remedy is to periodically perturb the hash function. A customer colliding with a noisy neighbor in one period is unlikely to collide with the same neighbor in the next, which converts a permanent penalty into an occasional one.\n\nWhat we propose: SFQ subsets with best-of-two\n\nWe propose combining SFQ with shuffle sharding. Rather than hashing each customer to one queue, map each customer to a small subset of the Q queues -- two is enough -- and enqueue each request into the shorter of that customer's two queues. Perturb the subset assignment on the same period as the hash above.\n\nThe best-of-two choice is what buys the isolation. With Q = 64 and subsets of size 2, there are C(64,2) = 2016 distinct subsets. Two customers share at least one queue with probability 1 - C(62,2)/C(64,2) = 125/2016, about 6.2 percent, which is worse than the 1/64 collision rate of plain SFQ. Sharing *both* queues, which is the case where a customer has nowhere to go, has probability 1/2016, about 0.05 percent. That is roughly 32 times better than plain SFQ, and the gap widens as Q grows. A customer that overlaps a noisy neighbor on one queue sends its work to the other one.\n\nThe property holds only while a small portion of customers are noisy. If a quarter of the tenants are hostile, every subset of two contains a hostile queue and the scheme degrades toward the single-FIFO behavior we started with. We believe our traffic satisfies the assumption -- the incidents we have seen involve one or two customers -- but we should measure the noisy fraction before committing to subset size 2.\n\nDeployment\n\nThe same structure works at two levels. On a single host, the Q queues sit in front of the worker thread pool. Across hosts, the queues are the hosts themselves, and best-of-two becomes a load-balancing decision at the caller. We propose building the single-host version first, since it needs no coordination and can be measured against current p99 latency per customer.\n", "B": "Request queuing for a multi-tenant RPC service\n\nProblem\n\nToday every request lands in one FIFO queue per host. That queue is a shared fate pool: when one customer sends a burst, or sends requests that are individually expensive, its work sits ahead of everyone else's, and every other customer's latency rises with the depth of the burst. We have no mechanism that makes the cost of misbehaviour fall on the misbehaving customer. Admission control by global rate limit does not fix this, because a customer inside its limit can still be the only thing in the queue for a hundred milliseconds.\n\nWhat we want is the property fair queuing gives packet networks: a customer that exceeds its share sees longer delays and more shed load than one that stays within it, and the well-behaved customers do not notice.\n\nWhy not classic fair queuing\n\nThe textbook construction (per-conversation FCFS queues, serviced round-robin) transfers cleanly to RPC if we key on authorized customer id instead of a source-destination address pair. It also transfers its cost. We hold O(customers) queues and spend O(customers) work walking them per dispatch. With tens of thousands of authorized customers per fleet, and a dispatch budget measured in microseconds, that is not a structure we can afford in the request path.\n\nProposal\n\nAdopt Stochastic Fairness Queuing (McKenney, 1990), extended with shuffle sharding and best-of-two choices.\n\nKeep a fixed set of Q queues per host, sized independently of the customer count. Hash the customer id to select queues; dispatch round-robin over the Q queues. Queue count and dispatch cost are now constants: O(1) queues, O(1) enqueue, O(1) dequeue.\n\nPlain SFQ has one failure mode worth naming. Two customers whose ids hash to the same queue keep hashing to the same queue, so a customer unlucky enough to share with a noisy neighbour is persistently below its share -- not for one burst, but forever. The remedy is to perturb the hash function periodically: a collision in one period does not predict a collision in the next, so the penalty is spread thin across customers and across time rather than concentrated on one victim.\n\nWe go a step further. Instead of mapping each customer to one queue, map it to a small subset -- two is enough to get most of the benefit -- and enqueue each request into the shorter of the two. Subsets are perturbed on the same period as the hash. This is shuffle sharding with best-of-two choices, and it buys two things. First, isolation is now combinatorial: a customer is harmed only if every queue in its subset is shared with a noisy neighbour, which is rare so long as only a small fraction of customers are noisy. Second, best-of-two smooths transient imbalance without any coordination, because the enqueue already knows both depths.\n\nScope\n\nThe same construction works at two levels and we propose both, in order. On a single host it governs which request the worker pool picks up next. Across hosts it can drive load balancing: the subset is a set of hosts, and the choice is the shorter of two host queues. Ship the single-host version first; it is self-contained, and it tells us whether the shed behaviour under burst is what we expect before we let the scheme influence routing.\n\nTradeoffs and open questions\n\nThe guarantee is statistical, not absolute. If a large fraction of customers are simultaneously noisy, subsets overlap and isolation degrades toward the shared-FIFO behaviour we have now. We accept that: the design targets the noisy-neighbour case, not overload.\n\nThree parameters need measurement rather than assertion: Q, subset size, and perturbation period. Q trades memory against collision probability. The period trades isolation against churn -- perturbing too often reorders work for customers that were doing nothing wrong. We propose picking initial values from replay against production traces, and reporting per-customer p99 delay under a synthetic single-noisy-tenant load as the acceptance test.\n"}, {"pair_id": "p008", "brief": "Raw material, Cloudflare, 5 December 2025, all times UTC. Impact 08:47 to 09:12, about 25 minutes. Roughly 28% of all HTTP traffic Cloudflare serves was affected. Not an attack. The WAF buffers HTTP request bodies in memory for inspection; the buffer had been 128KB. To cover customers against CVE-2025-55182, a critical React Server Components vulnerability, Cloudflare began raising the buffer to 1MB, the Next.js default limit. That first change went out through the gradual deployment system. During rollout an internal WAF testing tool turned out not to support the larger buffer, so a second change disabled that tool. The tool had no effect on customer traffic, but the disable was made through the global configuration system, which does no staged rollout and reaches the entire fleet within seconds. The disable was implemented as a killswitch in the rulesets system. A rule's action can be block, log, skip, or execute, where execute triggers evaluation of a sub-ruleset. A killswitch had never before been applied to a rule with action execute. The skip was honoured, but result-processing code still dereferenced rule_result.execute, which did not exist, producing a Lua nil index error at init.lua line 314 in the FL1 proxy and HTTP 500s. The bug had sat undetected for years; the Rust reimplementation in FL2 does not have it. Affected: customers on FL1 with the Cloudflare Managed Ruleset deployed, all requests 500ing except some test endpoints such as /cdn-cgi/trace. China network traffic unaffected. 08:50 declared by automated alerts, 09:11 revert, 09:12 propagation complete. Write the public incident writeup for customers who saw 500s.", "A": "Cloudflare incident report: HTTP 500 errors, 5 December 2025\n\nSummary\n\nOn 5 December 2025, between 08:47 and 09:12 UTC, requests through Cloudflare returned HTTP 500 errors for a large share of our customers. About 28% of all HTTP traffic we serve was affected over those 25 minutes. This was not an attack, and no customer data was exposed or lost. We caused this ourselves, with a configuration change that we pushed globally in seconds, and we are sorry.\n\nAll times below are UTC.\n\nWhat you saw\n\nIf you were affected, essentially every request to your zone returned a 500 for the duration. A small number of Cloudflare-internal endpoints such as /cdn-cgi/trace continued to answer, which is why some health checks stayed green while real traffic failed. The failure was confined to customers served by our FL1 proxy with the Cloudflare Managed Ruleset deployed. Zones on FL2, and all traffic on our China network, were unaffected.\n\nWhat happened\n\nThe trigger was a WAF buffer size increase we shipped to protect customers against CVE-2025-55182, a critical React Server Components vulnerability. Our WAF buffers HTTP request bodies in memory so it can inspect them, and that buffer had been capped at 128KB. Next.js allows request bodies up to 1MB by default, so a body between those two sizes could carry an exploit past inspection. We began raising the buffer to 1MB, and that change went out through our gradual deployment system as intended.\n\nDuring the rollout we found that an internal WAF testing tool did not support the larger buffer. The tool handles no customer traffic. We disabled it, and that is where the incident started: the disable was made through our global configuration system, which performs no staged rollout and reaches every machine in the fleet within seconds. A change with no customer-facing purpose was therefore delivered with less safety than the change it was clearing the way for.\n\nThe disable was implemented as a killswitch in our rulesets system. A rule in that system carries an action, one of block, log, skip, or execute, where execute means the rule triggers evaluation of a sub-ruleset. The killswitch works by forcing a skip. No killswitch had ever been applied to a rule whose action was execute. The skip itself was honoured correctly, but the code that processes results afterwards still reached for rule_result.execute, a field that a skipped rule does not produce. In Lua that is a nil index error, raised at init.lua line 314, and the FL1 proxy failed the request with a 500.\n\nThat bug had been in FL1 for years without ever being reached, because the one input that reaches it had never been supplied. Our Rust reimplementation of the proxy, FL2, does not have it; the equivalent code cannot compile with an unchecked field access.\n\nTimeline\n\n08:47 -- Global configuration change applied; 500s begin.\n08:50 -- Automated alerts fire and we declare an incident.\n09:11 -- We revert the configuration change.\n09:12 -- The revert finishes propagating and error rates return to baseline.\n\nWhat we are changing\n\nWe are removing the asymmetry that caused this. Changes through the global configuration system will move to the same staged, health-gated rollout that code and WAF rule changes already use, so that a change reaching 100% of the fleet in seconds is a deliberate emergency action rather than the default path.\n\nWe are also fixing the specific defect and the class it belongs to. The FL1 result-processing path now checks the action before reading action-specific fields, and we are auditing the rulesets code for every other field read that assumes a rule ran. Separately, we are adding coverage for killswitches against each of the four rule actions, including execute, which no test exercised before this week. Migration of remaining FL1 zones to FL2 continues.\n", "B": "Cloudflare's Web Application Firewall (WAF) provides customers with protection against malicious payloads, allowing them to be detected and blocked. To do this, Cloudflare\u2019s proxy buffers HTTP request body content in memory for analysis. Before today, the buffer size was set to 128KB. As part of our ongoing work to protect customers who use React against a critical vulnerability, CVE-2025-55182 , we started rolling out an increase to our buffer size to 1MB, the default limit allowed by Next.js applications, to make sure as many customers as possible were protected. This first change was being rolled out using our gradual deployment system. During rollout, we noticed that our internal WAF testing tool did not support the increased buffer size. As this internal test tool was not needed at that time and had no effect on customer traffic, we made a second change to turn it off. This second change of turning off our WAF testing tool was implemented using our global configuration system. This system does not perform gradual rollouts, but rather propagates changes within seconds to the entire fleet of servers in our network and is under review following the outage we experienced on November 18 . Unfortunately, in our FL1 version of our proxy, under certain circumstances, the second change of turning off our WAF rule testing tool caused an error state that resulted in 500 HTTP error codes to be served from our network. As soon as the change propagated to our network, code execution in our FL1 proxy reached a bug in our rules module which led to the following Lua exception: [lua] Failed to run module rulesets callback late_routing : / usr / local / nginx - fl / lua / modules / init . lua : 314 : attempt to index field 'execute' (a nil value) resulting in HTTP code 500 errors being issued. The issue was identified shortly after the change was applied, and was reverted at 09:12, after which all traffic was served correctly. Customers that have their web assets served by our older FL1 proxy AND had the Cloudflare Managed Ruleset deployed were impacted. All requests for websites in this state returned an HTTP 500 error, with the small exception of some test endpoints such as /cdn-cgi/trace . Customers that did not have the configuration above applied were not impacted. Customer traffic served by our China network was also not impacted. The runtime error Cloudflare\u2019s rulesets system consists of sets of rules which are evaluated for each request entering our system. A rule consists of a filter, which selects some traffic, and an action which applies an effect to that traffic. Typical actions are \u201c block \u201d, \u201c log \u201d, or \u201c skip \u201d. Another type of action is \u201c execute \u201d, which is used to trigger evaluation of another ruleset. Our internal logging system uses this feature to evaluate new rules before we make them available to the public. A top level ruleset will execute another ruleset containing test rules. It was these test rules that we were attempting to disable. We have a killswitch subsystem as part of the rulesets system which is intended to allow a rule which is misbehaving to be disabled quickly. This killswitch system receives information from our global configuration system mentioned in the prior sections. We have used this killswitch system on a number of occasions in the past to mitigate incidents and have a well-defined Standard Operating Procedure, which was followed in this incident. However, we have never before applied a killswitch to a rule with an action of \u201c execute \u201d. When the killswitch was applied, the code correctly skipped the evaluation of the execute action, and didn\u2019t evaluate the sub-ruleset pointed to by it. However, an error was then encountered while processing the overall results of evaluating the ruleset: if rule_result . action == \"execute\" then rule_result . execute . results = ruleset_results[ tonumber (rule_result . execute . results_index)] end This code expects that, if the ruleset has action=\u201dexecute\u201d, the \u201crule_result.execute\u201d object will exist. However, because the rule had been skipped, the rule_result.execute object did not exist, and Lua returned an error due to attempting to look up a value in a nil value. This is a straightforward error in the code, which had existed undetected for many years. This type of code error is prevented by languages with strong type systems. In our replacement for this code in our new FL2 proxy, which is written in Rust, the error did not occur."}, {"pair_id": "p009", "brief": "Raw material, Cloudflare, 12 September 2025, all times UTC. The Tenant Service API went down and took much of the public API and the Cloudflare Dashboard with it, because Tenant Service sits in the API request authorization path; when authorization cannot be evaluated, requests return 5xx. Trigger: a dashboard bug. API calls were driven by a React useEffect whose dependency array contained an object recreated on every state or prop change, so React treated it as always new and the call to /organizations fired many times per render, with retries on failure. Timeline: 16:32 the buggy dashboard version ships; 17:50 a new Tenant API Service version deploys; 17:57 Tenant Service is overwhelmed and dashboard availability starts dropping; 18:17 after adding resources the API reaches 98% availability but the dashboard does not recover; 18:58 an attempt to remove erroring codepaths ships and makes API impact worse; 19:01 a temporary rate-limiting rule is published; 19:12 the changes are reverted and dashboard availability returns to 100%. Tenant Service is a Go process on Kubernetes in a subset of datacenters; responders added pods and a global rate limit. Restarting it caused every dashboard to re-authenticate at once, a thundering herd amplified by the dashboard loop. Control plane and data plane are strictly separated, so network services were unaffected and most users noticed nothing unless making config changes. Argo Rollouts, which auto-rolls-back on detected errors, had not yet been adopted for Tenant Service and would have caught the second bad update. Responders could not distinguish retries from new requests in telemetry. Write the public postmortem for dashboard and API users.", "A": "Cloudflare Dashboard and API outage on 12 September 2025\n\nOn 12 September 2025, for roughly 75 minutes, the Cloudflare Dashboard was largely unusable and a substantial share of public API calls returned 5xx errors. If you tried to change a configuration during that window, you probably could not. If you were only serving traffic through us, you almost certainly saw nothing: the control plane and the data plane are strictly separated, so our network services kept running normally throughout. All times below are UTC.\n\nThe failure was ours, and it began in our own Dashboard code.\n\nWhat happened\n\nThe Tenant Service API sits in the authorization path for API requests. Every API call, including every call the Dashboard makes on your behalf, needs an authorization decision from it. When Tenant Service cannot answer, we cannot evaluate whether a request is permitted, and the request fails with a 5xx. That single dependency is why a problem in one internal service became an outage across the Dashboard and much of the public API.\n\nAt 16:32 we shipped a Dashboard release containing a bug. A React useEffect hook had a dependency array holding an object that was recreated on every state or prop change. React compares those dependencies by identity, so it saw a new object every render and re-ran the effect every time. The result was a call to /organizations firing repeatedly during a single render cycle, with retries layered on top whenever a call failed. Each open Dashboard tab became a small load generator.\n\nAt 17:50 a new version of the Tenant API Service deployed. By 17:57 Tenant Service was overwhelmed by the combination of that deployment and the Dashboard's request volume, and Dashboard availability began to drop.\n\nWe added pods to Tenant Service, which runs as a Go process on Kubernetes in a subset of our datacenters, and by 18:17 the API had recovered to 98% availability. The Dashboard did not recover with it. Restarting Tenant Service meant every open Dashboard had to re-authenticate at the same moment, and the retry loop in the Dashboard amplified that thundering herd into sustained pressure rather than a brief spike.\n\nAt 18:58 we shipped a change intended to remove the erroring codepaths. It made API impact worse. At 19:01 we published a temporary global rate-limiting rule to shed load. At 19:12 we reverted the 18:58 change, and Dashboard availability returned to 100%.\n\nWhat went wrong beyond the bug\n\nTwo things extended the incident past the initial trigger.\n\nWe had not yet adopted Argo Rollouts for Tenant Service. Argo Rollouts automatically rolls back a deployment when it detects errors, and it would have caught the bad update at 18:58 and reverted it without a human in the loop. Other services already had this protection; Tenant Service did not.\n\nOur telemetry could not distinguish retries from new requests. Responders watching request volume climb could not tell whether they were seeing more users, a retry storm, or both, which slowed the work of identifying the Dashboard loop as the amplifier.\n\nWhat we are changing\n\nWe are fixing the Dashboard's retry behavior so that failed calls back off instead of hammering a struggling dependency, and correcting the useEffect dependency that caused the loop. We are completing the Argo Rollouts adoption for Tenant Service so that a bad deployment reverts itself. We are instrumenting our API telemetry to separate retries from first attempts, so the next responder can see the difference immediately. We are also revisiting the capacity and isolation of Tenant Service given its position in the authorization path.\n\nWe know how much you rely on being able to change your configuration when you need to. We are sorry for the disruption.\n", "B": "Cloudflare Dashboard and API outage, 12 September 2025\n\nBetween 17:57 and 19:12 UTC on 12 September 2025, the Cloudflare Dashboard was unavailable and much of the public API returned 5xx errors. Tenant Service, which evaluates authorization for every API request, was overwhelmed by request volume from the Dashboard; a request whose authorization cannot be evaluated fails, so the errors propagated to every API surface behind it. The Dashboard was the loudest casualty because it is itself an API client. Our control plane and data plane are strictly separated, and no network service -- proxying, caching, WAF, DNS resolution -- was affected. If you were not making configuration changes during that window, you almost certainly saw nothing. We are sorry for the time this cost the customers who were.\n\nThe trigger was a Dashboard bug we shipped at 16:32. A React useEffect hook issued the call to our /organizations endpoint, and its dependency array held an object that was recreated on every state or prop change. React compares dependencies by reference, so it read a fresh object on each render and re-ran the effect. A single Dashboard session therefore issued that API call many times per render pass, and each failure added retry traffic on top.\n\nThe load alone did not take the service down. At 17:50 we deployed a new version of the Tenant Service API. Seven minutes later, at 17:57, Tenant Service was saturated and Dashboard availability began to drop.\n\nOur response made the incident worse before it made it better. We added pods to Tenant Service, which is a Go process running on Kubernetes across a subset of our datacenters, and by 18:17 the API had recovered to 98% availability. The Dashboard had not recovered at all. At 18:58 we shipped a change intended to remove the erroring codepaths, and API impact increased. At 19:01 we published a temporary global rate-limiting rule on the Tenant Service call path. At 19:12 we reverted the 18:58 change, and Dashboard availability returned to 100%.\n\nRestarting Tenant Service turned recovery into a second load event. Every Dashboard session re-authenticated at once when the service came back, and the retry loop described above multiplied that herd instead of letting it drain. Each restart bought a smaller window of health than the last.\n\nTwo gaps made the incident longer than it needed to be. First, Argo Rollouts, which watches error rates during a deploy and rolls back automatically, has been adopted across much of our platform but not yet for Tenant Service. It would have reverted the 18:58 change without a human in the loop, and probably the 17:50 one as well. Second, our Tenant Service telemetry counts requests, not first attempts. Responders on the call could see request volume climbing and could not tell how much of it was new work and how much was the same failing calls coming back, which is the measurement that would have pointed at the Dashboard within minutes.\n\nHere is what we are changing. We have fixed th
