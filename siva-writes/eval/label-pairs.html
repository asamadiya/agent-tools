": "graph-store capacity: 400 hosts, purchase order signed by Nov 3 2026\n\nWe are asking the board to approve 400 additional graph-store hosts, $2.9M annualised, with the purchase order signed by Nov 3 2026, because peak traffic crosses the fleet's serving ceiling in late February 2027 and hardware takes 14 weeks to arrive.\n\nThe fleet has 193 QPS per host of headroom today. 2,100 hosts across three regions carry a peak of 1.8M QPS, which is 857 QPS per host. Load testing puts the redline at 1,050 QPS per host, so the fleet ceiling is 2.2M QPS. Every host we own is running at 82% of the number load testing says it can sustain.\n\nGrowth eats that headroom in five months. Trailing nine-month growth is 4.2% per month compounded, and every month since January has landed within 0.4 points of that figure, which is the tightest input in this forecast. Going from 1.8M to 2.2M QPS is a factor of 1.222, and ln(1.222) / ln(1.042) is 4.9 months. Counting from the September peak, that is late February 2027.\n\nSize the order against June 2027, not against the crossing. Nine months of 4.2% compounding is a factor of 1.449, which puts peak at 2.61M QPS. Serving 2.61M QPS with every host at the 1,050 redline needs 2,476 hosts, and we round to a fleet of 2,500. That is 400 hosts on top of the 2,100 we run, at $7,250 per host per year, or $2.9M annualised.\n\nNov 3 is the last date that leaves racking margin. Hardware lead time is 14 weeks, and Nov 3 plus 98 days is Feb 9 2027, roughly three weeks ahead of the crossing. Slipping the signature by a month delivers hosts in March, after peak has already passed 2.2M QPS, and the fleet spends that window above the redline in whichever region peaks first. The redline is a load-test result, not a cliff, but we have no measurement of behaviour above it.\n\nOne alternative exists and it is not staffed. Moving the read path to the new columnar serialization is estimated to cut CPU per query by 18%. Hold the redline proportional to CPU cost and that lifts per-host capacity to about 1,280 QPS and the fleet ceiling to 2.68M QPS, which is 1.49x today's peak and 9.7 months of 4.2% growth -- a crossing in August 2027, matching the team's own August estimate. That work has had no engineer assigned for two quarters.\n\nThe columnar path does not change the Nov 3 date even if we staff it this week. An engineer starting in October has to land the serialization change, qualify it under load, and roll it across three regions before February, and we have no estimate of that duration because nobody has scoped the work. The 18% figure is itself an estimate rather than a measurement. Approving the hosts and staffing the columnar work are independent decisions: if the CPU reduction lands, it buys six months of growth on a 2,500-host fleet and defers the next order to 2028.\n\nTwo things would change this request. A growth rate that drops below 4.2% for two consecutive months moves the crossing later and we will re-forecast at the December review. A measured redline above 1,050 QPS per host would cut the host count directly, since 2.61M QPS at 1,200 QPS per host needs 2,175 hosts and no purchase at all. We are running that load test in October and will report the number before the PO date.\n"}, {"pair_id": "p055", "brief": "Raw material. Concurrency control in Aurora DSQL, a multi-region relational database. Optimistic concurrency control was chosen for throughput and for one isolation property: under it a client is never in a position to block another one. Claimed consequence at scale: client-to-client performance cross talk, a large driver of tail latency whenever an application sits on a pessimistic relational engine. Stock illustration: a process stops for garbage collection holding a write lock, and everything queued behind it stops too. Operational record from Amazon: lock contention, and the retries that follow a failed lock acquisition, turn up repeatedly as causes of outages and of metastable failure, with long recoveries. Two design objectives follow: keep applications out of metastable failure, and blunt the duller failures that come from badly behaved clients and client code. Measured result: figure 6 plots SELECT and UPDATE latency, and both stay fast even with the database running across regions. Second thread, consistency defaults. Two publications from the 2000s, the Amazon Dynamo paper (2007) and Werner Vogels' article Eventually Consistent (2009), held that cloud-scale systems had to give up strong consistency to reach their availability and latency targets. Four things have shifted since: how time is distributed, how data-centre networks are built, how power and cooling are provisioned, and what distributed protocols can do. Position taken: strong consistency now belongs as the default, and almost no application is better served by eventual consistency. Write a design doc justifying the concurrency-control and consistency defaults for a new transactional datastore.", "A": "I\u2019ve written about metastable failures (have you tried Stability Sim ?) many times, and this is a key part of how we designed DSQL to help applications avoid them. It also helps avoid a large class of other, more mundane, failures cause by misbehaving clients and client code. And figure 6, another big advantage of the architecture, showing fast SELECT s and UPDATE s, even in the multi-region setting (faster than the speed of light!): The 2007 Amazon Dynamo paper\u2019s embrace of eventual consistency [12], and Werner Vogels 2009 article Eventually Consistent [36], reflected the thinking at the time that cloud-scale systems needed to embrace eventual consistency to achieve their availability and latency goals. Since then, advancements in time distribution, data-center networks, power and cooling infrastructure, and distributed protocols have changed the trade-offs. The 2007 Amazon Dynamo paper\u2019s embrace of eventual consistency [12], and Werner Vogels 2009 article Eventually Consistent [36], reflected the thinking at the time that cloud-scale systems needed to embrace eventual consistency to achieve their availability and latency goals. Since then, advancements in time distribution, data-center networks, power and cooling infrastructure, and distributed protocols have changed the trade-offs. A perfect illustration of ongoing benefits to databases and software systems coming from hardware, datacenter design, and networking innovations. It\u2019s hard to overstate the power of this trend (and the opportunity still available). I continue to believe that strong consistency is the right default, and the right choice for nearly all applications.", "B": "Concurrency control and consistency defaults\n\nDecision\n\nWe default to optimistic concurrency control and to strong consistency. A transaction reads a snapshot, buffers its writes, and validates once at commit time; at no point does it hold a lock that another session must queue behind. Aurora DSQL made both choices for a multi-region relational database, and its published results are the main external evidence we lean on. This document gives the reasoning and the conditions under which we would revisit either default.\n\nWhy optimistic concurrency control\n\nUnder OCC a client is never in a position to block another client. We want that isolation property ahead of the throughput argument, which is real but secondary. On a pessimistic engine one slow session exports its slowness to everything queued behind its locks. The stock illustration is a process that stops for garbage collection while holding a write lock: the pause has nothing to do with the waiting transactions, and they pay for it anyway. At scale this client-to-client cross talk is a large driver of tail latency.\n\nAmazon's operational record carries more weight than the illustration. Lock contention, and the retries that follow a failed lock acquisition, turn up repeatedly as causes of outages and of metastable failure, the state in which retry load sustains an overload after its trigger is gone and recovery runs long. Two design objectives follow. Keep applications out of metastable failure, and blunt the duller failures that come from badly behaved clients and client code.\n\nOCC does not make conflict free. It relocates the cost from a waiting queue inside the engine to a retry in the application, which is a cost we can bound, observe per workload, and shed. A queue of blocked sessions is none of those things.\n\nWhy strong consistency is the default\n\nThe Dynamo paper (2007) and Werner Vogels' Eventually Consistent (2009) held that cloud-scale systems had to give up strong consistency to reach their availability and latency targets. That was an accurate reading of the hardware and protocols of the 2000s. Four things have shifted since: how time is distributed, how data-centre networks are built, how power and cooling are provisioned, and what distributed protocols can do. Figure 6 of the DSQL work plots SELECT and UPDATE latency under OCC, and both stay fast with the database running across regions.\n\nSo strong consistency becomes the default here. Eventual consistency remains available as an explicit per-workload opt-in, and we expect almost no application to be better served by it, because the reasoning required to stay correct under weak reads is paid by every engineer who later touches that code.\n\nWhat would change our mind\n\nRun the workload at target concurrency and measure the abort rate per transaction class. If a class aborts often enough that its retry budget exceeds the latency we save by not queueing, that class needs a different design, not a different engine default.\n"}, {"pair_id": "p056", "brief": "Raw material, Cloudflare, 21 August 2025, all times UTC. A single customer began requesting large volumes of cached objects from AWS us-east-1 at about 16:27, and the response traffic doubled total Cloudflare-to-AWS traffic, saturating every direct peering link between the two networks. At 16:37 AWS started withdrawing BGP advertisements on congested private network interconnects to shed load; that steered traffic onto peering links reached through an offsite interconnection switch, which then also saturated. Two pre-existing conditions made it worse: one direct peering link was running at half capacity due to an earlier failure, and the Data Center Interconnect to the offsite switch was already due for a capacity upgrade. 16:44 the network team is alerted to congestion in Ashburn (IAD); 16:45 responders find that uncongested paths no longer carry AWS prefixes because of the withdrawals; 17:22 dropped traffic increases; 17:45 a customer-impact incident is raised; 19:05 rate-limiting the customer reduces congestion; 19:27 traffic engineering fully resolves congestion; 19:45 AWS begins reverting withdrawals; 20:07 AWS finishes normalizing announcements over IAD PNIs; 20:18 impact ends. Router queues grew and edge routers dropped high-priority packets throughout. Customers saw latency, timeouts and low throughput; the share of synthetic origin requests missing the latency SLO tracked the packet drops. Latency recovered after drops because both sides were renormalizing prefix advertisements. Regional only; global Cloudflare services were unaffected. Not an attack, not a BGP hijack. Write the public postmortem for customers with origins in AWS us-east-1.", "A": "Cloudflare congestion affecting customer origins in AWS us-east-1\n\n21 August 2025. All times UTC.\n\nSummary\n\nBetween 16:27 and 20:18 on 21 August 2025, requests Cloudflare made to origins in AWS us-east-1 saw elevated latency, connection timeouts and reduced throughput. The cause was congestion on the network paths between Cloudflare and AWS in the Ashburn (IAD) metro, which lasted three hours and fifty-one minutes. Impact was regional and global Cloudflare services were unaffected. This was not an attack and not a BGP hijack. We are sorry for the disruption, and for the 78 minutes it took us to raise a customer-impact incident.\n\nWhat happened\n\nA single customer began requesting large volumes of cached objects from AWS us-east-1 at about 16:27. The response traffic doubled total Cloudflare-to-AWS traffic and saturated every direct peering link between the two networks. Two pre-existing conditions had already narrowed the headroom that would otherwise have absorbed part of the surge: one direct peering link was running at half capacity after an earlier failure, and the Data Center Interconnect to an offsite interconnection switch was already queued for a capacity upgrade.\n\nAt 16:37 AWS began withdrawing BGP advertisements on the congested private network interconnects to shed load. Those withdrawals steered the traffic onto peering links reached through the offsite interconnection switch, and that path saturated in turn. The withdrawals also removed AWS prefixes from paths that were not congested, so the routes our traffic engineering would have shifted onto no longer existed. Router queues grew and edge routers dropped packets, including packets we classify as high priority and normally protect under load.\n\nCustomer impact\n\nRequests to AWS us-east-1 origins returned slowly, timed out, or completed at low throughput. We measure this with synthetic origin requests, and the share of those requests missing the latency SLO tracked the packet drop rate closely throughout the event. Latency stayed elevated for a period after the drops stopped, because both networks were renormalizing prefix advertisements during that window and paths were still shifting. Traffic to origins outside AWS us-east-1 was not affected.\n\nTimeline\n\n16:27 -- Customer request volume rises; direct peering links between Cloudflare and AWS saturate.\n16:37 -- AWS begins withdrawing BGP advertisements on congested PNIs.\n16:44 -- Our network team is alerted to congestion in IAD, 17 minutes after onset.\n16:45 -- Responders determine that uncongested paths no longer carry AWS prefixes.\n17:22 -- Dropped traffic increases.\n17:45 -- A customer-impact incident is raised.\n19:05 -- Rate-limiting the customer reduces congestion.\n19:27 -- Traffic engineering fully resolves congestion.\n19:45 -- AWS begins reverting the withdrawals.\n20:07 -- AWS finishes normalizing announcements over IAD PNIs.\n20:18 -- Impact ends.\n\nWhat we are changing\n\nOur capacity planning treated the degraded peering link and the pending DCI upgrade as separate items on separate schedules. Neither was urgent alone. Together they removed the spare capacity that a single large traffic shift needed, and we are changing how we account for that: a link running degraded now counts against available headroom for the metro, and a DCI upgrade blocking a saturated path is escalated rather than queued.\n\nWe are adding per-customer egress rate limits that trigger automatically. Rate-limiting the customer at 19:05 reduced congestion within minutes, and we reached that action two hours and thirty-eight minutes after onset.\n\nWe are working with AWS on a load-shed procedure that preserves advertisements on uncongested paths. Withdrawing prefixes globally to shed load on one set of interconnects removed our ability to route around the problem at 16:45, which is the point where this incident became long.\n\nWe are shortening the gap between a network alert and a customer-impact incident. The 61 minutes between 16:44 and 17:45 were spent diagnosing the network, not the customer path, and origin SLO data was available the whole time.\n", "B": "Congestion between Cloudflare and AWS us-east-1 on 21 August 2025\n\nOn 21 August 2025, between 16:27 and 20:18 UTC, customers whose origins sit in AWS us-east-1 saw elevated latency, timeouts and reduced throughput on traffic between Cloudflare and that region. The cause was network congestion on the links between the two networks, made worse by an automated attempt to relieve it. This was not an attack, and it was not a BGP hijack. Cloudflare's global network was unaffected; the impact was confined to paths into and out of us-east-1.\n\nWhat happened\n\nAt approximately 16:27 UTC a single customer began requesting cached objects from us-east-1 in large volume. The responses roughly doubled total Cloudflare-to-AWS traffic and saturated every direct peering link between the two networks. Two conditions that predated the event narrowed the headroom we had. One direct peering link was running at half its normal capacity following an earlier hardware failure, and the Data Center Interconnect to an offsite interconnection switch was already scheduled for a capacity upgrade it had not yet received.\n\nAt 16:37 UTC, AWS began withdrawing BGP advertisements on congested private network interconnects in order to shed load. This is a standard response, and in isolation a reasonable one. In this case it moved traffic onto peering links reached through the offsite interconnection switch, which then saturated as well. The withdrawals also removed AWS prefixes from paths that were not congested, so the traffic engineering options normally available to us were narrowed at the moment we most needed them.\n\nRouter queues grew on both sides. Our edge routers began dropping packets, including packets we classify as high priority. Customers experienced this as slow connections to origin, request timeouts, and low throughput. Our own synthetic monitoring of origin requests shows the share of requests missing the latency SLO tracking the packet drop rate closely throughout the event.\n\nTimeline (UTC)\n\n16:27 \u2014 Customer traffic to us-east-1 begins ramping; direct peering links saturate.\n16:37 \u2014 AWS begins withdrawing BGP advertisements on congested PNIs; traffic shifts to the offsite interconnection switch, which also saturates.\n16:44 \u2014 Our network team is alerted to congestion in Ashburn (IAD).\n16:45 \u2014 Responders determine that otherwise uncongested paths are no longer carrying AWS prefixes as a result of the withdrawals.\n17:22 \u2014 Dropped traffic increases.\n17:45 \u2014 A customer-impact incident is declared.\n19:05 \u2014 Rate-limiting applied to the customer whose traffic triggered the event; congestion begins to fall.\n19:27 \u2014 Traffic engineering fully resolves congestion on our side.\n19:45 \u2014 AWS begins reverting the BGP withdrawals.\n20:07 \u2014 AWS completes normalization of announcements over the IAD PNIs.\n20:18 \u2014 Impact ends.\n\nLatency remained elevated for a period after packet drops subsided. That gap is expected: both networks were renormalizing prefix advertisements, and traffic settled back onto its usual paths gradually rather than all at once.\n\nWhat we are doing about it\n\nThree things went wrong here, and each gets its own remedy.\n\nCapacity. The half-capacity peering link and the pending DCI upgrade both removed margin that would have absorbed this surge. We are restoring the degraded link to full capacity and accelerating the DCI upgrade to the offsite switch.\n\nDetection. Forty-four minutes is too long to reach the responding team. We are tightening alerting on interconnect utilization so congestion between us and a major cloud provider pages before queues build, and we are adding alerting on sudden prefix withdrawals from a peer so that the second-order effect is visible immediately rather than discovered during triage.\n\nBlast radius. A single customer's request pattern should not be able to saturate an interconnect shared by everyone. We are extending per-customer rate controls on origin-bound traffic so that this kind of surge is shaped automatically, well before it becomes an incident, instead of requiring a manual intervention two and a half hours in.\n\nWe are also working with AWS on load-shedding behavior that does not remove the alternate paths both networks depend on during congestion. We regret the disruption, and we are treating the detection gap in particular as the part of this we most need to fix.\n"}, {"pair_id": "p057", "brief": "Raw material, Cloudflare, 18 November 2025 incident, downstream blast radius only, all times UTC. Workers KV returned heavily elevated 5xx because its front-end gateway calls the core proxy, which was failing. At 13:04 a patch let Workers KV bypass the core proxy; everything downstream of KV, including Access, saw error rates fall. Cloudflare Access saw widespread authentication failures from the start of the incident until the 13:05 rollback. Existing Access sessions kept working. Every failed authentication ended at an error page, so no user reached a target application while auth was broken, and successful logins during the window were logged correctly. Access configuration updates attempted during the window either failed outright or propagated very slowly; all have since been recovered. The Dashboard depends on Workers KV internally and on Turnstile in the login flow; Turnstile failed to load, so anyone without an active session could not log in. Dashboard availability dropped across two separate windows: 11:30 to 13:10, ended by the KV bypass at 13:10, and 14:40 to 15:30, caused by a backlog of queued login attempts plus retries after the feature file was restored, ended by scaling control plane concurrency around 15:30. Email Security kept processing and delivering mail but lost access to an IP reputation source, reducing spam-detection accuracy and suppressing some new-domain-age detections; some Auto Move actions failed and were later remediated. CDN response latency also rose because debugging and observability systems consumed large amounts of CPU enriching uncaught errors. Write the impact analysis section of the postmortem for affected enterprise customers.", "A": "Other systems that rely on our core proxy were impacted during the incident. This included Workers KV and Cloudflare Access. The team was able to reduce the impact to these systems at 13:04, when a patch was made to Workers KV to bypass the core proxy. Subsequently, all downstream systems that rely on Workers KV (such as Access itself) observed a reduced error rate. The Cloudflare Dashboard was also impacted due to both Workers KV being used internally and Cloudflare Turnstile being deployed as part of our login flow. Turnstile was impacted by this outage, resulting in customers who did not have an active dashboard session being unable to log in. This showed up as reduced availability during two time periods: from 11:30 to 13:10, and between 14:40 and 15:30, as seen in the graph below. The first period, from 11:30 to 13:10, was due to the impact to Workers KV, which some control plane and dashboard functions rely upon. This was restored at 13:10, when Workers KV bypassed the core proxy system. The second period of impact to the dashboard occurred after restoring the feature configuration data. A backlog of login attempts began to overwhelm the dashboard. This backlog, in combination with retry attempts, resulted in elevated latency, reducing dashboard availability. Scaling control plane concurrency restored availability at approximately 15:30.", "B": "Impact analysis\n\nEvery product described below failed for one reason: it called the core proxy, directly or through Workers KV, and the core proxy was returning errors. Workers KV sits one hop away because its front-end gateway routes requests through that proxy, so KV returned heavily elevated 5xx for the length of the incident, and each service reading from KV inherited KV's failure rate. At 13:04 we deployed a patch that let Workers KV bypass the core proxy. Error rates fell across KV and across everything downstream of it, including Access, from that minute onward. All times below are UTC.\n\nCloudflare Access failed authentication requests from the start of the incident until the rollback at 13:05. Two boundaries matter for your security review. Existing Access sessions kept working throughout, so users already inside an application were never logged out and never re-challenged. Every failed authentication terminated at an error page, which means no user reached a target application while authentication was broken; the failure mode was closed, not open. Logins that did succeed inside the window were logged correctly, so your audit trail for that period is complete and you can reconcile it against your SIEM without adjustment.\n\nAccess configuration updates attempted during the window either failed outright or propagated very slowly. We have since recovered all of them. If you pushed a policy, application, or group change during the incident and saw it either error or sit unapplied, check its current state now and confirm the recovered version is the one you intended, because a slow propagation and a failed write look identical from the dashboard.\n\nThe Dashboard lost availability across two separate windows with two separate causes. The first ran from 11:30 to 13:10 and ended when the Workers KV bypass took effect at 13:10; the Dashboard depends on Workers KV internally, and its login flow depends on Turnstile, which failed to load. Anyone holding an active session could keep working, and anyone without one could not log in at all. The second window ran from 14:40 to 15:30 and was not a relapse of the first. Restoring the feature file released a backlog of queued login attempts, those attempts arrived alongside client retries, and the combined load exceeded control plane capacity. Scaling control plane concurrency around 15:30 cleared it.\n\nEmail Security processed and delivered mail throughout, with degraded detection quality. The service lost access to an IP reputation source, which reduced spam-detection accuracy and suppressed some new-domain-age detections for the duration. No mail was dropped. Some Auto Move actions failed during the window and we have remediated them. Messages that would normally have been caught by reputation or domain-age signals may have landed in user inboxes, so we recommend re-scanning inbound mail from the window if your tenant handles high-value targets.\n\nCDN response latency rose for a reason unrelated to cache or origin health. Our debugging and observability systems consumed large amounts of CPU enriching uncaught errors, and that enrichment work competed with request serving on the same hosts. The CDN kept serving traffic; the cost of describing the failure is what slowed it down.\n\nTwo checks are worth running against your own records. Compare your Access authentication logs for 11:30 to 13:05 against expected volume to size how many of your users hit the error page, and diff any Access configuration you changed on 18 November against what is live now.\n"}, {"pair_id": "p058", "brief": "Raw material for the version-skew section of the in-place pod resize KEP. Timeline: the CRI changes merged in v1.25 so runtimes could implement support; containerd added support in 1.6.9. Older clients that do not know the ResizePolicy fields send them as nil, and the API server copies the non-nil values from the old pod forward. The skew problem: before v1.31, with InPlacePodVerticalScaling off, the kubelet read a resource mutation as a change to the container definition and restarted the container with the new values, which can over-subscribe the node. From v1.31 the kubelet no longer treats a resource change as a definition change and does not restart; the new value then takes effect only if the container restarts for some unrelated reason, so the change is nondeterministic and never reflected in the API. Both outcomes are bad, so the API server must reject a resize when the kubelet handling that pod lacks the feature. There is no direct signal, so the proxy is .status.containerStatuses[*].resources, which the kubelet sets on running containers if and only if the feature is enabled; note it is set to an empty {} even when the container declares no requests. Decision logic: feature gate off means reject; otherwise look at the first running container and allow only if its status resources are non-nil; with no running containers, allow. An unscheduled pod may be resized, with the new values used at scheduling and start. A scheduled pod with no running containers gives no signal, so resize is allowed and the node may end up over-provisioned. A race exists where a resize on a non-running container is admitted while the kubelet starts it: before v1.31 the container restarts with the new values, after v1.31 it keeps the old ones. Write the version-skew section for KEP reviewers.", "A": "Version skew strategy\n\nThe CRI changes for in-place resize merged in v1.25, which let runtimes implement support on their own schedule; containerd shipped it in 1.6.9. Skew therefore spans three independent components -- client, API server, and kubelet -- and each one fails differently when it is older than the others.\n\nOlder clients do not know the ResizePolicy fields and send them as nil. The API server copies the non-nil values from the old pod forward, so a stale client that round-trips a pod spec cannot silently erase a resize policy the pod already carries.\n\nKubelet skew is the case that can damage a node. Before v1.31, with InPlacePodVerticalScaling disabled, the kubelet read a resource mutation as a change to the container definition and restarted the container with the new values. A node running several such pods can be over-subscribed by the sum of the increases, because nothing on that path consults the node allocatable budget. From v1.31 the kubelet stops treating a resource change as a definition change and does not restart the container. The new value then takes effect only if the container restarts for an unrelated reason -- an OOM kill, a liveness probe failure, an image pull after eviction -- and the API never reflects the change. One behavior over-subscribes the node and the other is nondeterministic. Neither is acceptable, and the API server must reject a resize whenever the kubelet handling that pod lacks the feature.\n\nNo field reports kubelet feature state directly. We use .status.containerStatuses[*].resources as the proxy: the kubelet populates it on running containers if and only if InPlacePodVerticalScaling is enabled. Read the field as a presence test, not as a resource value. A container that declares no requests or limits still gets an empty {} written there, which is non-nil and counts as support.\n\nAdmission then runs three checks in order. If the feature gate is off at the API server, reject the resize. Otherwise find the first running container in the pod and allow the resize only when its status resources are non-nil. If the pod has no running containers, allow the resize.\n\nThree cases follow from that last branch, and two of them are gaps we are accepting.\n\nAn unscheduled pod may always be resized. The scheduler has not placed it, the new values are what it is scheduled and started with, and no node has committed capacity yet.\n\nA scheduled pod with no running containers gives us no signal at all. We allow the resize, and if that node's kubelet is older than v1.31 the containers start with values the scheduler never accounted for, leaving the node over-provisioned. Detecting this would require a per-node feature advertisement that does not exist today.\n\nA race exists at the boundary between those two states. Admission can accept a resize against a non-running container at the same moment the kubelet is starting it. Before v1.31 the container restarts and picks up the new values; from v1.31 it keeps the old ones. The window is one kubelet sync period wide, roughly 10 seconds by default, and closing it needs a compare-and-swap on container status that the current API does not offer.\n\nBoth gaps close once every kubelet in the cluster is at v1.31 or newer with the gate enabled. Until then, operators running mixed-version node pools should expect resizes on not-yet-started pods to land on a best-effort basis.\n", "B": "CRI changes were merged in v1.25 in order to enable runtimes to implement support. - containerd added support for this feature in 1.6.9 Previous versions of clients that are unaware of the new ResizePolicy fields would set them to nil. API server mutates such updates by copying non-nil values from old Pod to the current Pod. Prior to v1.31, with InPlacePodVerticalScaling disabled, the kubelet interprets mutation to Pod Resources as a Container definition change and will restart the container with the new Resources. This could lead to Node resource over-subscription. In v1.31, the kubelet no longer considers resource changes a change in the pod definition and doesn't restart the container. In this case, the change to the new resource value happens if the container is restart for any other reason, making the change non-deterministic and not reflected in the API. Both of these cases are undesirable, so the API server should reject a resize request if the Kubelet does not support it (InPlacePodVerticalScaling enabled). To achieve this, the apiserver will check if the `.status.containerStatuses[*].resources` field is non-nil on any running containers. This field is set by the kubelet on running containers if and only if IPPVS is enabled, and can therefore be used as a proxy to determine if the Kubelet running the pod has the feature enabled. The apiserver logic to determine if a resource mutation is allowed then becomes: ```go if !InPlacePodVerticalScaling { return false } for _, c := range pod.Status.ContainerStatuses { if c.State.Running != nil { return c.Resources != nil } } // No running containers return true ``` Note that even if the container does not specify any resources requests, the status Resources is still set to the non-nill empty value `{}`. If a pod has not yet been scheduled, the resize is allowed, and the new values are used when scheduling & starting the pod. If a pod has been scheduled but does not have any running containers, there is no signal indicating whether the assigned node supports resize, so we default to allowing resize. If the node does not have resize enabled in this case, then a resized container will be started with the new resource value. It is possible that the node could end up over-provisioned in this case. It is also possible for a race condition to occur: resize on a non-running container is allowed, but the Kubelet simultaneously starts the container. The resulting behavior would depend on the version: prior to v1.31, the container is restarted with the new values. After v1.31, the container continues running with the old resource values. Since this race condition only exists during enablement skew, we choose to accept it as a known-issue."}, {"pair_id": "p059", "brief": "Netflix, December 2018, kernel 4.4.0-1072-aws, 16-CPU instance. A service team reported that uploads of roughly 100-Gbyte files ran for hours, while uploads of files up to 40 Gbytes finished in minutes. The affected service encrypts large files and ships them to S3. The slow uploads lined up with a paging spike in Atlas, the cloud-wide monitoring tool - specifically pageins, which count pages faulted in off disk; plenty of healthy workloads generate them, so the signal is suggestive rather than damning.\n\nInvestigation started from the 60-second performance checklist. iostat -xz 1 during a large upload, device xvdb: r/s 734 to 750, rkB/s 91,656 to 92,152, avgrq-sz 246 to 250, avgqu-sz about 25, r_await 33 to 34 ms, %util pegged at 100. CPU over the same seconds: about 14.8% user and 24 to 30% iowait. Reads are the operations applications block on; writes often are not, because of write-back caching. A 33 ms read wait is high, and it tracks the queue depth rather than any slowness in the device. Dividing rkB/s by r/s puts the I/O size at about 128 Kbytes - large.\n\nNext tool: biolatency -m from bcc, an eBPF latency histogram, run in case per-second averages were concealing device-level outliers. Buckets: 8,139 I/O at 32-63 ms, 1,620 at 16-31 ms, 176 at 64-127 ms, 95 at 128-255 ms, 61 at 256-511 ms, 93 at 512-1023 ms, 83 at 0-1 ms. The bulk of the I/O falls between 16 and 127 ms with a tail stretching to 0.5-1.0 s, all of it consistent with the queueing already visible in iostat. Reading: workload, not device.\n\nThen bitesize from bcc, to check the size distribution for anything anomalous: process name java, 1,682 I/O in the 128-255 Kbyte bucket, only tens in every other bucket - consistent with iostat, nothing unusual.\n\nWrite the opening diagnosis section of a case-study post for systems and performance engineers.", "A": "Uploads of 100-Gbyte files ran for hours while 40-Gbyte files finished in minutes, and that nonlinearity is the finding worth chasing. A 2.5x increase in file size bought roughly a 20x increase in wall time. Linear resource exhaustion -- a saturated NIC, a CPU-bound cipher, a throttled device -- does not produce that shape. Something changes state between 40 and 100 Gbytes. The service encrypts large files and ships them to S3, running on a 16-CPU AWS instance under kernel 4.4.0-1072-aws, December 2018.\n\nAtlas, the cloud-wide monitoring tool, showed a paging spike over the slow window, specifically pageins, which count pages faulted in off disk. Plenty of healthy workloads generate pageins, and the instance was not swapping in any obvious way, so treat this as a direction to look rather than a diagnosis. It does agree with the size threshold: pageins rise when a working set stops fitting in memory.\n\nWe started from the 60-second checklist. Here is iostat -xz 1 during a large upload, device xvdb: r/s 734 to 750, rkB/s 91,656 to 92,152, avgrq-sz 246 to 250, avgqu-sz about 25, r_await 33 to 34 ms, %util pegged at 100. CPU over the same seconds ran about 14.8% user and 24 to 30% iowait. At 27% iowait across 16 CPUs, 4.3 CPUs' worth of capacity sat blocked in disk wait while user code burned 2.4.\n\nReads are the operations applications block on; writes often are not, because the page cache absorbs them and flushes later. A 33 ms read wait is high for an EBS volume. Check where it comes from before blaming the device: queue depth divided by completion rate gives 25 / 740 = 33.8 ms, which reproduces the measured 33 to 34 ms to within the rounding of the inputs. The latency is the queue. The device is servicing requests at the rate it always does, and 25 of them are stacked up waiting their turn.\n\nThat also disarms %util. At 100% the column means the device had at least one request outstanding during every sampling interval, which for a virtual, network-attached, internally parallel block device is a statement about continuous demand and not about a hardware limit being reached.\n\nDividing rkB/s by r/s puts the average read at 123 to 125 Kbytes. That is large, and large reads at a steady 92 Mbytes/s are the signature of sequential streaming, not of scattered metadata access. Note the arithmetic on the complaint: one pass over 100 Gbytes at 92 Mbytes/s costs 1,113 seconds, about 19 minutes. Hours means the file is being read several times over, or the stream stalls for long stretches, or both.\n\nPer-second averages can hide device-level outliers, so we ran biolatency -m from bcc, an eBPF histogram of block I/O completion times. Of 10,267 sampled I/O, 8,139 landed in the 32-63 ms bucket and 1,620 in 16-31 ms; 96.8% of all I/O fell between 16 and 127 ms. The tail reached 512-1023 ms, but only 154 I/O, 1.5% of the sample, exceeded 256 ms. No bimodality, no cliff, no cluster of multi-second completions. The distribution is centered exactly where Little's law said queueing would put it.\n\nbitesize from bcc, which buckets I/O size by process, attributed 1,682 I/O to java in the 128-255 Kbyte bucket with only tens in every other bucket. One process, one size class, matching the iostat average.\n\nFour tools agree, and none of them accuses the storage device. The workload is issuing large sequential reads faster than the volume will retire them, and the queue it builds accounts for the full observed latency. The open question is why a file this size generates disk reads at all, given that 40-Gbyte files apparently do not. Run the upload against files stepped from 40 to 100 Gbytes and watch where pageins begin; the size at which they appear should name the memory boundary being crossed.\n", "B": "Uploads got 2.5x bigger and got two orders of magnitude slower\n==============================================================\n\nThe most informative number in the original report arrived before anyone ran a\ntool. A service that encrypts large files and ships them to S3, running on a\n16-CPU AWS instance on kernel 4.4.0-1072-aws, finishes files up to 40 Gbytes in\nminutes and takes hours on files of roughly 100 Gbytes. Going from 40 to 100\nGbytes multiplies the bytes by 2.5 and multiplies the wall clock by something\ncloser to 100. A cliff that sharp between two sizes says a resource ran out\nsomewhere between them. Atlas showed a pageins spike over the same window.\nPageins count pages faulted in off disk and plenty of healthy workloads generate\nthem, so that is an arrow and not a verdict.\n\nStart with the 60-second checklist. `iostat -xz 1` during a large upload, device\nxvdb: r/s 734 to 750, rkB/s 91,656 to 92,152, avgrq-sz 246 to 250, avgqu-sz about\n25, r_await 33 to 34 ms, %util pegged at 100. Divide rkB/s by r/s and each read is\nabout 124 Kbytes, which agrees with avgrq-sz at 512 bytes per sector. The device\nis delivering roughly 92 Mbytes/s of reads in 128-Kbyte units, and the writes are\nnot interesting here because applications block on reads while write-back caching\nusually lets them walk away from writes.\n\nA 33 ms read wait looks alarming and is not evidence of a slow device. Apply\nLittle's law to the queue: 25 outstanding requests divided by 742 completions per\nsecond is 33.7 ms, which reproduces r_await to the digit. Every millisecond of\nthat wait is accounted for by the 25 requests already in front. Per-I/O service\ntime is 1/742 s, about 1.3 ms, which is ordinary for network-attached storage\ndoing large reads. %util at 100 means the queue was never empty during the\nsampling interval, and on a device that services requests concurrently that is a\nstatement about the submitter, not about the disk.\n\nThe CPU numbers point the same way. About 14.8% user across 16 CPUs is 2.4 cores\nbusy, and encryption is the kind of work that should saturate cores if it were\nthe bottleneck. Iowait sat at 24 to 30%. The job is waiting on storage with most\nof the machine idle.\n\nPer-second averages can hide device-level outliers, so the next tool was\n`biolatency -m` from bcc, an eBPF histogram of block I/O latency. Buckets: 83 I/O\nat 0-1 ms, 1,620 at 16-31 ms, 8,139 at 32-63 ms, 176 at 64-127 ms, 95 at 128-255\nms, 61 at 256-511 ms, 93 at 512-1023 ms. That is 9,935 of 10,267 samples, 96.8%,\nlanding between 16 and 127 ms, with 0.9% stretching past half a second. The\ndistribution has the shape queueing produces: a dense body sitting where 25-deep\nqueueing puts it and a thin tail from the moments the queue ran deeper. Nothing\nhere is a device that occasionally stalls for a second while otherwise behaving.\nThe histogram agrees with iostat and adds no new suspect.\n\n`bitesize` next, to check whether the request sizes hide anything anomalous: 1,682\nI/O from process `java` in the 128-255 Kbyte bucket and only tens in every other\nbucket. One process is issuing essentially one size of read. There is no\nsmall-random-I/O pathology tucked underneath the large-I/O average, which is the\nusual reason to look.\n\nAll three tools describe the same well-behaved storage workload, which is why the\narithmetic on the file itself is the real finding. Encrypting a file and shipping\nit requires reading it once. Reading 100 Gbytes at 92 Mbytes/s takes 1,087\nseconds, about 18 minutes, and these uploads run for hours. The device is\ntherefore handing the application the file several times over. Put that beside the\npageins spike and the cliff between 40 and 100 Gbytes and one hypothesis covers\nall three observations: the smaller file fits in page cache and the larger one\ndoes not, so pages get evicted and re-read. A 16-CPU AWS instance of that\ngeneration carries 64 Gbytes of memory, which sits exactly between the fast size\nand the slow one, though the ticket never recorded the instance type. The next\nquestion is which code path issues those reads and at what offsets.\n"}, {"pair_id": "p060", "brief": "Raw material. Three cost claims. Turning written business logic into code now costs approximately zero. Integrating services and libraries, the plumbing, also costs approximately zero. Building efficient, reliable, secure, end-to-end systems is starting to get cheaper, but slowly. Two possible readings of that moment. Reading one: the end of programming as a high-value economic craft, following weaving, ploughing, and coopering. Supporting anecdote: a mostly retired expert in analog circuit design who, in the late 1960s, founded a hardware company with friends on the bet that serious customers would reject digital logic; the 74 series had just launched and they found it graceless, unreliable, and full of problems. Measured by the ratio of transistors in digital versus analog circuits in 2026, the bet was wrong by ten or more orders of magnitude, yet he still made a small fortune, enough to keep his children comfortable, because the world changes slower than anyone would like. Reading two: new tools bring new industries, research fields, and careers. Amdahl's Law explains where the value moves: speeding up one portion of a problem makes that portion a shrinking share of total time. What remains sticky: real-world feedback loops, human stubbornness, occasional adversaries. Integration, translation, simple analysis, and small-scale synthesis are solved; genuinely new ideas are not, and grow more valuable as the lever lengthens. Write a technical strategy document for an engineering organisation deciding where to invest over the next decade.", "A": "Where engineering investment goes over the next decade\n\nThree cost claims\n\nThree claims about cost frame everything below, and only the third one is still a decision.\n\nFirst, turning written business logic into code now costs approximately zero. A specification precise enough for two engineers to argue about is a specification precise enough to generate from, and the generation is fast and usually right. Second, the plumbing -- integrating services, wiring libraries, translating one schema into another -- also costs approximately zero. Both of these were, for thirty years, most of what we paid engineers to do. Third, building an efficient, reliable, secure, end-to-end system is starting to get cheaper, but slowly. That third rate is the one we have to plan around, because it is the one that will still be setting our schedule in 2036.\n\nAmdahl's Law says where the money goes\n\nThe asymmetry between those three rates is the whole strategy, and Amdahl's Law gives it a number. Suppose translation and plumbing were 60 percent of an engineer's week and the sticky work was the other 40 percent. Drive the first portion to zero and the week takes 0.4 of what it did: a 2.5x speedup, and the sticky work has gone from 40 percent of the time to 100 percent of it. Now make the tools better instead of perfect. At 100x on that portion the week takes 0.6/100 + 0.4 = 0.406, a 2.46x speedup. The second improvement, a hundredfold one, bought 1.6 percent. Run the arithmetic yourself with whatever split you believe for your own team; the ceiling moves but the shape does not. Every further dollar spent making code generation better is a dollar spent on a shrinking share of the problem.\n\nTwo readings of this moment\n\nThe pessimistic reading is that programming is ending as a high-value economic craft, joining weaving, ploughing, and coopering. It is not a silly reading. Those crafts did not decline because the practitioners got worse; they declined because the scarce thing moved somewhere else, and the people who held the old skill held an asset that stopped appreciating.\n\nA story about timing, not direction\n\nA mostly retired analog circuit designer I know founded a hardware company with friends in the late 1960s, on the explicit bet that serious customers would reject digital logic. The 74 series had just launched and they found it graceless, unreliable, and full of problems -- an accurate description of the parts in front of them at the time. Measured by the ratio of transistors in digital versus analog circuits in 2026, the bet was wrong by ten or more orders of magnitude. He still made a small fortune, enough to keep his children comfortable, because the world changes slower than anyone would like. A bet can be wrong by ten orders of magnitude on direction and still pay, if it is right about the rate. We should assume the same courtesy will not be extended twice, and we should also not confuse a correct call on direction with a correct call on timing.\n\nWhat stays expensive\n\nThe optimistic reading is that new tools create new industries, research fields, and careers, and the evidence for it is the list of things that remain stubbornly expensive. Real-world feedback loops are first: the code was never the hard part of knowing whether a change helped, and a shipped experiment that takes three weeks to read out still takes three weeks. Human stubbornness is second -- an organisation that will not change its approval process is a constraint no model dissolves. Adversaries are third, and they get the same tools we do. Integration, translation, simple analysis, and small-scale synthesis are solved. Genuinely new ideas are not, and they grow more valuable as the lever under them lengthens.\n\nWhere we invest\n\nFour commitments follow, and we should be willing to be held to them.\n\nHire and promote for problem formulation, not throughput. The engineer who can state what we are actually optimising is now the bottleneck resource, and we currently reward the one who closes the most tickets.\n\nFund the feedback apparatus: telemetry, replay corpora, evaluation harnesses, and the ability to run a real experiment in days. This is unglamorous infrastructure and it is where the remaining 40 percent lives.\n\nStop staffing integration and translation as careers. Absorb them into the tooling budget and redeploy the people; do not run a team whose product is a shrinking share of total time.\n\nKeep reliability and adversarial work in-house and senior. Both compound on institutional memory that no tool holds for us.\n\nHow we would know we are wrong\n\nInstrument the third cost claim rather than argue about it. Track the median wall-clock time from a green build to a fully ramped production change across our top twenty services, and publish it quarterly. If that number halves inside two years, the expensive portion is moving faster than this document assumes and we reweight the four commitments against fresh arithmetic.\n", "B": "Where We Invest Engineering Effort, 2026-2036\n\nStatus: proposal for org-level planning. Owner: platform leadership.\n\nThree cost claims\n\nTurning written business logic into code now costs us approximately zero. A specification precise enough to argue about is already close enough to compile; the model fills the gap. The same holds for plumbing. Wiring a service to a queue, a store, and three internal libraries used to be a week of a mid-level engineer's time, and it is now an afternoon of review.\n\nBuilding an efficient, reliable, secure, end-to-end system is getting cheaper more slowly. The cost that remains sits in the parts that touch the world: capacity planning under real traffic, failure modes that only appear at the ninety-ninth percentile, key rotation, the migration nobody can roll back. These costs are falling. They are not falling at the rate the first two did.\n\nTwo readings of that moment\n\nReading one says programming stops being a high-value economic craft, and joins weaving, ploughing, and coopering. A mostly retired analog circuit designer I know founded a hardware company with friends in the late 1960s on the bet that serious customers would reject digital logic. The 74 series had just launched; they found it graceless, unreliable, and full of problems. Measured by the ratio of transistors fabricated in digital versus analog circuits in 2026, that bet was wrong by ten or more orders of magnitude. He still made a small fortune, enough to keep his children comfortable, because the world changes slower than anyone would like.\n\nReading two says new tools open new industries, research fields, and careers. Both readings can be true on different clocks, and the ten-year horizon of this document sits inside the gap between them. We plan for reading two and we staff for the lag.\n\nAmdahl's Law names where the value goes\n\nSpeeding up one portion of a problem makes that portion a shrinking share of total time. Assume code production was 40% of the calendar time to ship a service, a figure we should measure instead of assuming. Drive it to zero and the team ships 1.67x faster, and every further improvement to code generation is bounded by the 60% it never touched. A tenfold improvement on a portion already near zero returns nothing. The leverage has moved into the remaining 60%, and that is where the next decade of headcount belongs.\n\nMeasure your own ratio before accepting ours. Take the last three launches. Split the calendar days into hours spent producing code and hours spent on everything else -- design argument, load testing, security review, incident response, and the meetings that changed the requirement. The second number is the one that now determines when you ship.\n\nWhat stays expensive\n\nThree things resist the tools. Real-world feedback loops stay expensive because you cannot generate the traffic, the customers, or the regulator; you have to go and get the signal, and the loop runs at the speed of the world. Human stubbornness stays expensive because requirements move for reasons no specification contains. Adversaries stay expensive because they adapt to whatever we shipped, which makes security a game against a reasoning opponent instead of a checklist.\n\nIntegration, translation, simple analysis, and small-scale synthesis are solved. Genuinely new ideas are not, and they grow more valuable as the lever lengthens: an idea that a team of six can now build in a quarter was a two-year program in 2020.\n\nWhere we invest\n\nShift the ratio of the organisation toward the sticky 60% over three planning cycles. Concretely:\n\nGrow production engineering and security, not application teams. Every application team gets faster with tooling we already buy. Reliability and adversarial work do not, and they are where our unshipped capacity accumulates.\n\nFund measurement infrastructure as a first-class product. Faster feedback loops are the only lever on the constraint that the tools cannot touch, and a loop that closes in a day instead of a week is worth more than a further 2x on code generation.\n\nHire and protect people who generate original ideas, and give them the leverage. One good hypothesis now converts into a running system in weeks. Judge these teams on hypotheses tested per quarter, not on lines shipped.\n\nStop staffing against code volume. Team sizing that keys off estimated engineering-weeks of implementation is measuring the portion we just drove to zero.\n\nHow we will know this is wrong\n\nTrack the split from the measurement above quarterly. If hours outside code production fall below 50% of delivery time within two years, the third cost claim is wrong, the tools are eating reliability and security faster than we predicted, and this plan over-staffs a shrinking problem. If the split holds above 70%, we are under-investing in the constraint and should move faster than three cycles.\n"}]; let i=0; const L=JSON.parse(localStorage.getItem('sw_labels')||'{}');
